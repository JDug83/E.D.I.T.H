<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>E.D.I.T.H.</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #020609;

    color: #00d9ff;

    font-family: Arial, sans-serif;
}


/* =====================================================
   WEBXR HUD
===================================================== */

#hud {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 5;

    background: transparent;

    color: #00d9ff;

    visibility: visible !important;
}


/*
 * IMPORTANT:
 *
 * When Quest enters WebXR, keep the HUD transparent.
 * The headset supplies the passthrough background.
 */

#hud * {
    pointer-events: none;
}


/*
 * Controls that need to be clickable.
 */

#settingsButton,
#vrButton,
#sendButton,
#manualInput,
#saveKey,
#closeSettings,
#settings input,
#settings button {

    pointer-events: auto;
}


/* =====================================================
   CAMERA PREVIEW
===================================================== */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 0;
}


/* =====================================================
   E.D.I.T.H. LOGO
===================================================== */

.logo {

    position: absolute;

    top: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 34px;

    font-weight: bold;

    letter-spacing: 9px;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff,
        0 0 40px #008cff;
}


.online {

    position: absolute;

    top: 73px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 11px;

    letter-spacing: 4px;

    color: #00ff88;
}


/* =====================================================
   TARGET
===================================================== */

.target {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 160px;
    height: 160px;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(0,217,255,.75);

    border-radius: 50%;

    box-shadow:
        0 0 20px #00d9ff,
        inset 0 0 20px
        rgba(0,217,255,.15);
}


.target:before {

    content: "";

    position: absolute;

    width: 220px;
    height: 1px;

    left: -32px;
    top: 78px;

    background: #00d9ff;
}


.target:after {

    content: "";

    position: absolute;

    width: 1px;
    height: 220px;

    top: -32px;
    left: 78px;

    background: #00d9ff;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    position: absolute;

    left: 25px;
    bottom: 25px;

    width: 270px;

    padding: 18px;

    background:
        rgba(0,10,18,.72);

    border-left:
        2px solid #00d9ff;

    backdrop-filter:
        blur(10px);
}


.status h2 {

    margin: 0 0 13px;

    font-size: 13px;

    letter-spacing: 3px;
}


.status p {

    margin: 8px 0;

    color: #aaa;

    font-size: 12px;
}


.green {
    color: #00ff88;
}

.yellow {
    color: #ffff00;
}

.red {
    color: #ff4050;
}


/* =====================================================
   AI RESPONSE
===================================================== */

#response {

    position: absolute;

    left: 50%;

    bottom: 125px;

    transform:
        translateX(-50%);

    width: 60%;

    max-width: 700px;

    text-align: center;

    color: white;

    font-size: 18px;

    line-height: 1.5;

    text-shadow:
        0 0 10px #00d9ff;

    max-height: 180px;

    overflow: hidden;
}


/* =====================================================
   MANUAL INPUT
===================================================== */

#manualInputBox {

    position: absolute;

    left: 50%;

    bottom: 35px;

    transform:
        translateX(-50%);

    width: min(650px, 70%);

    display: flex;

    gap: 8px;

    pointer-events: auto;
}


#manualInput {

    flex: 1;

    min-width: 0;

    padding: 12px 14px;

    border:
        1px solid
        rgba(0,217,255,.7);

    background:
        rgba(0,10,18,.85);

    color: white;

    outline: none;

    font-size: 14px;

    pointer-events: auto;
}


#manualInput::placeholder {
    color: #66808a;
}


#sendButton {

    padding:
        12px 18px;

    pointer-events: auto;
}


/* =====================================================
   START SCREEN
===================================================== */

#start {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #041824,
            #020609 70%
        );
}


#start h1 {

    margin: 0;

    font-size: 52px;

    letter-spacing: 11px;

    text-shadow:
        0 0 15px #00d9ff,
        0 0 40px #00d9ff;
}


#start p {

    color: #777;

    line-height: 1.7;

    letter-spacing: 2px;
}


/* =====================================================
   BUTTON
===================================================== */

button {

    padding:
        12px 18px;

    color: #00d9ff;

    background:
        rgba(0,10,18,.9);

    border:
        1px solid #00d9ff;

    cursor: pointer;
}


button:hover {

    background: #00d9ff;

    color: #001018;
}


button:disabled {

    opacity: .5;

    cursor: default;
}


/* =====================================================
   VR BUTTON
===================================================== */

#vrButton {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 200;

    display: none;

    pointer-events: auto;
}


/* =====================================================
   SETTINGS
===================================================== */

#settingsButton {

    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 200;

    pointer-events: auto;
}


#settings {

    position: fixed;

    right: 20px;
    top: 70px;

    z-index: 300;

    width: 330px;

    padding: 20px;

    display: none;

    background:
        rgba(2,10,15,.98);

    border:
        1px solid #00d9ff;

    pointer-events: auto;
}


#apiKey {

    width: 100%;

    padding: 10px;

    background: #000;

    color: white;

    border:
        1px solid #00d9ff;
}


#error {

    color: #ff4050;

    font-size: 11px;

    margin-top: 10px;
}


/* =====================================================
   XR OVERLAY STYLING
===================================================== */

/*
 * Quest can apply the :xr-overlay state to
 * the DOM overlay root.
 */

#hud:where(:xr-overlay) {

    background: transparent !important;

    visibility: visible !important;
}


/*
 * In passthrough, make the HUD slightly easier
 * to see against the real world.
 */

#hud:where(:xr-overlay) .status {

    background:
        rgba(0,8,15,.78);

    border:
        1px solid
        rgba(0,217,255,.35);

    border-left:
        2px solid #00d9ff;
}


#hud:where(:xr-overlay) #response {

    text-shadow:
        0 0 5px #000,
        0 0 12px #00d9ff;
}


/*
 * Keep manual input usable in XR.
 */

#hud:where(:xr-overlay) #manualInputBox {

    pointer-events: auto;
}


#hud:where(:xr-overlay) #manualInput,
#hud:where(:xr-overlay) #sendButton {

    pointer-events: auto;
}


/* =====================================================
   MOBILE / QUEST SIZING
===================================================== */

@media (max-width: 700px) {

    .logo {

        font-size: 25px;

        letter-spacing: 6px;

        top: 18px;
    }


    .online {

        top: 55px;
    }


    .target {

        width: 120px;
        height: 120px;
    }


    .target:before {

        width: 170px;

        left: -27px;

        top: 58px;
    }


    .target:after {

        height: 170px;

        top: -27px;

        left: 58px;
    }


    .status {

        left: 12px;

        bottom: 85px;

        width: 220px;

        padding: 12px;
    }


    .status p {

        margin: 5px 0;

        font-size: 10px;
    }


    #response {

        width: 85%;

        bottom: 145px;

        font-size: 15px;
    }


    #manualInputBox {

        width: 90%;

        bottom: 25px;
    }


    #settings {

        right: 10px;

        width:
            calc(100% - 20px);
    }

}


/* =====================================================
   XR: MAKE EVERYTHING VISIBLE
===================================================== */

@media (display-mode: fullscreen) {

    #hud {

        visibility: visible !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CAMERA
===================================================== -->

<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="start">

    <h1>E.D.I.T.H.</h1>

    <p>
        ENHANCED DEFENCE<br>
        INTELLIGENCE &amp; THREAT SYSTEM
    </p>

    <button id="startButton">
        INITIALIZE E.D.I.T.H.
    </button>

    <p style="font-size:11px;color:#555">
        Say "E.D.I.T.H." once to begin.
    </p>

</div>


<!-- =====================================================
     E.D.I.T.H. HUD
===================================================== -->

<div id="hud">

    <div class="logo">
        E.D.I.T.H.
    </div>


    <div class="online">
        ● SYSTEM ONLINE
    </div>


    <div class="target"></div>


    <div class="status">

        <h2>SYSTEM STATUS</h2>

        <p>
            CAMERA:
            <span
                id="cameraStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            MICROPHONE:
            <span
                id="micStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            VOICE:
            <span
                id="voiceStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            AI:
            <span
                id="aiStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            XR:
            <span
                id="xrStatus"
                class="yellow">
                CHECKING
            </span>
        </p>

    </div>


    <div id="response">
        E.D.I.T.H. is ready.
    </div>


    <!-- =================================================
         MANUAL AI INPUT
    ================================================= -->

    <div id="manualInputBox">

        <input
            id="manualInput"
            type="text"
            autocomplete="off"
            placeholder="Ask E.D.I.T.H...">

        <button id="sendButton">
            SEND
        </button>

    </div>

</div>


<!-- =====================================================
     XR BUTTON
===================================================== -->

<button id="vrButton">

    ENTER E.D.I.T.H. PASSTHROUGH

</button>


<!-- =====================================================
     SETTINGS
===================================================== -->

<button id="settingsButton">

    ⚙ SETTINGS

</button>


<div id="settings">

    <h2>E.D.I.T.H. SETTINGS</h2>

    <p>Gemini API Key</p>

    <input
        id="apiKey"
        type="password"
        placeholder="Paste Gemini API key">

    <br><br>

    <button id="saveKey">
        SAVE
    </button>

    <button id="closeSettings">
        CLOSE
    </button>

    <div id="error"></div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const camera =
    document.getElementById("camera");

const cameraStatus =
    document.getElementById("cameraStatus");

const micStatus =
    document.getElementById("micStatus");

const voiceStatus =
    document.getElementById("voiceStatus");

const aiStatus =
    document.getElementById("aiStatus");

const xrStatus =
    document.getElementById("xrStatus");

const response =
    document.getElementById("response");

const vrButton =
    document.getElementById("vrButton");

const settings =
    document.getElementById("settings");

const settingsButton =
    document.getElementById("settingsButton");

const closeSettings =
    document.getElementById("closeSettings");

const saveKey =
    document.getElementById("saveKey");

const apiKeyInput =
    document.getElementById("apiKey");

const errorBox =
    document.getElementById("error");

const manualInput =
    document.getElementById("manualInput");

const sendButton =
    document.getElementById("sendButton");


/* =====================================================
   GEMINI KEY
===================================================== */

let apiKey =
    localStorage.getItem(
        "edith_gemini_key"
    ) || "";


apiKeyInput.value =
    apiKey;


if(apiKey){

    aiStatus.textContent =
        "READY";

    aiStatus.className =
        "green";
}


saveKey.onclick = () => {

    const key =
        apiKeyInput.value.trim();


    if(!key){

        errorBox.textContent =
            "Enter a Gemini API key.";

        return;
    }


    apiKey =
        key;


    localStorage.setItem(
        "edith_gemini_key",
        key
    );


    aiStatus.textContent =
        "READY";

    aiStatus.className =
        "green";


    settings.style.display =
        "none";

};


settingsButton.onclick = () => {

    settings.style.display =
        "block";
};


closeSettings.onclick = () => {

    settings.style.display =
        "none";
};


/* =====================================================
   CAMERA + MICROPHONE
===================================================== */

let mediaStream = null;


async function startMedia(){

    try{

        mediaStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:
                            "environment"

                    },

                    audio:{

                        echoCancellation:
                            true,

                        noiseSuppression:
                            true,

                        autoGainControl:
                            true

                    }

                });


        camera.srcObject =
            mediaStream;


        /*
         * Keep camera available for Gemini
         * image analysis, but don't show it
         * over Quest passthrough.
         */

        camera.style.display =
            "none";


        cameraStatus.textContent =
            "ONLINE";

        cameraStatus.className =
            "green";


        micStatus.textContent =
            "CONNECTED";

        micStatus.className =
            "green";


        return true;


    }catch(error){

        console.error(
            "MEDIA ERROR:",
            error
        );


        response.textContent =
            "Please allow the camera and microphone.";


        cameraStatus.textContent =
            "DENIED";

        cameraStatus.className =
            "red";


        micStatus.textContent =
            "DENIED";

        micStatus.className =
            "red";


        return false;
    }

}


/* =====================================================
   VOICE RECOGNITION
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let listening =
    false;

let edithStarted =
    false;

let conversationActive =
    false;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-GB";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            listening =
                true;


            voiceStatus.textContent =
                "LISTENING";


            voiceStatus.className =
                "green";
        };


    recognition.onresult =
        async(event) => {

            const result =
                event.results[
                    event.results.length - 1
                ];


            if(!result.isFinal)
                return;


            const spoken =
                result[0]
                    .transcript
                    .trim();


            console.log(
                "HEARD:",
                spoken
            );


            if(!spoken)
                return;


            /*
             * FIRST ACTIVATION
             */

            if(!edithStarted){

                if(
                    !spoken
                        .toLowerCase()
                        .includes("edith")
                ){

                    return;
                }


                edithStarted =
                    true;


                conversationActive =
                    true;


                const question =
                    spoken
                        .replace(
                            /edith/gi,
                            ""
                        )
                        .trim();


                if(!question){

                    response.textContent =
                        "Yes. How can I assist?";


                    speak(
                        "Yes. How can I assist?"
                    );


                    return;
                }


                await askGemini(
                    question
                );


                return;
            }


            /*
             * NORMAL CONVERSATION
             */

            if(conversationActive){

                await askGemini(
                    spoken
                );
            }

        };


    recognition.onerror =
        (event) => {

            console.log(
                "VOICE ERROR:",
                event.error
            );


            listening =
                false;


            if(
                event.error ===
                    "not-allowed" ||

                event.error ===
                    "service-not-allowed"
            ){

                voiceStatus.textContent =
                    "BLOCKED";


                voiceStatus.className =
                    "red";
            }

        };


    recognition.onend =
        () => {

            listening =
                false;


            if(mediaStream){

                setTimeout(
                    startListening,
                    700
                );

            }

        };

}else{

    /*
     * Quest Browser may not expose the
     * SpeechRecognition API.
     *
     * Manual input still works.
     */

    voiceStatus.textContent =
        "MANUAL";

    voiceStatus.className =
        "yellow";
}


/* =====================================================
   START LISTENING
===================================================== */

function startListening(){

    if(!recognition)
        return;


    if(listening)
        return;


    try{

        recognition.start();

    }catch(error){

        console.log(
            "Recognition:",
            error.message
        );
    }

}


/* =====================================================
   MANUAL QUESTION
===================================================== */

async function sendManualQuestion(){

    const question =
        manualInput.value.trim();


    if(!question)
        return;


    manualInput.value =
        "";


    edithStarted =
        true;


    conversationActive =
        true;


    await askGemini(
        question
    );

}


sendButton.onclick =
    sendManualQuestion;


manualInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            sendManualQuestion();
        }

    }
);


/* =====================================================
   CAMERA IMAGE
===================================================== */

function captureCamera(){

    if(
        !camera ||
        camera.readyState < 2 ||
        !camera.videoWidth
    ){

        return null;
    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const width =
        Math.min(
            1024,
            camera.videoWidth
        );


    const scale =
        width /
        camera.videoWidth;


    canvas.width =
        width;


    canvas.height =
        camera.videoHeight *
        scale;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return canvas
        .toDataURL(
            "image/jpeg",
            .7
        )
        .split(",")[1];

}


/* =====================================================
   GEMINI
===================================================== */

async function askGemini(
    question
){

    if(!apiKey){

        response.textContent =
            "Add your Gemini API key in Settings.";


        settings.style.display =
            "block";


        return;
    }


    aiStatus.textContent =
        "ANALYSING";


    aiStatus.className =
        "yellow";


    const image =
        captureCamera();


    const parts = [

        {

            text:

`You are E.D.I.T.H., a futuristic personal AI assistant.

User:
${question}

If a camera image is provided, use it to answer questions about the user's surroundings.

Only describe things actually visible.

Do not make things up.

Keep answers concise and natural.`

        }

    ];


    if(image){

        parts.push({

            inline_data:{

                mime_type:
                    "image/jpeg",

                data:
                    image

            }

        });

    }


    const url =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
        +
        encodeURIComponent(
            apiKey
        );


    let result =
        null;

    let errorText =
        "";


    for(
        let attempt = 1;
        attempt <= 3;
        attempt++
    ){

        try{

            result =
                await fetch(
                    url,
                    {

                        method:
                            "POST",

                        headers:{

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                contents:[

                                    {

                                        parts:
                                            parts

                                    }

                                ]

                            })

                    }
                );


        }catch(error){

            errorText =
                error.message;

            break;
        }


        if(result.ok)
            break;


        errorText =
            await result.text();


        if(
            result.status === 503 ||
            result.status === 429
        ){

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        attempt * 2500
                    )
            );


            continue;
        }


        break;

    }


    if(
        !result ||
        !result.ok
    ){

        console.error(
            errorText
        );


        aiStatus.textContent =
            "ERROR";


        aiStatus.className =
            "red";


        if(
            result &&
            result.status === 503
        ){

            response.textContent =
                "Gemini is temporarily busy.";

        }else{

            response.textContent =
                "Gemini connection error.";

        }


        return;
    }


    try{

        const data =
            await result.json();


        const answer =
            data
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;


        if(!answer){

            throw new Error(
                "No AI response"
            );

        }


        aiStatus.textContent =
            "ONLINE";


        aiStatus.className =
            "green";


        response.textContent =
            answer;


        speak(
            answer
        );


    }catch(error){

        console.error(
            error
        );


        aiStatus.textContent =
            "ERROR";


        aiStatus.className =
            "red";


        response.textContent =
            "E.D.I.T.H. could not process the response.";

    }

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(text){

    if(
        !window.speechSynthesis
    ){

        voiceStatus.textContent =
            "UNAVAILABLE";

        voiceStatus.className =
            "red";

        return;
    }


    try{

        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(
                text
            );


        speech.lang =
            "en-GB";


        speech.rate =
            1;


        speech.pitch =
            .9;


        speech.volume =
            1;


        speech.onstart =
            () => {

                voiceStatus.textContent =
                    "SPEAKING";


                voiceStatus.className =
                    "green";
            };


        speech.onend =
            () => {

                voiceStatus.textContent =
                    recognition
                        ? "LISTENING"
                        : "MANUAL";

            };


        speech.onerror =
            error => {

                console.log(
                    "TTS ERROR:",
                    error
                );

            };


        window.speechSynthesis.speak(
            speech
        );


    }catch(error){

        console.error(
            "SPEECH ERROR:",
            error
        );

    }

}


/* =====================================================
   START E.D.I.T.H.
===================================================== */

startButton.onclick =
    async() => {

        startButton.disabled =
            true;


        startButton.textContent =
            "INITIALIZING...";


        const ok =
            await startMedia();


        if(!ok){

            startButton.disabled =
                false;


            startButton.textContent =
                "TRY AGAIN";


            return;
        }


        start.style.display =
            "none";


        /*
         * Start voice recognition if Quest
         * provides it.
         */

        startListening();

    };


/* =====================================================
   WEBXR
===================================================== */

let xrSession =
    null;

let xrRefSpace =
    null;

let xrGL =
    null;

let xrLayer =
    null;


/* =====================================================
   CHECK WEBXR
===================================================== */

async function checkXR(){

    if(!navigator.xr){

        xrStatus.textContent =
            "NOT AVAILABLE";


        xrStatus.className =
            "red";


        return;
    }


    try{

        const arSupported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if(arSupported){

            xrStatus.textContent =
                "PASSTHROUGH READY";


            xrStatus.className =
                "green";


            vrButton.style.display =
                "block";


            vrButton.textContent =
                "ENTER E.D.I.T.H. PASSTHROUGH";


            return;
        }


        /*
         * We deliberately do NOT fall back to
         * immersive-vr here.
         *
         * immersive-vr normally replaces the
         * real world with an opaque VR view.
         *
         * You specifically want to see your
         * surroundings.
         */

        xrStatus.textContent =
            "PASSTHROUGH UNAVAILABLE";


        xrStatus.className =
            "red";


        vrButton.style.display =
            "none";


    }catch(error){

        console.error(
            "XR CHECK:",
            error
        );


        xrStatus.textContent =
            "XR ERROR";


        xrStatus.className =
            "red";

    }

}


/* =====================================================
   ENTER PASSTHROUGH
===================================================== */

vrButton.onclick =
    async() => {

        /*
         * Exit current session.
         */

        if(xrSession){

            try{

                await xrSession.end();

            }catch(error){

                console.error(
                    error
                );

            }

            return;
        }


        if(!navigator.xr){

            response.textContent =
                "WebXR is not available.";

            return;
        }


        try{

            /*
             * Only use immersive-ar.
             *
             * This is the important part for
             * Quest 3S passthrough.
             */

            const arSupported =
                await navigator.xr
                    .isSessionSupported(
                        "immersive-ar"
                    );


            if(!arSupported){

                throw new Error(
                    "immersive-ar passthrough is not available in this browser."
                );

            }


            /*
             * DOM overlay is OPTIONAL.
             *
             * We don't make anything required,
             * which avoids the invalid-required-
             * feature error you previously got.
             */

            const sessionOptions = {

                optionalFeatures: [

                    "dom-overlay",

                    "local-floor"

                ],

                domOverlay: {

                    root:
                        document.getElementById(
                            "hud"
                        )

                }

            };


            xrStatus.textContent =
                "STARTING PASSTHROUGH...";


            xrStatus.className =
                "yellow";


            /*
             * Start the immersive AR session.
             */

            xrSession =
                await navigator.xr
                    .requestSession(
                        "immersive-ar",
                        sessionOptions
                    );


            console.log(
                "XR SESSION STARTED"
            );


            console.log(
                "BLEND MODE:",
                xrSession.environmentBlendMode
            );


            console.log(
                "DOM OVERLAY:",
                xrSession.domOverlayState
            );


            console.log(
                "ENABLED FEATURES:",
                xrSession.enabledFeatures
            );


            /*
             * Make absolutely sure the HTML
             * HUD remains visible.
             */

            const hud =
                document.getElementById(
                    "hud"
                );


            hud.style.display =
                "block";


            hud.style.visibility =
                "visible";


            hud.style.opacity =
                "1";


            hud.style.background =
                "transparent";


            /*
             * Check whether Quest actually
             * enabled DOM overlay.
             */

            if(
                xrSession.domOverlayState
            ){

                console.log(
                    "DOM overlay active:",
                    xrSession.domOverlayState.type
                );

            }else{

                console.warn(
                    "DOM overlay was not enabled."
                );

            }


            /*
             * Check the actual blend mode.
             */

            if(
                xrSession.environmentBlendMode ===
                    "alpha-blend" ||

                xrSession.environmentBlendMode ===
                    "additive"
            ){

                xrStatus.textContent =
                    "PASSTHROUGH ACTIVE";


                xrStatus.className =
                    "green";

            }else{

                /*
                 * If Quest reports opaque,
                 * this is not a passthrough
                 * session.
                 */

                xrStatus.textContent =
                    "XR ACTIVE";

                xrStatus.className =
                    "yellow";

            }


            vrButton.textContent =
                "EXIT E.D.I.T.H.";


            /*
             * Keep voice alive after entering XR.
             */

            setTimeout(
                () => {

                    startListening();

                    /*
                     * Some browsers suspend speech
                     * synthesis during page transitions.
                     */

                    if(
                        window.speechSynthesis
                    ){

                        try{

                            window.speechSynthesis.resume();

                        }catch(error){

                            console.log(
                                error
                            );

                        }

                    }

                },
                500
            );


            xrSession.addEventListener(
                "end",
                () => {

                    console.log(
                        "XR SESSION ENDED"
                    );


                    xrSession =
                        null;


                    xrRefSpace =
                        null;


                    xrGL =
                        null;


                    xrLayer =
                        null;


                    vrButton.textContent =
                        "ENTER E.D.I.T.H. PASSTHROUGH";


                    checkXR();


                    /*
                     * Restart voice after leaving XR.
                     */

                    setTimeout(
                        startListening,
                        500
                    );

                }
            );


            await setupXR(
                xrSession
            );


        }catch(error){

            console.error(
                "XR ERROR:",
                error
            );


            xrSession =
                null;


            xrStatus.textContent =
                "XR ERROR";


            xrStatus.className =
                "red";


            response.textContent =
                "Could not enter passthrough: " +
                error.message;

        }

    };


/* =====================================================
   XR WEBGL
===================================================== */

async function setupXR(
    session
){

    /*
     * Create a WebGL canvas.
     */

    const canvas =
        document.createElement(
            "canvas"
        );


    xrGL =
        canvas.getContext(
            "webgl",
            {

                xrCompatible:
                    true,

                alpha:
                    true,

                antialias:
                    true,

                depth:
                    true,

                stencil:
                    false,

                premultipliedAlpha:
                    false

            }
        );


    if(!xrGL){

        throw new Error(
            "WebGL unavailable."
        );

    }


    /*
     * Make WebGL XR-compatible.
     */

    await xrGL
        .makeXRCompatible();


    /*
     * Transparent XR layer.
     *
     * In an alpha-blended AR session,
     * transparent pixels allow the real-world
     * passthrough to remain visible.
     */

    xrLayer =
        new XRWebGLLayer(
            session,
            xrGL,
            {

                alpha:
                    true,

                antialias:
                    true,

                depth:
                    true

            }
        );


    session.updateRenderState({

        baseLayer:
            xrLayer

    });


    /*
     * Prefer local-floor.
     *
     * Fall back to local if necessary.
     */

    try{

        xrRefSpace =
            await session
                .requestReferenceSpace(
                    "local-floor"
                );

    }catch(error){

        console.log(
            "local-floor unavailable, using local"
        );


        xrRefSpace =
            await session
                .requestReferenceSpace(
                    "local"
                );

    }


    /*
     * Start XR rendering.
     */

    session.requestAnimationFrame(
        renderXR
    );

}


/* =====================================================
   XR RENDER LOOP
===================================================== */

function renderXR(
    time,
    frame
){

    const session =
        frame.session;


    /*
     * Continue the XR frame loop.
     */

    session.requestAnimationFrame(
        renderXR
    );


    if(
        !xrGL ||
        !xrLayer
    ){

        return;
    }


    /*
     * Get viewer pose.
     */

    let pose =
        null;


    try{

        if(xrRefSpace){

            pose =
                frame.getViewerPose(
                    xrRefSpace
                );

        }

    }catch(error){

        console.warn(
            "XR POSE:",
            error
        );

    }


    /*
     * Bind XR framebuffer.
     */

    xrGL.bindFramebuffer(
        xrGL.FRAMEBUFFER,
        xrLayer.framebuffer
    );


    /*
     * Use the correct viewport.
     */

    xrGL.viewport(
        0,
        0,
        xrLayer.framebufferWidth,
        xrLayer.framebufferHeight
    );


    /*
     * CRITICAL:
     *
     * Transparent clear.
     *
     * We NEVER draw a black background.
     */

    xrGL.clearColor(
        0,
        0,
        0,
        0
    );


    xrGL.clear(
        xrGL.COLOR_BUFFER_BIT |
        xrGL.DEPTH_BUFFER_BIT
    );


    /*
     * No opaque scene is rendered here.
     *
     * Quest supplies the passthrough image.
     *
     * The E.D.I.T.H. HTML interface is supplied
     * by the WebXR DOM overlay.
     */

}


/* =====================================================
   KEEP VOICE/TTS ALIVE
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            !document.hidden &&
            mediaStream
        ){

            setTimeout(
                startListening,
                500
            );


            if(
                window.speechSynthesis
            ){

                try{

                    window.speechSynthesis.resume();

                }catch(error){

                    console.log(
                        error
                    );

                }

            }

        }

    }
);


/* =====================================================
   INITIAL XR CHECK
===================================================== */

checkXR();

</script>
