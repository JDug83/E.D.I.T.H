<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stark Industries K.A.R.E.N. Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #ff4422; font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #2a0a00 0%, #050100 85%);
            text-align: center; padding: 20px;
        }
        h1 { font-size: 38px; letter-spacing: 14px; margin-bottom: 6px; color: #ff4422; text-shadow: 0 0 15px #ff4422; font-weight: bold; }
        p { color: #aa8877; font-size: 11px; letter-spacing: 3px; margin-bottom: 30px; }
        input {
            width: min(450px, 95%); padding: 16px; margin-bottom: 20px;
            background: rgba(10, 2, 0, 0.9); border: 2px solid #ff4422; color: #fff;
            text-align: center; outline: none; font-size: 14px; box-shadow: 0 0 10px rgba(255, 68, 34, 0.3);
        }
        button {
            padding: 16px 36px; background: rgba(255, 68, 34, 0.2);
            border: 2px solid #ff4422; color: #ff4422; font-weight: bold;
            font-size: 13px; letter-spacing: 3px; cursor: pointer; transition: 0.2s all;
        }
        button:hover { background: #ff4422; color: #000; box-shadow: 0 0 20px #ff4422; }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="setupScreen">
    <div style="font-size: 10px; color: #666; margin-bottom: 5px;">PROTOCOL: K.A.R.E.N.</div>
    <h1>STARK INDUSTRIES</h1>
    <p>HOMECOMING // DRONE_VISION v4.1</p>
    <input type="password" id="apiKeyInput" placeholder="Initialize Gemini API Key">
    <button id="btnInit">ACTIVATE SUIT HUD</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("stark_edith_key") || "";
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = apiKey;

let systemStatus = "IDLE";
let karenResponse = "System initialized. Standing by for voice prompt.";
let micStream = null;
let audioContext = null;
let mediaRecorder = null;
let recordedChunks = [];
let voiceDetected = false;
let silenceTimer = null;
let voiceEnergy = 0;

// --- Homecoming Object Detection & Hitbox Data ---
const detectedObjects = [
    { x: 310, y: 350, w: 100, h: 160, id: "TGT_001", type: "HUMAN_VAR", threat: "LOW", color: "#ffaa00", range: "2.5m" },
    { x: 550, y: 220, w: 220, h: 130, id: "VUL_99", type: "VULTURE_TECH_SIG", threat: "CRITICAL", color: "#ff4422", range: "12.1m" },
    { x: 420, y: 600, w: 190, h: 50, id: "STR_A", type: "WEB_WING_ASSEMBLY", threat: "N/A", color: "#ffff00", range: "0.9m" }
];

/* =================================================================
   HOMECOMING HUD ENGINE (Red/Orange Palette, Myopia Layout)
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

const STARK_RED = "#ff4422";
const STARK_ORANGE = "#ffaa00";
const STARK_AMBER = "rgba(255, 180, 0, 0.7)";

function drawHomecomingHUD(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;
    const slowPulse = Math.sin(time * 0.002) * 4;
    const fastPulse = Math.sin(time * 0.01) * 2;

    // --- Object Hitboxes (Spatial Boxing) ---
    // Rendered first so HUD elements draw on top
    detectedObjects.forEach(obj => {
        const drift = Math.sin(time * 0.001 + parseFloat(obj.id)) * 2;
        const ox = obj.x + drift;
        const oy = obj.y;

        ctx.strokeStyle = obj.threat === "CRITICAL" ? STARK_RED : STARK_ORANGE;
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 5]); // Dash patterns characteristic of Homecoming IDing
        ctx.strokeRect(ox, oy, obj.w, obj.h);
        ctx.setLineDash([]);

        // Label Tag
        ctx.fillStyle = obj.threat === "CRITICAL" ? "rgba(100, 10, 0, 0.8)" : "rgba(30, 20, 0, 0.7)";
        ctx.fillRect(ox + obj.w + 5, oy, 130, 42);
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px 'Courier New'";
        ctx.fillText(`ID: ${obj.id}`, ox + obj.w + 12, oy + 15);
        ctx.fillText(`TYPE: ${obj.type}`, ox + obj.w + 12, oy + 26);
        
        ctx.fillStyle = obj.threat === "CRITICAL" ? "#ff8888" : STARK_ORANGE;
        ctx.fillText(`THREAT: ${obj.threat}`, ox + obj.w + 12, oy + 37);
        
        // Range Indicator below box
        ctx.font = "12px monospace";
        ctx.fillText(`DST: ${obj.range}`, ox, oy + obj.h + 15);
    });

    // --- Central Stark Attitude Indicator (Homecoming Pitch/Roll) ---
    // Instead of static crosshairs, this reacts to simulated suit motion
    const rollAngle = Math.sin(time * 0.0005) * 0.1; // Simulated slight roll
    const pitchOffset = Math.sin(time * 0.0008) * 15; // Simulated slight pitch

    ctx.save();
    ctx.translate(cx, cy + pitchOffset);
    ctx.rotate(rollAngle);
    
    // Pitch Ladder
    ctx.strokeStyle = STARK_RED;
    ctx.lineWidth = 2;
    ctx.font = "10px monospace";
    ctx.fillStyle = STARK_RED;
    ctx.textAlign = "center";
    
    for (let i = -2; i <= 2; i++) {
        if (i === 0) continue;
        const yPos = i * 40;
        const barLen = 60 - Math.abs(i) * 10;
        ctx.beginPath();
        ctx.moveTo(-barLen, yPos); ctx.lineTo(barLen, yPos);
        ctx.stroke();
        ctx.fillText(`${Math.abs(i*10)}`, -barLen - 15, yPos + 3);
        ctx.fillText(`${Math.abs(i*10)}`, barLen + 15, yPos + 3);
    }
    
    // Central Horizon Bar
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-80, 0); ctx.lineTo(-20, 0);
    ctx.moveTo(20, 0); ctx.lineTo(80, 0);
    ctx.stroke();
    
    ctx.restore();

    // --- Dynamic Target Reticle (Homecoming style hexagon/circle hybrid) ---
    const reticleColor = voiceDetected ? STARK_RED : STARK_AMBER;
    ctx.strokeStyle = reticleColor;
    ctx.lineWidth = 3;
    
    // Hexagonal guide
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
        ctx.rotate(Math.PI / 3);
        ctx.moveTo(0, -115 - slowPulse); ctx.lineTo(0, -100);
    }
    ctx.stroke();
    ctx.restore();

    // Main Circle
    ctx.beginPath();
    ctx.arc(cx, cy, 95 + fastPulse + (voiceEnergy * 30), 0, Math.PI * 2);
    ctx.stroke();

    // Center Dot (Active State)
    ctx.fillStyle = voiceDetected ? STARK_RED : (systemStatus === "ANALYZING" ? "#fff" : "#ff0000");
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();

    /* =================================================================
       ERGONOMIC CENTRAL STACK (Myopia Solution)
       All critical data grouped tightly in center 20% of view
    ================================================================= */
    
    // Header Stack
    ctx.fillStyle = STARK_RED;
    ctx.font = "bold 24px 'Courier New'";
    ctx.textAlign = "center";
    ctx.fillText("K.A.R.E.N.", cx, cy - 150);

    ctx.fillStyle = voiceDetected ? "#fff" : (systemStatus === "ANALYZING" ? STARK_ORANGE : STARK_AMBER);
    ctx.font = "11px monospace";
    ctx.fillText(voiceDetected ? "● AUDIO ACTIVE // STREAMING" : `● SUIT_STATUS: ${systemStatus}`, cx, cy - 130);

    // Response Stack (Grouped under reticle)
    ctx.fillStyle = "#ffffff";
    ctx.font = "18px sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = STARK_RED;
    ctx.shadowBlur = voiceDetected ? 10 : 0;
    wrapText(ctx, karenResponse, cx, cy + 140, 450, 24);
    ctx.shadowBlur = 0;
    
    // --- Corner Brackets (Homecoming Style) ---
    // Positioned further in to stay within myopia lens clear-zone
    const inset = 150;
    const bLen = 35;
    ctx.strokeStyle = STARK_RED;
    ctx.lineWidth = 3;
    
    // TL
    ctx.beginPath(); ctx.moveTo(inset, inset + bLen); ctx.lineTo(inset, inset); ctx.lineTo(inset + bLen, inset); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(1024 - inset, inset + bLen); ctx.lineTo(1024 - inset, inset); ctx.lineTo(1024 - inset - bLen, inset); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(inset, 1024 - inset - bLen); ctx.lineTo(inset, 1024 - inset); ctx.lineTo(inset + bLen, 1024 - inset); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(1024 - inset, 1024 - inset - bLen); ctx.lineTo(1024 - inset, 1024 - inset); ctx.lineTo(1024 - inset - bLen, 1024 - inset); ctx.stroke();
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   STARK INDUSTRIES HANDS-FREE VAD (Vocal Activation System)
================================================================= */
async function setupHandsFreeKAREN() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(micStream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

    mediaRecorder = new MediaRecorder(micStream, { mimeType });
    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = processVocalDirective;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function runVAD() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        voiceEnergy = avg / 128.0;

        // VAD Logic (Homecoming style: responsive to voice)
        if (avg > 25) { // Sound detected threshold
            if (!voiceDetected && mediaRecorder.state === "inactive") {
                recordedChunks = [];
                mediaRecorder.start();
                voiceDetected = true;
                systemStatus = "LISTENING";
            }
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                if (voiceDetected && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    voiceDetected = false;
                    systemStatus = "ANALYZING";
                }
            }, 1000); // 1.0s trailing silence to auto-send
        }
        requestAnimationFrame(runVAD);
    }
    runVAD();
}

async function processVocalDirective() {
    if (!recordedChunks.length) return;
    const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
    const reader = new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "You are Peter Parker's suit AI, Karen from Spider-Man: Homecoming. Keep answers concise, supportive, tactical, and 1 to 2 short sentences." },
                            { inline_data: { mime_type: mediaRecorder.mimeType.split(';')[0], data: base64Audio } }
                        ]
                    }]
                })
            });
            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Telemetry processed. No vocal synthesis required.";
            karenResponse = reply;
            systemStatus = "ACTIVE";
            speak(reply);
        } catch (err) {
            karenResponse = "Core link failure. Check Gemini API configuration.";
            systemStatus = "ERROR";
        }
    };
}

function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-US";
    utt.pitch = 1.1; // Slightly higher pitch for Karen
    utt.rate = 1.1;
    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL STEREOSCOPIC VIEWPORT ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    varying vec2 vTex;
    void main() {
        // Spatial anchor: 1.5m directly forward in eye space
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.5, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

// 1.4m x 1.4m Quad centered at Z = 0
const vertices = new Float32Array([
    -0.7, -0.7, 0.0,   0.0, 1.0,
     0.7, -0.7, 0.0,   1.0, 1.0,
    -0.7,  0.7, 0.0,   0.0, 0.0,
    -0.7,  0.7, 0.0,   0.0, 0.0,
     0.7, -0.7, 0.0,   1.0, 1.0,
     0.7,  0.7, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SUIT PROTOCOL
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("stark_edith_key", apiKey);
    if (!apiKey) {
        alert("Initialize your Gemini API key protocol.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await setupHandsFreeKAREN();

    if (!navigator.xr) {
        alert("Launch inside the Meta Quest Browser over HTTPS.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        // Alpha 0.0 allows Quest passthrough to shine through
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        drawHomecomingHUD(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
