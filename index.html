<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stark HUD - E.D.I.T.H. Homecoming Vision</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #00e5ff; font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #240507 0%, #000000 85%);
            text-align: center; padding: 20px;
        }
        h1 { 
            font-size: 38px; letter-spacing: 14px; margin-bottom: 8px; 
            color: #ff1a35; text-shadow: 0 0 20px rgba(255, 26, 53, 0.8); 
            font-weight: 900;
        }
        p { color: #998888; font-size: 11px; letter-spacing: 3px; margin-bottom: 24px; }
        .config-box {
            display: flex; flex-direction: column; gap: 12px; width: min(440px, 90%);
            margin-bottom: 20px;
        }
        input {
            width: 100%; padding: 14px 18px;
            background: rgba(15, 2, 4, 0.85); border: 2px solid #ff1a35; color: #fff;
            text-align: center; outline: none; font-size: 14px;
            box-shadow: inset 0 0 10px rgba(255, 26, 53, 0.3);
        }
        button {
            padding: 15px 36px; background: rgba(255, 26, 53, 0.15);
            border: 2px solid #ff1a35; color: #ff1a35; font-weight: bold;
            font-size: 13px; letter-spacing: 3px; cursor: pointer; transition: 0.25s all;
        }
        button:hover { 
            background: #ff1a35; color: #000; 
            box-shadow: 0 0 25px rgba(255, 26, 53, 0.9); 
        }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="setupScreen">
    <h1>E.D.I.T.H.</h1>
    <p>TACTICAL HUD // HOMECOMING PROTOCOL</p>
    <div class="config-box">
        <input type="password" id="apiKeyInput" placeholder="LOCAL GEMINI API KEY">
        <input type="text" id="proxyUrlInput" placeholder="OR SERVERLESS PROXY URL">
    </div>
    <button id="btnInit">INITIALIZE SYSTEM</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("stark_edith_key") || "";
let proxyUrl = localStorage.getItem("stark_proxy_url") || "";

const apiKeyInput = document.getElementById("apiKeyInput");
const proxyUrlInput = document.getElementById("proxyUrlInput");

apiKeyInput.value = apiKey;
proxyUrlInput.value = proxyUrl;

let systemStatus = "ONLINE";
let edithResponse = "E.D.I.T.H. online. Audio link established.";
let micStream = null;
let audioContext = null;
let mediaRecorder = null;
let recordedChunks = [];
let voiceDetected = false;
let isSpeaking = false;
let silenceTimer = null;
let voiceEnergy = 0;
let selectedVoice = null;

// Populate voices specifically for Quest Browser support
function loadVoices() {
    if (!window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    selectedVoice = voices.find(v => v.lang.includes("en-GB") || v.lang.includes("en-US")) || voices[0];
}
if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}

/* =================================================================
   ACCURATE FILM HUD RENDERER (Clean, Small, Cinema-Matched)
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

const CYAN = "rgba(0, 229, 255, 0.85)";
const CYAN_DIM = "rgba(0, 229, 255, 0.35)";
const CRIMSON = "rgba(235, 20, 45, 0.85)";
const CRIMSON_SHADOW = "rgba(180, 10, 30, 0.5)";

function renderHomecomingDisplay(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;
    const pulse = Math.sin(time * 0.003);

    /* -------------------------------------------------------------
       1. EYE APERTURE VIGNETTE (Left & Right Film Cutouts)
    ------------------------------------------------------------- */
    ctx.save();
    ctx.strokeStyle = CRIMSON;
    ctx.shadowColor = CRIMSON_SHADOW;
    ctx.shadowBlur = 20;

    // Left Vignette Mask Frame
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(80, 40);
    ctx.bezierCurveTo(15, 280, 15, 744, 80, 984);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(105, 90);
    ctx.lineTo(45, 240);
    ctx.lineTo(45, 784);
    ctx.lineTo(105, 934);
    ctx.stroke();

    // Right Vignette Mask Frame
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(944, 40);
    ctx.bezierCurveTo(1009, 280, 1009, 744, 944, 984);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(919, 90);
    ctx.lineTo(979, 240);
    ctx.lineTo(979, 784);
    ctx.lineTo(919, 934);
    ctx.stroke();
    ctx.restore();

    /* -------------------------------------------------------------
       2. TOP AIRCRAFT ATTITUDE / PITCH LADDER (Small & Tight)
    ------------------------------------------------------------- */
    ctx.save();
    const ladderCenterY = 90;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 1.5;
    ctx.fillStyle = CYAN;
    ctx.font = "bold 8px monospace";
    ctx.textAlign = "center";

    // Central line
    ctx.beginPath();
    ctx.moveTo(cx, ladderCenterY - 45);
    ctx.lineTo(cx, ladderCenterY + 45);
    ctx.stroke();

    // Small pitch steps
    for (let i = -3; i <= 3; i++) {
        const y = ladderCenterY + (i * 11);
        const w = (i === 0) ? 28 : 16 - Math.abs(i * 2);

        ctx.beginPath();
        ctx.moveTo(cx - w, y);
        ctx.lineTo(cx + w, y);
        ctx.stroke();

        if (i !== 0) {
            const tickH = i > 0 ? -3 : 3;
            ctx.beginPath();
            ctx.moveTo(cx - w, y);
            ctx.lineTo(cx - w, y + tickH);
            ctx.moveTo(cx + w, y);
            ctx.lineTo(cx + w, y + tickH);
            ctx.stroke();
        }
    }

    // Red calibration dots at base of the ladder
    ctx.fillStyle = "#ff1a35";
    ctx.beginPath();
    ctx.arc(cx - 8, ladderCenterY + 52, 2, 0, Math.PI * 2);
    ctx.arc(cx + 8, ladderCenterY + 52, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* -------------------------------------------------------------
       3. TOP TARGETING HEADING ARC (Dotted Guidance Curve)
    ------------------------------------------------------------- */
    ctx.save();
    ctx.strokeStyle = CYAN_DIM;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy - 240, 310, Math.PI * 1.18, Math.PI * 1.82);
    ctx.stroke();
    ctx.restore();

    /* -------------------------------------------------------------
       4. TOP-RIGHT E.D.I.T.H. AUDIO WAVEFORM SPEAKER
    ------------------------------------------------------------- */
    ctx.save();
    const speakX = 760;
    const speakY = 85;

    ctx.fillStyle = isSpeaking ? "#00ff88" : CYAN;
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "left";
    ctx.fillText("E.D.I.T.H. // VOICE", speakX, speakY - 12);

    // Audio Waveform Visualizer Node
    for (let b = 0; b < 8; b++) {
        const barHeight = isSpeaking 
            ? Math.abs(Math.sin(time * 0.015 + b)) * 18 + 4
            : (voiceDetected ? Math.abs(Math.sin(time * 0.02 + b)) * 22 * voiceEnergy + 3 : 3);

        ctx.fillStyle = isSpeaking ? "#00ff88" : (voiceDetected ? "#ff1a35" : CYAN);
        ctx.fillRect(speakX + (b * 7), speakY - (barHeight / 2), 4, barHeight);
    }
    ctx.restore();

    /* -------------------------------------------------------------
       5. CENTRAL ERGONOMIC RETICLE & CAPTION CLUSTER
    ------------------------------------------------------------- */
    ctx.save();
    const reticleColor = voiceDetected ? "#ff1a35" : CYAN;
    ctx.strokeStyle = reticleColor;
    ctx.lineWidth = 2;
    ctx.shadowColor = reticleColor;
    ctx.shadowBlur = 6;

    // Small, tight central aim reticle
    const dynamicRadius = 24 + (voiceEnergy * 18);
    ctx.beginPath();
    ctx.arc(cx, cy, dynamicRadius, 0, Math.PI * 2);
    ctx.stroke();

    // Cross-hairs
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy); ctx.lineTo(cx - 4, cy);
    ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 12, cy);
    ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy - 4);
    ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + 12);
    ctx.stroke();

    // Status line directly below reticle (No eye strain)
    ctx.fillStyle = voiceDetected ? "#ff1a35" : (systemStatus === "TRANSMITTING" ? "#ffaa00" : CYAN);
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText(voiceDetected ? "● RECORDING DIRECTIVE..." : `● ${systemStatus}`, cx, cy + 48);

    // E.D.I.T.H. Captions (Centered in clear focus)
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px 'Courier New', monospace";
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 4;
    wrapCenteredText(ctx, edithResponse, cx, cy + 78, 440, 20);
    ctx.restore();
}

function wrapCenteredText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   HANDS-FREE AMBIENT VAD WITH SPEECH OUTPUT
================================================================= */
async function setupVAD() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(micStream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

    mediaRecorder = new MediaRecorder(micStream, { mimeType });
    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = sendVocalData;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function pollMicEnergy() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        voiceEnergy = avg / 128.0;

        // Sound triggers listener automatically
        if (avg > 24 && !isSpeaking) {
            if (!voiceDetected && mediaRecorder.state === "inactive") {
                recordedChunks = [];
                mediaRecorder.start();
                voiceDetected = true;
                systemStatus = "LISTENING";
            }
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                if (voiceDetected && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    voiceDetected = false;
                    systemStatus = "TRANSMITTING";
                }
            }, 1000);
        }
        requestAnimationFrame(pollMicEnergy);
    }
    pollMicEnergy();
}

async function sendVocalData() {
    if (!recordedChunks.length) return;
    const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
    const reader = new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
            let res;
            if (proxyUrl) {
                res = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio: base64Audio,
                        mimeType: mediaRecorder.mimeType.split(';')[0]
                    })
                });
            } else if (apiKey) {
                res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "You are E.D.I.T.H., Tony Stark's tactical AI. Provide a concise, clear, 1-2 sentence response." },
                                { inline_data: { mime_type: mediaRecorder.mimeType.split(';')[0], data: base64Audio } }
                            ]
                        }]
                    })
                });
            } else {
                throw new Error("Missing Key");
            }

            const data = await res.json();
            const reply = data.reply || data.candidates?.[0]?.content?.parts?.[0]?.text || "Signal resolved.";
            edithResponse = reply;
            systemStatus = "ONLINE";
            speakResponse(reply);
        } catch (err) {
            edithResponse = "Connection failure. Check network or key.";
            systemStatus = "ERROR";
        }
    };
}

function speakResponse(text) {
    if (!window.speechSynthesis) return;

    // Wake audio playback context
    if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
    }

    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    if (selectedVoice) utt.voice = selectedVoice;
    utt.lang = "en-US";
    utt.rate = 1.05;
    utt.pitch = 1.0;

    utt.onstart = () => { isSpeaking = true; };
    utt.onend = () => { isSpeaking = false; };
    utt.onerror = () => { isSpeaking = false; };

    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL FULL-SCREEN STEREOSCOPIC ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    varying vec2 vTex;
    void main() {
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.15, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

const vertices = new Float32Array([
    -0.9, -0.9, 0.0,   0.0, 1.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
     0.9,  0.9, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION PIPELINE
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    proxyUrl = proxyUrlInput.value.trim();

    localStorage.setItem("stark_edith_key", apiKey);
    localStorage.setItem("stark_proxy_url", proxyUrl);

    if (!apiKey && !proxyUrl) {
        alert("Provide either a local API key or a Serverless Proxy URL.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await setupVAD();

    if (!navigator.xr) {
        alert("Launch inside Meta Quest Browser over HTTPS.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        renderHomecomingDisplay(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
