<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stark HUD - Homecoming Lens Vision</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #00e5ff; font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #1a0505 0%, #000000 85%);
            text-align: center; padding: 20px;
        }
        h1 { font-size: 34px; letter-spacing: 12px; margin-bottom: 8px; color: #ff2233; text-shadow: 0 0 15px #ff2233; }
        p { color: #887777; font-size: 11px; letter-spacing: 3px; margin-bottom: 24px; }
        input {
            width: min(420px, 90%); padding: 14px; margin-bottom: 18px;
            background: rgba(10, 0, 0, 0.85); border: 2px solid #ff2233; color: #fff;
            text-align: center; outline: none; font-size: 14px;
        }
        button {
            padding: 14px 32px; background: rgba(255, 34, 51, 0.2);
            border: 2px solid #ff2233; color: #ff2233; font-weight: bold;
            font-size: 13px; letter-spacing: 3px; cursor: pointer; transition: 0.2s all;
        }
        button:hover { background: #ff2233; color: #000; box-shadow: 0 0 20px #ff2233; }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="setupScreen">
    <h1>STARK EYES</h1>
    <p>SUIT VISION // PROTOCOL K.A.R.E.N.</p>
    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key">
    <button id="btnInit">INITIALIZE EYE SYSTEM</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("stark_edith_key") || "";
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = apiKey;

let systemStatus = "STANDBY";
let karenResponse = "Eyes adjusted. Audio stream active.";
let micStream = null;
let audioContext = null;
let mediaRecorder = null;
let recordedChunks = [];
let voiceDetected = false;
let silenceTimer = null;
let voiceEnergy = 0;

// Dynamic tracked objects in environment (like the bin tracker in the screenshot)
const trackedTargets = [
    { x: 395, y: 560, radius: 14, label: "CONTAINER_01", distance: "2.4M", type: "SOLID" },
    { x: 575, y: 720, radius: 10, label: "GROUND_REF", distance: "1.1M", type: "SURFACE" }
];

/* =================================================================
   EXACT HOMECOMING HUD RENDERING
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

const CYAN_HUD = "rgba(0, 229, 255, 0.85)";
const CYAN_FAINT = "rgba(0, 229, 255, 0.3)";
const RED_MASK = "rgba(220, 20, 40, 0.75)";
const RED_GLOW = "rgba(255, 30, 50, 0.4)";

function drawHomecomingExact(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;
    const pulse = Math.sin(time * 0.003) * 4;

    /* -------------------------------------------------------------
       1. EYE APERTURE VIGNETTE (Mask Edge Frame from Screenshot)
    ------------------------------------------------------------- */
    ctx.save();
    // Left eye red shell contour
    ctx.strokeStyle = RED_MASK;
    ctx.lineWidth = 14;
    ctx.shadowColor = RED_GLOW;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(70, 60);
    ctx.bezierCurveTo(40, 300, 40, 724, 70, 964);
    ctx.stroke();

    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(90, 100);
    ctx.lineTo(60, 220);
    ctx.lineTo(60, 804);
    ctx.lineTo(90, 924);
    ctx.stroke();

    // Right eye red shell contour
    ctx.beginPath();
    ctx.moveTo(954, 60);
    ctx.bezierCurveTo(984, 300, 984, 724, 954, 964);
    ctx.stroke();

    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(934, 100);
    ctx.lineTo(964, 220);
    ctx.lineTo(964, 804);
    ctx.lineTo(934, 924);
    ctx.stroke();
    ctx.restore();

    /* -------------------------------------------------------------
       2. TOP FLIGHT ATTITUDE / PITCH LADDER (Directly from Movie)
    ------------------------------------------------------------- */
    ctx.save();
    const ladderY = 120;
    ctx.strokeStyle = CYAN_HUD;
    ctx.lineWidth = 2;
    ctx.fillStyle = CYAN_HUD;
    ctx.font = "9px monospace";
    ctx.textAlign = "center";

    // Center vertical index line
    ctx.beginPath();
    ctx.moveTo(cx, ladderY - 70);
    ctx.lineTo(cx, ladderY + 60);
    ctx.stroke();

    // Horizontal graduated pitch ticks
    for (let i = -4; i <= 4; i++) {
        const y = ladderY + (i * 14);
        const w = (i === 0) ? 36 : 18 - Math.abs(i * 2);
        ctx.beginPath();
        ctx.moveTo(cx - w, y);
        ctx.lineTo(cx + w, y);
        ctx.stroke();

        // Tick marks at the edges
        if (i !== 0) {
            ctx.beginPath();
            ctx.moveTo(cx - w, y);
            ctx.lineTo(cx - w, y + (i > 0 ? -3 : 3));
            ctx.moveTo(cx + w, y);
            ctx.lineTo(cx + w, y + (i > 0 ? -3 : 3));
            ctx.stroke();
        }
    }

    // Small red alignment indicator dots at ladder base
    ctx.fillStyle = "#ff2233";
    ctx.beginPath();
    ctx.arc(cx - 10, ladderY + 68, 2, 0, Math.PI * 2);
    ctx.arc(cx + 10, ladderY + 68, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* -------------------------------------------------------------
       3. TOP CURVED DOTTED TARGETING ARC
    ------------------------------------------------------------- */
    ctx.save();
    ctx.strokeStyle = CYAN_FAINT;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(cx, cy - 220, 280, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.restore();

    /* -------------------------------------------------------------
       4. BLUE HOLOGRAPHIC OBJECT TRACKERS (Dumpster Target)
    ------------------------------------------------------------- */
    trackedTargets.forEach(tgt => {
        ctx.save();
        // Inner glowing solid node
        ctx.fillStyle = "#00e5ff";
        ctx.shadowColor = "#00e5ff";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(tgt.x, tgt.y, tgt.radius, 0, Math.PI * 2);
        ctx.fill();

        // Concentric tracking ring
        ctx.strokeStyle = CYAN_HUD;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(tgt.x, tgt.y, tgt.radius + 8 + (pulse * 0.5), 0, Math.PI * 2);
        ctx.stroke();

        // Range line and tag
        ctx.beginPath();
        ctx.moveTo(tgt.x + tgt.radius + 10, tgt.y);
        ctx.lineTo(tgt.x + tgt.radius + 35, tgt.y - 12);
        ctx.lineTo(tgt.x + tgt.radius + 80, tgt.y - 12);
        ctx.stroke();

        ctx.fillStyle = "#00e5ff";
        ctx.font = "bold 10px monospace";
        ctx.fillText(`${tgt.label} [${tgt.distance}]`, tgt.x + tgt.radius + 20, tgt.y - 16);
        ctx.restore();
    });

    /* -------------------------------------------------------------
       5. MYOPIA COMFORT CLUSTER (Voice + Dialogue Centered)
    ------------------------------------------------------------- */
    // Central Aim Reticle
    ctx.save();
    const reticleColor = voiceDetected ? "#ff3344" : CYAN_HUD;
    ctx.strokeStyle = reticleColor;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(cx, cy, 32 + (voiceEnergy * 25), 0, Math.PI * 2);
    ctx.stroke();

    // Center Cross-hairs
    ctx.beginPath();
    ctx.moveTo(cx - 14, cy); ctx.lineTo(cx - 5, cy);
    ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 14, cy);
    ctx.moveTo(cx, cy - 14); ctx.lineTo(cx, cy - 5);
    ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, cy + 14);
    ctx.stroke();

    // K.A.R.E.N. Audio / System Status
    ctx.fillStyle = voiceDetected ? "#ff3344" : (systemStatus === "LISTENING" ? "#00ff88" : CYAN_HUD);
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillText(voiceDetected ? "● AUDIO DETECTED // STREAMING" : `● K.A.R.E.N. // ${systemStatus}`, cx, cy + 62);

    // AI Response (Comfortably right in central eyesight)
    ctx.fillStyle = "#ffffff";
    ctx.font = "18px 'Courier New', monospace";
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 6;
    wrapText(ctx, karenResponse, cx, cy + 96, 480, 22);
    ctx.restore();
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   HANDS-FREE AUDIO CAPTURE SYSTEM (VAD)
================================================================= */
async function setupVoiceEngine() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(micStream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

    mediaRecorder = new MediaRecorder(micStream, { mimeType });
    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = sendVocalData;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function trackVoiceActivity() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        voiceEnergy = avg / 128.0;

        if (avg > 25) {
            if (!voiceDetected && mediaRecorder.state === "inactive") {
                recordedChunks = [];
                mediaRecorder.start();
                voiceDetected = true;
                systemStatus = "LISTENING";
            }
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                if (voiceDetected && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    voiceDetected = false;
                    systemStatus = "PROCESSING";
                }
            }, 1100);
        }
        requestAnimationFrame(trackVoiceActivity);
    }
    trackVoiceActivity();
}

async function sendVocalData() {
    if (!recordedChunks.length) return;
    const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
    const reader = new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "You are Karen, Peter Parker's suit AI from Spider-Man: Homecoming. Answer tactically, supportively, and in 1-2 brief sentences." },
                            { inline_data: { mime_type: mediaRecorder.mimeType.split(';')[0], data: base64Audio } }
                        ]
                    }]
                })
            });
            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Target locked. No comment necessary.";
            karenResponse = reply;
            systemStatus = "ONLINE";
            speak(reply);
        } catch (err) {
            karenResponse = "Network disconnected. Check API Key.";
            systemStatus = "ERROR";
        }
    };
}

function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-US";
    utt.pitch = 1.05;
    utt.rate = 1.08;
    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL STEREOSCOPIC IMMERSIVE ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    varying vec2 vTex;
    void main() {
        // Positioned 1.4m away directly in front of the viewer
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.4, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

// 1.5m wide x 1.5m tall quad
const vertices = new Float32Array([
    -0.75, -0.75, 0.0,   0.0, 1.0,
     0.75, -0.75, 0.0,   1.0, 1.0,
    -0.75,  0.75, 0.0,   0.0, 0.0,
    -0.75,  0.75, 0.0,   0.0, 0.0,
     0.75, -0.75, 0.0,   1.0, 1.0,
     0.75,  0.75, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION PIPELINE
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("stark_edith_key", apiKey);
    if (!apiKey) {
        alert("Enter your Gemini API key.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await setupVoiceEngine();

    if (!navigator.xr) {
        alert("Run inside the Meta Quest Browser using HTTPS.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        // Alpha 0.0 is critical so passthrough remains visible
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        drawHomecomingExact(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
