<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stark HUD - Homecoming Lens Vision</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #00e5ff; font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #240507 0%, #000000 85%);
            text-align: center; padding: 20px;
        }
        h1 { 
            font-size: 38px; letter-spacing: 14px; margin-bottom: 8px; 
            color: #ff1a35; text-shadow: 0 0 20px rgba(255, 26, 53, 0.8); 
            font-weight: 900;
        }
        p { color: #998888; font-size: 11px; letter-spacing: 3px; margin-bottom: 24px; }
        .config-box {
            display: flex; flex-direction: column; gap: 12px; width: min(440px, 90%);
            margin-bottom: 20px;
        }
        input {
            width: 100%; padding: 14px 18px;
            background: rgba(15, 2, 4, 0.85); border: 2px solid #ff1a35; color: #fff;
            text-align: center; outline: none; font-size: 14px;
            box-shadow: inset 0 0 10px rgba(255, 26, 53, 0.3);
        }
        button {
            padding: 15px 36px; background: rgba(255, 26, 53, 0.15);
            border: 2px solid #ff1a35; color: #ff1a35; font-weight: bold;
            font-size: 13px; letter-spacing: 3px; cursor: pointer; transition: 0.25s all;
        }
        button:hover { 
            background: #ff1a35; color: #000; 
            box-shadow: 0 0 25px rgba(255, 26, 53, 0.9); 
        }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="setupScreen">
    <h1>STARK EYES</h1>
    <p>HOMECOMING OPTICAL SYSTEM // K.A.R.E.N.</p>
    <div class="config-box">
        <input type="password" id="apiKeyInput" placeholder="OPTIONAL: ENTER LOCAL GEMINI API KEY">
        <input type="text" id="proxyUrlInput" placeholder="OR: SERVERLESS PROXY URL (e.g. /api/chat)">
    </div>
    <button id="btnInit">ACTIVATE SUIT OPTICS</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
// Retrieve keys saved locally on device; never pushed to GitHub
let apiKey = localStorage.getItem("stark_edith_key") || "";
let proxyUrl = localStorage.getItem("stark_proxy_url") || "";

const apiKeyInput = document.getElementById("apiKeyInput");
const proxyUrlInput = document.getElementById("proxyUrlInput");

apiKeyInput.value = apiKey;
proxyUrlInput.value = proxyUrl;

let systemStatus = "ONLINE";
let karenResponse = "Suit diagnostics nominal. Listening for directive.";
let micStream = null;
let audioContext = null;
let mediaRecorder = null;
let recordedChunks = [];
let voiceDetected = false;
let silenceTimer = null;
let voiceEnergy = 0;

// Dynamic environment targets (Homage to the movie's blue dumpster targeting node)
const trackedTargets = [
    { x: 380, y: 580, r: 16, label: "REF_CONTAINER_01", dist: "2.8M", color: "#00e5ff" },
    { x: 670, y: 460, r: 11, label: "OBSTACLE_WALL", dist: "4.2M", color: "#00e5ff" }
];

/* =================================================================
   ACCURATE HOMECOMING HUD ENGINE
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

const CYAN = "rgba(0, 229, 255, 0.85)";
const CYAN_GLOW = "rgba(0, 229, 255, 0.4)";
const CRIMSON = "rgba(235, 20, 45, 0.9)";
const CRIMSON_SHADOW = "rgba(180, 10, 30, 0.5)";

function renderHomecomingDisplay(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;
    const pulse = Math.sin(time * 0.003);

    /* -------------------------------------------------------------
       1. EYE MASK VIGNETTE (Scaled to full field of view)
    ------------------------------------------------------------- */
    ctx.save();
    ctx.strokeStyle = CRIMSON;
    ctx.shadowColor = CRIMSON_SHADOW;
    ctx.shadowBlur = 24;

    // Outer Left Mask Segment
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(80, 20);
    ctx.bezierCurveTo(5, 260, 5, 764, 80, 1004);
    ctx.stroke();

    // Left Secondary Bevels & Notches
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(110, 70);
    ctx.lineTo(45, 220);
    ctx.lineTo(45, 804);
    ctx.lineTo(110, 954);
    ctx.stroke();

    // Outer Right Mask Segment
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(944, 20);
    ctx.bezierCurveTo(1019, 260, 1019, 764, 944, 1004);
    ctx.stroke();

    // Right Secondary Bevels & Notches
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(914, 70);
    ctx.lineTo(979, 220);
    ctx.lineTo(979, 804);
    ctx.lineTo(914, 954);
    ctx.stroke();

    ctx.restore();

    /* -------------------------------------------------------------
       2. TOP FLIGHT ATTITUDE / PITCH LADDER
    ------------------------------------------------------------- */
    ctx.save();
    const ladderCenterY = 125;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2;
    ctx.fillStyle = CYAN;
    ctx.font = "bold 9px monospace";
    ctx.textAlign = "center";

    // Center vertical attitude index
    ctx.beginPath();
    ctx.moveTo(cx, ladderCenterY - 75);
    ctx.lineTo(cx, ladderCenterY + 65);
    ctx.stroke();

    // Ladder horizontal gradient steps
    for (let i = -4; i <= 4; i++) {
        const y = ladderCenterY + (i * 14);
        const w = (i === 0) ? 42 : 22 - Math.abs(i * 3);

        ctx.beginPath();
        ctx.moveTo(cx - w, y);
        ctx.lineTo(cx + w, y);
        ctx.stroke();

        if (i !== 0) {
            const tickH = i > 0 ? -4 : 4;
            ctx.beginPath();
            ctx.moveTo(cx - w, y);
            ctx.lineTo(cx - w, y + tickH);
            ctx.moveTo(cx + w, y);
            ctx.lineTo(cx + w, y + tickH);
            ctx.stroke();
        }
    }

    // Alignment Indicator Dots
    ctx.fillStyle = "#ff1a35";
    ctx.beginPath();
    ctx.arc(cx - 12, ladderCenterY + 75, 2.5, 0, Math.PI * 2);
    ctx.arc(cx + 12, ladderCenterY + 75, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* -------------------------------------------------------------
       3. TOP TARGETING HEADING ARC
    ------------------------------------------------------------- */
    ctx.save();
    ctx.strokeStyle = "rgba(0, 229, 255, 0.35)";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy - 200, 310, Math.PI * 1.18, Math.PI * 1.82);
    ctx.stroke();
    ctx.restore();

    /* -------------------------------------------------------------
       4. BLUE HOLOGRAPHIC TRACKERS (Movie Screenshot Style)
    ------------------------------------------------------------- */
    trackedTargets.forEach(tgt => {
        ctx.save();
        ctx.fillStyle = tgt.color;
        ctx.shadowColor = tgt.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(tgt.x, tgt.y, tgt.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = CYAN;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(tgt.x, tgt.y, tgt.r + 9 + (pulse * 2), 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(tgt.x + tgt.r + 10, tgt.y);
        ctx.lineTo(tgt.x + tgt.r + 35, tgt.y - 12);
        ctx.lineTo(tgt.x + tgt.r + 95, tgt.y - 12);
        ctx.stroke();

        ctx.fillStyle = tgt.color;
        ctx.font = "bold 10px monospace";
        ctx.fillText(`${tgt.label} [${tgt.dist}]`, tgt.x + tgt.r + 20, tgt.y - 16);
        ctx.restore();
    });

    /* -------------------------------------------------------------
       5. CENTRAL ERGONOMIC RETICLE & SPEECH CLUSTER
    ------------------------------------------------------------- */
    ctx.save();
    const reticleColor = voiceDetected ? "#ff1a35" : CYAN;
    ctx.strokeStyle = reticleColor;
    ctx.lineWidth = 2;
    ctx.shadowColor = reticleColor;
    ctx.shadowBlur = 8;

    const dynamicRadius = 34 + (voiceEnergy * 28);
    ctx.beginPath();
    ctx.arc(cx, cy, dynamicRadius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 6, cy);
    ctx.moveTo(cx + 6, cy); ctx.lineTo(cx + 16, cy);
    ctx.moveTo(cx, cy - 16); ctx.lineTo(cx - 6, cy);
    ctx.moveTo(cx, cy + 6); ctx.lineTo(cx, cy + 16);
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.0008);
    ctx.strokeStyle = "rgba(0, 229, 255, 0.4)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 18]);
    ctx.beginPath();
    ctx.arc(0, 0, 52, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = voiceDetected ? "#ff1a35" : (systemStatus === "TRANSMITTING" ? "#ffaa00" : CYAN);
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillText(voiceDetected ? "● AUDIO DETECTED // STREAMING" : `● K.A.R.E.N. // ${systemStatus}`, cx, cy + 74);

    ctx.fillStyle = "#ffffff";
    ctx.font = "18px 'Courier New', monospace";
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 4;
    wrapCenteredText(ctx, karenResponse, cx, cy + 110, 480, 24);

    ctx.restore();
}

function wrapCenteredText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   HANDS-FREE AMBIENT VOICE PIPELINE
================================================================= */
async function setupVAD() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(micStream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

    mediaRecorder = new MediaRecorder(micStream, { mimeType });
    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = sendVocalData;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function pollMicEnergy() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        voiceEnergy = avg / 128.0;

        if (avg > 25) {
            if (!voiceDetected && mediaRecorder.state === "inactive") {
                recordedChunks = [];
                mediaRecorder.start();
                voiceDetected = true;
                systemStatus = "LISTENING";
            }
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                if (voiceDetected && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    voiceDetected = false;
                    systemStatus = "TRANSMITTING";
                }
            }, 1100);
        }
        requestAnimationFrame(pollMicEnergy);
    }
    pollMicEnergy();
}

async function sendVocalData() {
    if (!recordedChunks.length) return;
    const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
    const reader = new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        
        try {
            let res;
            if (proxyUrl) {
                // Route through private proxy without exposing keys
                res = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio: base64Audio,
                        mimeType: mediaRecorder.mimeType.split(';')[0]
                    })
                });
            } else if (apiKey) {
                // Direct call using key saved locally on headset
                res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "You are Karen, Peter Parker's suit AI from Spider-Man: Homecoming. Answer tactically, warmly, and concisely in 1 to 2 short sentences." },
                                { inline_data: { mime_type: mediaRecorder.mimeType.split(';')[0], data: base64Audio } }
                            ]
                        }]
                    })
                });
            } else {
                throw new Error("No API Key or Proxy configured");
            }

            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || data.reply || "Signal resolved. No verbal advisory.";
            karenResponse = reply;
            systemStatus = "ONLINE";
            speak(reply);
        } catch (err) {
            karenResponse = "Network interruption. Check API Key configuration.";
            systemStatus = "ERROR";
        }
    };
}

function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-US";
    utt.pitch = 1.05;
    utt.rate = 1.08;
    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL STEREOSCOPIC FULL-SCREEN ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    varying vec2 vTex;
    void main() {
        // Positioned 1.1m away to span the user's field of view
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.1, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

// Quad expanded to 1.8m x 1.8m for peripheral coverage
const vertices = new Float32Array([
    -0.9, -0.9, 0.0,   0.0, 1.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
     0.9,  0.9, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION PIPELINE
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    proxyUrl = proxyUrlInput.value.trim();

    localStorage.setItem("stark_edith_key", apiKey);
    localStorage.setItem("stark_proxy_url", proxyUrl);

    if (!apiKey && !proxyUrl) {
        alert("Please provide either a local API key or a Serverless Proxy URL.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await setupVAD();

    if (!navigator.xr) {
        alert("Launch inside Meta Quest Browser over HTTPS.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        renderHomecomingDisplay(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
