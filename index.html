<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>E.D.I.T.H. - Tactical XR HUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #00e5ff; font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #240507 0%, #000000 85%);
            text-align: center; padding: 20px;
        }
        h1 { 
            font-size: 38px; letter-spacing: 14px; margin-bottom: 8px; 
            color: #ff1a35; text-shadow: 0 0 20px rgba(255, 26, 53, 0.9); 
            font-weight: 900;
        }
        p { color: #887777; font-size: 11px; letter-spacing: 3px; margin-bottom: 24px; }
        input {
            width: min(450px, 90%); padding: 16px 20px; margin-bottom: 20px;
            background: rgba(15, 2, 4, 0.9); border: 2px solid #ff1a35; color: #fff;
            text-align: center; outline: none; font-size: 14px;
            box-shadow: inset 0 0 12px rgba(255, 26, 53, 0.3);
        }
        button {
            padding: 16px 40px; background: rgba(255, 26, 53, 0.2);
            border: 2px solid #ff1a35; color: #ff1a35; font-weight: bold;
            font-size: 13px; letter-spacing: 3px; cursor: pointer; transition: 0.25s all;
        }
        button:hover { 
            background: #ff1a35; color: #000; 
            box-shadow: 0 0 30px rgba(255, 26, 53, 0.9); 
        }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="setupScreen">
    <h1>E.D.I.T.H.</h1>
    <p>HOMECOMING OPTICAL SYSTEM // TACTICAL AI</p>
    <input type="password" id="apiKeyInput" placeholder="PASTE GEMINI API KEY">
    <button id="btnInit">INITIALIZE SYSTEM</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("edith_gemini_key") || "";
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = apiKey;

let systemStatus = "ONLINE";
let edithResponse = "E.D.I.T.H. online. Speak into your headset.";
let audioContext = null;
let micStream = null;
let scriptProcessor = null;
let pcmSamples = [];
let voiceDetected = false;
let isSpeaking = false;
let silenceTimer = null;
let voiceEnergy = 0;
let liveLevel = 0;

/* =================================================================
   QUEST HARDWARE AUDIO KEEPALIVE
================================================================= */
function unlockQuestAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    }
    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
}

function playBeep(freq = 880) {
    try {
        if (audioContext && audioContext.state === "suspended") audioContext.resume();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);
        gain.gain.setValueAtTime(0.15, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.11);
    } catch (e) {}
}

/* =================================================================
   HOMECOMING CINEMATIC HUD
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

const CYAN = "rgba(0, 229, 255, 0.85)";
const CYAN_DIM = "rgba(0, 229, 255, 0.35)";
const CRIMSON = "rgba(235, 20, 45, 0.9)";
const CRIMSON_SHADOW = "rgba(180, 10, 30, 0.55)";

function renderDisplay(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;

    /* 1. EYE MASK VIGNETTE */
    ctx.save();
    ctx.strokeStyle = CRIMSON;
    ctx.shadowColor = CRIMSON_SHADOW;
    ctx.shadowBlur = 24;

    // Left Vignette
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(85, 30);
    ctx.bezierCurveTo(15, 270, 15, 754, 85, 994);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(110, 80);
    ctx.lineTo(45, 230);
    ctx.lineTo(45, 794);
    ctx.lineTo(110, 944);
    ctx.stroke();

    // Right Vignette
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(939, 30);
    ctx.bezierCurveTo(1009, 270, 1009, 754, 939, 994);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(914, 80);
    ctx.lineTo(979, 230);
    ctx.lineTo(979, 794);
    ctx.lineTo(914, 944);
    ctx.stroke();
    ctx.restore();

    /* 2. TOP PITCH LADDER */
    ctx.save();
    const ladderY = 90;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 1.5;
    ctx.fillStyle = CYAN;
    ctx.font = "bold 8px monospace";
    ctx.textAlign = "center";

    ctx.beginPath();
    ctx.moveTo(cx, ladderY - 45);
    ctx.lineTo(cx, ladderY + 45);
    ctx.stroke();

    for (let i = -3; i <= 3; i++) {
        const y = ladderY + (i * 11);
        const w = (i === 0) ? 30 : 16 - Math.abs(i * 2);

        ctx.beginPath();
        ctx.moveTo(cx - w, y);
        ctx.lineTo(cx + w, y);
        ctx.stroke();

        if (i !== 0) {
            const tickH = i > 0 ? -3 : 3;
            ctx.beginPath();
            ctx.moveTo(cx - w, y);
            ctx.lineTo(cx - w, y + tickH);
            ctx.moveTo(cx + w, y);
            ctx.lineTo(cx + w, y + tickH);
            ctx.stroke();
        }
    }

    ctx.fillStyle = "#ff1a35";
    ctx.beginPath();
    ctx.arc(cx - 8, ladderY + 52, 2, 0, Math.PI * 2);
    ctx.arc(cx + 8, ladderY + 52, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* 3. DOTTED CURVED GUIDANCE ARC */
    ctx.save();
    ctx.strokeStyle = CYAN_DIM;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy - 240, 310, Math.PI * 1.18, Math.PI * 1.82);
    ctx.stroke();
    ctx.restore();

    /* 4. TOP-RIGHT SPEAKER BARS */
    ctx.save();
    const spkX = 750, spkY = 85;
    ctx.fillStyle = isSpeaking ? "#00ff88" : CYAN;
    ctx.font = "bold 11px monospace";
    ctx.fillText("E.D.I.T.H. // VOICE", spkX, spkY - 12);

    for (let b = 0; b < 9; b++) {
        const barHeight = isSpeaking 
            ? Math.abs(Math.sin(time * 0.015 + b)) * 20 + 4
            : (voiceDetected ? Math.abs(Math.sin(time * 0.02 + b)) * 24 * voiceEnergy + 3 : 3);

        ctx.fillStyle = isSpeaking ? "#00ff88" : (voiceDetected ? "#ff1a35" : CYAN);
        ctx.fillRect(spkX + (b * 8), spkY - (barHeight / 2), 4, barHeight);
    }
    ctx.restore();

    /* 5. CENTRAL MYOPIA CLUSTER & LIVE MIC DB METER */
    ctx.save();
    const reticleColor = voiceDetected ? "#ff1a35" : (isSpeaking ? "#00ff88" : CYAN);
    ctx.strokeStyle = reticleColor;
    ctx.lineWidth = 2;
    ctx.shadowColor = reticleColor;
    ctx.shadowBlur = 8;

    const dynamicRadius = 26 + (voiceEnergy * 24);
    ctx.beginPath();
    ctx.arc(cx, cy, dynamicRadius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 14, cy); ctx.lineTo(cx - 5, cy);
    ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 14, cy);
    ctx.moveTo(cx, cy - 14); ctx.lineTo(cx - 5, cy);
    ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, cy + 14);
    ctx.stroke();

    // Live Mic Meter
    const meterW = 140, meterH = 4;
    ctx.fillStyle = "rgba(0, 229, 255, 0.2)";
    ctx.fillRect(cx - (meterW / 2), cy + 44, meterW, meterH);
    ctx.fillStyle = voiceDetected ? "#ff1a35" : "#00e5ff";
    ctx.fillRect(cx - (meterW / 2), cy + 44, Math.min(meterW, meterW * (liveLevel * 2)), meterH);

    ctx.fillStyle = voiceDetected ? "#ff1a35" : (systemStatus === "PROCESSING" ? "#ffaa00" : CYAN);
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText(voiceDetected ? "● RECORDING DIRECTIVE..." : `● ${systemStatus}`, cx, cy + 64);

    // Centered E.D.I.T.H. Captions
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px 'Courier New', monospace";
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 4;
    wrapCenteredText(ctx, edithResponse, cx, cy + 96, 460, 22);
    ctx.restore();
}

function wrapCenteredText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   WAV ENCODER (16kHz 16-Bit Mono)
================================================================= */
function encodeWAV(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(view, 36, 'data');
    view.setUint32(40, samples.length * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
    }

    return new Uint8Array(buffer);
}

/* =================================================================
   VOICE RECORDING ENGINE
================================================================= */
async function setupVAD() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    unlockQuestAudio();

    const source = audioContext.createMediaStreamSource(micStream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    
    scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
    
    source.connect(analyser);
    source.connect(scriptProcessor);
    scriptProcessor.connect(audioContext.destination);

    scriptProcessor.onaudioprocess = (e) => {
        if (!voiceDetected) return;
        const channelData = e.inputBuffer.getChannelData(0);
        for (let i = 0; i < channelData.length; i++) {
            pcmSamples.push(channelData[i]);
        }
    };

    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function pollMicEnergy() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        voiceEnergy = avg / 128.0;
        liveLevel = avg / 70.0;

        if (avg > 15 && !isSpeaking) {
            if (!voiceDetected) {
                pcmSamples = [];
                voiceDetected = true;
                systemStatus = "RECORDING";
            }
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                if (voiceDetected) {
                    voiceDetected = false;
                    systemStatus = "PROCESSING";
                    sendVocalDirective();
                }
            }, 1000);
        }
        requestAnimationFrame(pollMicEnergy);
    }
    pollMicEnergy();
}

async function sendVocalDirective() {
    if (pcmSamples.length < 6000) {
        systemStatus = "ONLINE";
        return;
    }

    const wavBytes = encodeWAV(pcmSamples, 16000);
    pcmSamples = [];
    
    let binary = '';
    for (let i = 0; i < wavBytes.byteLength; i++) {
        binary += String.fromCharCode(wavBytes[i]);
    }
    const base64Audio = btoa(binary);

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: "You are E.D.I.T.H., Tony Stark's tactical AI. Speak concisely, tactically, and warmly in 1 to 2 short sentences." },
                        { inline_data: { mime_type: "audio/wav", data: base64Audio } }
                    ]
                }]
            })
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(`[${res.status}] ${errData.error?.message || 'API Rejected'}`);
        }

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Directive acknowledged.";
        edithResponse = reply;
        systemStatus = "ONLINE";
        speakResponse(reply);
    } catch (err) {
        edithResponse = `ERROR: ${err.message}`;
        systemStatus = "ERR_RETRY";
        playBeep(440);
    }
}

/* =================================================================
   HEADSET SPEECH SYNTHESIS
================================================================= */
function speakResponse(text) {
    if (!window.speechSynthesis) return;

    unlockQuestAudio();
    playBeep(1200);

    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-GB";
    utt.rate = 1.05;
    utt.pitch = 0.95;

    utt.onstart = () => { isSpeaking = true; };
    utt.onend = () => { isSpeaking = false; };
    utt.onerror = () => { isSpeaking = false; };

    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL PASSTHROUGH ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    varying vec2 vTex;
    void main() {
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.15, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

const vertices = new Float32Array([
    -0.9, -0.9, 0.0,   0.0, 1.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
     0.9,  0.9, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION INITIALIZATION
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("edith_gemini_key", apiKey);

    if (!apiKey) {
        alert("Enter your Gemini API key.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await setupVAD();
    playBeep(880);

    if (!navigator.xr) {
        alert("Launch inside Meta Quest Browser over HTTPS.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        renderDisplay(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
