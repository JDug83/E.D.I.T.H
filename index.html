<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>E.D.I.T.H. Spider-Vision HUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #00d9ff; font-family: 'Segoe UI', monospace, sans-serif;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #051a29 0%, #010408 85%);
            text-align: center; padding: 20px;
        }
        h1 { font-size: 40px; letter-spacing: 12px; margin-bottom: 6px; text-shadow: 0 0 18px #00d9ff; }
        p { color: #8899aa; font-size: 12px; letter-spacing: 2px; margin-bottom: 24px; }
        input {
            width: min(420px, 90%); padding: 14px; margin-bottom: 18px;
            background: rgba(0,0,0,0.8); border: 1px solid #00d9ff; color: #fff;
            text-align: center; outline: none; font-size: 14px;
        }
        button {
            padding: 14px 32px; background: rgba(0, 217, 255, 0.2);
            border: 1px solid #00d9ff; color: #00d9ff; font-weight: bold;
            font-size: 13px; letter-spacing: 2px; cursor: pointer; transition: 0.2s all;
        }
        button:hover { background: #00d9ff; color: #000; }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="setupScreen">
    <h1>E.D.I.T.H.</h1>
    <p>SPIDER-VISION // TACTICAL AR HUD</p>
    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key">
    <button id="btnInit">INITIALIZE HUD</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("edith_key") || "";
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = apiKey;

let statusMsg = "STANDBY";
let responseText = "SPIDER-VISION ONLINE. LISTENING FOR DIRECTIVES.";
let micStream = null;
let audioContext = null;
let mediaRecorder = null;
let recordedChunks = [];
let isVoiceActive = false;
let silenceTimer = null;
let voiceEnergy = 0;

// Dynamic Hitbox System
const hitboxes = [
    { x: 260, y: 380, w: 120, h: 140, label: "OBJ_ALPHA // THREAT: LOW", dist: "1.4m", pulse: 0 },
    { x: 680, y: 320, w: 140, h: 180, label: "OBJ_BETA // ANOMALY", dist: "2.1m", pulse: 1 },
    { x: 480, y: 640, w: 90, h: 70, label: "SURFACE // ELEVATION 0", dist: "0.8m", pulse: 2 }
];

/* =================================================================
   2D HUD ENGINE (Spider-Vision Aesthetics + Spatial Hitboxes)
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

function drawHUD(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;
    const pulse = Math.sin(time * 0.003) * 6;

    // --- Spider-Vision Outer Hexagonal Mask Bounds ---
    ctx.strokeStyle = "rgba(0, 217, 255, 0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(180, 140); ctx.lineTo(844, 140);
    ctx.lineTo(940, 512); ctx.lineTo(844, 884);
    ctx.lineTo(180, 884); ctx.lineTo(84, 512);
    ctx.closePath();
    ctx.stroke();

    // --- Dynamic Target Reticle (Changes on Voice Detection) ---
    const reticleColor = isVoiceActive ? "rgba(255, 60, 80, 0.95)" : "rgba(0, 217, 255, 0.85)";
    ctx.strokeStyle = reticleColor;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 110 + pulse + (voiceEnergy * 40), 0, Math.PI * 2);
    ctx.stroke();

    // Inner Tri-Blade Reticle
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.001);
    for (let i = 0; i < 3; i++) {
        ctx.rotate((Math.PI * 2) / 3);
        ctx.strokeStyle = "#00d9ff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 75, 0, 0.5);
        ctx.stroke();
    }
    ctx.restore();

    // Center Pip
    ctx.fillStyle = isVoiceActive ? "#ff4050" : "#00ff88";
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fill();

    // --- Angular Tactical Corner Brackets ---
    const corners = [
        { x: 120, y: 180, sx: 1, sy: 1 },
        { x: 904, y: 180, sx: -1, sy: 1 },
        { x: 120, y: 844, sx: 1, sy: -1 },
        { x: 904, y: 844, sx: -1, sy: -1 }
    ];
    corners.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.sx, c.sy);
        ctx.strokeStyle = "#00d9ff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 40); ctx.lineTo(0, 0); ctx.lineTo(40, 0);
        ctx.stroke();
        ctx.restore();
    });

    // --- Autonomous Spatial Hitboxes ---
    hitboxes.forEach((box, index) => {
        const osc = Math.sin(time * 0.002 + box.pulse) * 3;
        const bx = box.x + osc;
        const by = box.y;

        // Bounding Rectangle
        ctx.strokeStyle = "rgba(0, 217, 255, 0.7)";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
        ctx.strokeRect(bx, by, box.w, box.h);
        ctx.setLineDash([]);

        // Bracket Corners on Hitbox
        const bLen = 10;
        ctx.strokeStyle = "#00ff88";
        ctx.lineWidth = 2;
        // TL
        ctx.beginPath(); ctx.moveTo(bx, by + bLen); ctx.lineTo(bx, by); ctx.lineTo(bx + bLen, by); ctx.stroke();
        // BR
        ctx.beginPath(); ctx.moveTo(bx + box.w - bLen, by + box.h); ctx.lineTo(bx + box.w, by + box.h); ctx.lineTo(bx + box.w, by + box.h - bLen); ctx.stroke();

        // Data Tags
        ctx.fillStyle = "rgba(0, 20, 30, 0.7)";
        ctx.fillRect(bx, by - 24, box.w + 40, 20);
        ctx.fillStyle = "#00d9ff";
        ctx.font = "bold 11px monospace";
        ctx.fillText(`${box.label} [${box.dist}]`, bx + 4, by - 10);
    });

    // --- Telemetry & System Header ---
    ctx.fillStyle = "#00d9ff";
    ctx.font = "bold 30px monospace";
    ctx.textAlign = "center";
    ctx.fillText("E.D.I.T.H.", cx, cy - 260);

    ctx.fillStyle = isVoiceActive ? "#ff4050" : (statusMsg === "THINKING" ? "#ffbb00" : "#00ff88");
    ctx.font = "14px monospace";
    ctx.fillText(isVoiceActive ? "● AUDIO DETECTED // STREAMING DIRECTIVE" : `● STATUS: ${statusMsg}`, cx, cy - 230);

    // AI Response Stream
    ctx.fillStyle = "#ffffff";
    ctx.font = "22px sans-serif";
    ctx.textAlign = "center";
    wrapText(ctx, responseText, cx, cy + 200, 800, 30);
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   HANDS-FREE VOICE ACTIVITY DETECTION (VAD)
================================================================= */
async function setupHandsFreeVoice() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(micStream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);

    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

    mediaRecorder = new MediaRecorder(micStream, { mimeType });
    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = processVoiceQuery;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function checkEnergy() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
        const avg = sum / bufferLength;
        voiceEnergy = avg / 128.0;

        // Sound detected above background threshold
        if (avg > 24) {
            if (!isVoiceActive && mediaRecorder.state === "inactive") {
                recordedChunks = [];
                mediaRecorder.start();
                isVoiceActive = true;
                statusMsg = "LISTENING";
            }
            clearTimeout(silenceTimer);
            // 1.2s trailing silence triggers auto-send
            silenceTimer = setTimeout(() => {
                if (isVoiceActive && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    isVoiceActive = false;
                    statusMsg = "THINKING";
                }
            }, 1200);
        }
        requestAnimationFrame(checkEnergy);
    }
    checkEnergy();
}

async function processVoiceQuery() {
    if (!recordedChunks.length) return;
    const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
    const reader = new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "You are E.D.I.T.H., Tony Stark's augmented intelligence. Answer in 1 to 2 brief tactical sentences." },
                            { inline_data: { mime_type: mediaRecorder.mimeType.split(';')[0], data: base64Audio } }
                        ]
                    }]
                })
            });
            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No intelligence payload returned.";
            responseText = reply;
            statusMsg = "ONLINE";
            speak(reply);
        } catch (err) {
            responseText = "Neural link failed. Verify Gemini API key.";
            statusMsg = "ERROR";
        }
    };
}

function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-GB";
    utt.rate = 1.05;
    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL STEREOSCOPIC VIEWPORT ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    varying vec2 vTex;
    void main() {
        // Spatial anchor: 1.4m directly forward in eye space
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.4, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

// 1.3m x 1.3m Quad centered at Z = 0
const vertices = new Float32Array([
    -0.65, -0.65, 0.0,   0.0, 1.0,
     0.65, -0.65, 0.0,   1.0, 1.0,
    -0.65,  0.65, 0.0,   0.0, 0.0,
    -0.65,  0.65, 0.0,   0.0, 0.0,
     0.65, -0.65, 0.0,   1.0, 1.0,
     0.65,  0.65, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION INITIALIZATION
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("edith_key", apiKey);
    if (!apiKey) {
        alert("Enter your Gemini API key.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await setupHandsFreeVoice();

    if (!navigator.xr) {
        alert("Launch inside the Meta Quest Browser over HTTPS.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        drawHUD(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
