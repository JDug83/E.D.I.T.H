<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>E.D.I.T.H. Tactical XR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #00d9ff; font-family: 'Segoe UI', monospace, sans-serif;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #051a29 0%, #010408 85%);
            text-align: center; padding: 20px;
        }
        h1 { font-size: 40px; letter-spacing: 10px; margin-bottom: 8px; text-shadow: 0 0 15px #00d9ff; }
        p { color: #8899aa; font-size: 13px; letter-spacing: 2px; margin-bottom: 24px; }
        input {
            width: min(400px, 90%); padding: 12px; margin-bottom: 16px;
            background: rgba(0,0,0,0.8); border: 1px solid #00d9ff; color: #fff;
            text-align: center; outline: none; font-size: 14px;
        }
        button {
            padding: 14px 28px; background: rgba(0, 217, 255, 0.2);
            border: 1px solid #00d9ff; color: #00d9ff; font-weight: bold;
            font-size: 14px; letter-spacing: 2px; cursor: pointer;
        }
        button:hover { background: #00d9ff; color: #000; }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="setupScreen">
    <h1>E.D.I.T.H.</h1>
    <p>AUGMENTED THREAT SYSTEM</p>
    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key">
    <button id="btnInit">ENTER PASSTHROUGH</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("edith_key") || "";
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = apiKey;

let statusMsg = "STANDBY";
let responseText = "E.D.I.T.H. ONLINE. PULL TRIGGER TO SPEAK.";
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let micStream = null;

/* =================================================================
   2D HUD ENGINE (Drawn to Offscreen Texture)
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

function drawHUD(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;
    const pulse = Math.sin(time * 0.003) * 8;

    // Outer Target Reticle
    ctx.strokeStyle = isRecording ? "rgba(255, 60, 80, 0.95)" : "rgba(0, 217, 255, 0.9)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, 140 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Aim Circle
    ctx.strokeStyle = "rgba(0, 217, 255, 0.5)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 85, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshairs
    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 200, cy); ctx.lineTo(cx + 200, cy);
    ctx.moveTo(cx, cy - 200); ctx.lineTo(cx, cy + 200);
    ctx.stroke();

    // HUD Corner Accents
    const b = 250, len = 45;
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#00d9ff";
    // TL
    ctx.beginPath(); ctx.moveTo(cx - b, cy - b + len); ctx.lineTo(cx - b, cy - b); ctx.lineTo(cx - b + len, cy - b); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(cx + b - len, cy - b); ctx.lineTo(cx + b, cy - b); ctx.lineTo(cx + b, cy - b + len); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(cx - b, cy + b - len); ctx.lineTo(cx - b, cy + b); ctx.lineTo(cx - b + len, cy + b); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(cx + b - len, cy + b); ctx.lineTo(cx + b, cy + b); ctx.lineTo(cx + b, cy + b - len); ctx.stroke();

    // Top Header
    ctx.fillStyle = "#00d9ff";
    ctx.font = "bold 34px monospace";
    ctx.textAlign = "center";
    ctx.fillText("E.D.I.T.H.", cx, cy - 300);

    ctx.fillStyle = isRecording ? "#ff4050" : (statusMsg === "THINKING" ? "#ffbb00" : "#00ff88");
    ctx.font = "bold 22px monospace";
    ctx.fillText(isRecording ? "● TRANSMITTING..." : `● STATUS: ${statusMsg}`, cx, cy - 260);

    // AI Response Box
    ctx.fillStyle = "#ffffff";
    ctx.font = "26px sans-serif";
    ctx.textAlign = "center";
    wrapText(ctx, responseText, cx, cy + 220, 850, 36);
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   DIRECT MICROPHONE RECORDING (Bypasses missing SpeechRecognition)
================================================================= */
async function initMic() {
    try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Pick optimal mimeType supported by Meta Quest
        let mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

        mediaRecorder = new MediaRecorder(micStream, { mimeType });
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = sendAudioToGemini;
        statusMsg = "READY";
    } catch(err) {
        statusMsg = "MIC BLOCKED";
        responseText = "Allow microphone permissions in Quest Browser settings.";
    }
}

function toggleVoice() {
    if (!mediaRecorder) return;
    if (!isRecording) {
        audioChunks = [];
        mediaRecorder.start();
        isRecording = true;
        statusMsg = "LISTENING";
        responseText = "Listening to vocal directive...";
    } else {
        isRecording = false;
        mediaRecorder.stop();
        statusMsg = "THINKING";
        responseText = "Processing command with Gemini...";
    }
}

async function sendAudioToGemini() {
    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
    const reader = new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "You are E.D.I.T.H. from Spider-Man / Iron Man. Give a short, tactical 1-2 sentence response." },
                            { inline_data: { mime_type: mediaRecorder.mimeType.split(';')[0], data: base64Audio } }
                        ]
                    }]
                })
            });
            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No actionable data.";
            responseText = reply;
            statusMsg = "ONLINE";
            speak(reply);
        } catch (err) {
            responseText = "Connection failure. Verify API Key.";
            statusMsg = "ERROR";
        }
    };
}

function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-GB";
    utt.rate = 1.05;
    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL STEREOSCOPIC VIEWPORT ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    uniform mat4 uView;
    varying vec2 vTex;
    void main() {
        // Offset quad 1.5 meters directly forward into your field of view
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.5, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

// 1.2m x 1.2m Quad centered at Z = 0
const vertices = new Float32Array([
    -0.6, -0.6, 0.0,   0.0, 1.0,
     0.6, -0.6, 0.0,   1.0, 1.0,
    -0.6,  0.6, 0.0,   0.0, 0.0,
    -0.6,  0.6, 0.0,   0.0, 0.0,
     0.6, -0.6, 0.0,   1.0, 1.0,
     0.6,  0.6, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION PIPELINE
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("edith_key", apiKey);
    if (!apiKey) {
        alert("Enter your Gemini API key.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await initMic();

    if (!navigator.xr) {
        alert("WebXR unavailable. Launch inside Meta Quest Browser.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    // Pull controller trigger or click screen to toggle mic
    session.addEventListener("select", toggleVoice);
    window.addEventListener("pointerdown", toggleVoice);

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        // Alpha 0.0 is MANDATORY to allow Quest passthrough through
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        drawHUD(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        // Draw quad in both stereoscopic eyes
        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
