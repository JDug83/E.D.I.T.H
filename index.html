<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E.D.I.T.H.</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020609;
    color:#00d9ff;
    font-family:Arial,sans-serif;
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:0;
}

#hud{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

.logo{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:34px;
    font-weight:bold;
    letter-spacing:9px;
    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff,
        0 0 40px #008cff;
}

.online{
    position:absolute;
    top:73px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:4px;
    color:#00ff88;
}

.target{
    position:absolute;
    left:50%;
    top:50%;
    width:160px;
    height:160px;
    transform:translate(-50%,-50%);
    border:2px solid rgba(0,217,255,.75);
    border-radius:50%;
    box-shadow:
        0 0 20px #00d9ff,
        inset 0 0 20px rgba(0,217,255,.15);
}

.target:before{
    content:"";
    position:absolute;
    width:220px;
    height:1px;
    left:-32px;
    top:78px;
    background:#00d9ff;
}

.target:after{
    content:"";
    position:absolute;
    width:1px;
    height:220px;
    top:-32px;
    left:78px;
    background:#00d9ff;
}

.targetDot{
    position:absolute;
    width:7px;
    height:7px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#00ffff;
    border-radius:50%;
    box-shadow:
        0 0 10px #00ffff,
        0 0 25px #008cff;
}

.corner{
    position:absolute;
    width:22px;
    height:22px;
    border-color:#00ffff;
    border-style:solid;
}

.c1{
    left:-5px;
    top:-5px;
    border-width:2px 0 0 2px;
}

.c2{
    right:-5px;
    top:-5px;
    border-width:2px 2px 0 0;
}

.c3{
    left:-5px;
    bottom:-5px;
    border-width:0 0 2px 2px;
}

.c4{
    right:-5px;
    bottom:-5px;
    border-width:0 2px 2px 0;
}

.scanRing{
    position:absolute;
    left:50%;
    top:50%;
    width:245px;
    height:245px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(0,217,255,.25);
    border-radius:50%;
    animation:spin 4s linear infinite;
}

@keyframes spin{
    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }
    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

.status{
    position:absolute;
    left:25px;
    bottom:25px;
    width:270px;
    padding:18px;
    background:rgba(0,10,18,.72);
    border-left:2px solid #00d9ff;
    backdrop-filter:blur(10px);
}

.status h2{
    margin:0 0 13px;
    font-size:13px;
    letter-spacing:3px;
}

.status p{
    margin:8px 0;
    color:#aaa;
    font-size:12px;
}

.green{color:#00ff88}
.yellow{color:#ffff00}
.red{color:#ff4050}

#response{
    position:absolute;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    width:60%;
    max-width:700px;
    text-align:center;
    color:white;
    font-size:18px;
    line-height:1.5;
    text-shadow:0 0 10px #00d9ff;
}

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:radial-gradient(
        circle,
        #041824,
        #020609 70%
    );
}

#start h1{
    margin:0;
    font-size:52px;
    letter-spacing:11px;
    text-shadow:
        0 0 15px #00d9ff,
        0 0 40px #00d9ff;
}

#start p{
    color:#777;
    line-height:1.7;
    letter-spacing:2px;
}

button{
    padding:12px 18px;
    color:#00d9ff;
    background:rgba(0,10,18,.9);
    border:1px solid #00d9ff;
    cursor:pointer;
}

button:hover{
    background:#00d9ff;
    color:#001018;
}

#vrButton{
    position:fixed;
    top:20px;
    right:20px;
    z-index:200;
    display:none;
    pointer-events:auto;
}

#settingsButton{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:200;
    pointer-events:auto;
}

#settings{
    position:fixed;
    right:20px;
    top:70px;
    z-index:300;
    width:330px;
    padding:20px;
    display:none;
    background:rgba(2,10,15,.98);
    border:1px solid #00d9ff;
    pointer-events:auto;
}

#apiKey{
    width:100%;
    padding:10px;
    background:#000;
    color:white;
    border:1px solid #00d9ff;
}

#error{
    color:#ff4050;
    font-size:11px;
    margin-top:10px;
}

#arPanel{
    position:absolute;
    right:25px;
    bottom:25px;
    width:300px;
    padding:15px;
    background:rgba(0,10,18,.75);
    border:1px solid rgba(0,217,255,.65);
    backdrop-filter:blur(10px);
    pointer-events:auto;
    display:none;
}

#manualInput{
    width:100%;
    padding:12px;
    background:#000;
    color:white;
    border:1px solid #00d9ff;
    outline:none;
}

#manualInput:focus{
    box-shadow:0 0 12px rgba(0,217,255,.4);
}

.arButtons{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.arButtons button{
    flex:1;
    padding:9px 6px;
    font-size:11px;
}

.xrTitle{
    color:#00d9ff;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:8px;
}

body.xr-active #arPanel{
    display:block;
}

body.xr-active #vrButton{
    display:none!important;
}

body.xr-active #settingsButton{
    display:none!important;
}
</style>
</head>

<body>

<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>

<div id="start">

    <h1>E.D.I.T.H.</h1>

    <p>
        ENHANCED DEFENCE<br>
        INTELLIGENCE &amp; THREAT SYSTEM
    </p>

    <button id="startButton">
        INITIALIZE E.D.I.T.H.
    </button>

    <p style="font-size:11px;color:#555">
        Say "E.D.I.T.H." once to begin.
    </p>

</div>

<div id="hud">

    <div class="logo">
        E.D.I.T.H.
    </div>

    <div class="online">
        ● SYSTEM ONLINE
    </div>

    <div class="target">

        <div class="corner c1"></div>
        <div class="corner c2"></div>
        <div class="corner c3"></div>
        <div class="corner c4"></div>

        <div class="targetDot"></div>

    </div>

    <div class="scanRing"></div>

    <div class="status">

        <h2>SYSTEM STATUS</h2>

        <p>
            CAMERA:
            <span
                id="cameraStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            MICROPHONE:
            <span
                id="micStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            VOICE:
            <span
                id="voiceStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            AI:
            <span
                id="aiStatus"
                class="yellow">
                STANDBY
            </span>
        </p>

        <p>
            XR:
            <span
                id="xrStatus"
                class="yellow">
                CHECKING
            </span>
        </p>

    </div>

    <div id="response">
        E.D.I.T.H. is ready.
    </div>

    <div id="arPanel">

        <div class="xrTitle">
            E.D.I.T.H. AR INTERFACE
        </div>

        <input
            id="manualInput"
            type="text"
            placeholder="Ask E.D.I.T.H..."
            autocomplete="off"
        >

        <div class="arButtons">

            <button id="manualAsk">
                ASK
            </button>

            <button id="arSettings">
                SETTINGS
            </button>

            <button id="arExit">
                EXIT AR
            </button>

        </div>

    </div>

</div>

<button id="vrButton">
    ENTER E.D.I.T.H. AR
</button>

<button id="settingsButton">
    ⚙ SETTINGS
</button>

<div id="settings">

    <h2>E.D.I.T.H. SETTINGS</h2>

    <p>Gemini API Key</p>

    <input
        id="apiKey"
        type="password"
        placeholder="Paste Gemini API key"
    >

    <br><br>

    <button id="saveKey">
        SAVE
    </button>

    <button id="closeSettings">
        CLOSE
    </button>

    <div id="error"></div>

</div>

<script>

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const camera =
    document.getElementById("camera");

const cameraStatus =
    document.getElementById("cameraStatus");

const micStatus =
    document.getElementById("micStatus");

const voiceStatus =
    document.getElementById("voiceStatus");

const aiStatus =
    document.getElementById("aiStatus");

const xrStatus =
    document.getElementById("xrStatus");

const response =
    document.getElementById("response");

const vrButton =
    document.getElementById("vrButton");

const settings =
    document.getElementById("settings");

const settingsButton =
    document.getElementById("settingsButton");

const closeSettings =
    document.getElementById("closeSettings");

const saveKey =
    document.getElementById("saveKey");

const apiKeyInput =
    document.getElementById("apiKey");

const errorBox =
    document.getElementById("error");

const manualInput =
    document.getElementById("manualInput");

const manualAsk =
    document.getElementById("manualAsk");

const arSettings =
    document.getElementById("arSettings");

const arExit =
    document.getElementById("arExit");


let apiKey =
    localStorage.getItem(
        "edith_gemini_key"
    ) || "";


apiKeyInput.value =
    apiKey;


if(apiKey){

    aiStatus.textContent =
        "READY";

    aiStatus.className =
        "green";

}


saveKey.onclick = () => {

    const key =
        apiKeyInput.value.trim();

    if(!key){

        errorBox.textContent =
            "Enter a Gemini API key.";

        return;

    }

    apiKey =
        key;

    localStorage.setItem(
        "edith_gemini_key",
        key
    );

    aiStatus.textContent =
        "READY";

    aiStatus.className =
        "green";

    errorBox.textContent =
        "";

    settings.style.display =
        "none";

};


settingsButton.onclick = () => {

    settings.style.display =
        "block";

};


closeSettings.onclick = () => {

    settings.style.display =
        "none";

};


arSettings.onclick = () => {

    settings.style.display =
        "block";

};


let mediaStream =
    null;


async function startMedia(){

    try{

        mediaStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:
                            "environment"
                    },

                    audio:{
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true
                    }

                });


        camera.srcObject =
            mediaStream;


        camera.style.display =
            "block";


        cameraStatus.textContent =
            "ONLINE";

        cameraStatus.className =
            "green";


        micStatus.textContent =
            "CONNECTED";

        micStatus.className =
            "green";


        return true;


    }catch(error){

        console.error(error);

        response.textContent =
            "Please allow the camera and microphone.";

        cameraStatus.textContent =
            "DENIED";

        cameraStatus.className =
            "red";

        micStatus.textContent =
            "DENIED";

        micStatus.className =
            "red";

        return false;

    }

}


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let listening =
    false;

let edithStarted =
    false;

let conversationActive =
    false;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-GB";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            listening =
                true;

            voiceStatus.textContent =
                "LISTENING";

            voiceStatus.className =
                "green";

        };


    recognition.onresult =
        async(event) => {

            const result =
                event.results[
                    event.results.length - 1
                ];


            if(!result.isFinal)
                return;


            const spoken =
                result[0]
                    .transcript
                    .trim();


            console.log(
                "HEARD:",
                spoken
            );


            if(!spoken)
                return;


            if(!edithStarted){

                if(
                    !spoken
                        .toLowerCase()
                        .includes("edith")
                ){

                    return;

                }


                edithStarted =
                    true;


                conversationActive =
                    true;


                const question =
                    spoken
                        .replace(
                            /edith/gi,
                            ""
                        )
                        .trim();


                if(!question){

                    response.textContent =
                        "Yes. How can I assist?";


                    speak(
                        "Yes. How can I assist?"
                    );


                    return;

                }


                await askGemini(
                    question
                );


                return;

            }


            if(conversationActive){

                await askGemini(
                    spoken
                );

            }

        };


    recognition.onerror =
        (event) => {

            console.log(
                "VOICE:",
                event.error
            );


            listening =
                false;


            if(
                event.error ===
                    "not-allowed" ||

                event.error ===
                    "service-not-allowed"
            ){

                voiceStatus.textContent =
                    "BLOCKED";

                voiceStatus.className =
                    "red";

            }

        };


    recognition.onend =
        () => {

            listening =
                false;


            if(mediaStream){

                setTimeout(
                    startListening,
                    700
                );

            }

        };

}


function startListening(){

    if(!recognition)
        return;


    if(listening)
        return;


    try{

        recognition.start();

    }catch(error){

        console.log(
            error.message
        );

    }

}


function captureCamera(){

    if(
        !camera ||
        camera.readyState < 2 ||
        !camera.videoWidth
    ){

        return null;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const width =
        Math.min(
            1024,
            camera.videoWidth
        );


    const scale =
        width /
        camera.videoWidth;


    canvas.width =
        width;


    canvas.height =
        camera.videoHeight *
        scale;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return canvas
        .toDataURL(
            "image/jpeg",
            0.7
        )
        .split(",")[1];

}


async function askGemini(
    question
){

    if(!apiKey){

        response.textContent =
            "Add your Gemini API key in Settings.";

        settings.style.display =
            "block";

        return;

    }


    aiStatus.textContent =
        "ANALYSING";

    aiStatus.className =
        "yellow";


    const image =
        captureCamera();


    const parts = [

        {

            text:

`You are E.D.I.T.H., a futuristic personal AI assistant.

User:
${question}

If a camera image is provided, use it to answer questions about the user's surroundings.

Only describe things actually visible.

Do not make things up.

Keep answers concise and natural.`

        }

    ];


    if(image){

        parts.push({

            inline_data:{

                mime_type:
                    "image/jpeg",

                data:
                    image

            }

        });

    }


    const url =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" +
        encodeURIComponent(
            apiKey
        );


    let result =
        null;

    let errorText =
        "";


    for(
        let attempt = 1;
        attempt <= 3;
        attempt++
    ){

        try{

            result =
                await fetch(
                    url,
                    {

                        method:
                            "POST",

                        headers:{

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                contents:[

                                    {

                                        parts:
                                            parts

                                    }

                                ]

                            })

                    }
                );


        }catch(error){

            errorText =
                error.message;

            break;

        }


        if(result.ok){

            break;

        }


        errorText =
            await result.text();


        if(
            result.status === 503 ||
            result.status === 429
        ){

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        attempt * 2500
                    )
            );

            continue;

        }


        break;

    }


    if(
        !result ||
        !result.ok
    ){

        console.error(
            errorText
        );


        aiStatus.textContent =
            "ERROR";

        aiStatus.className =
            "red";


        if(
            result &&
            result.status === 503
        ){

            response.textContent =
                "Gemini is temporarily busy.";

        }else{

            response.textContent =
                "Gemini connection error.";

        }


        return;

    }


    try{

        const data =
            await result.json();


        const answer =
            data
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;


        if(!answer)
            throw new Error(
                "No AI response"
            );


        aiStatus.textContent =
            "ONLINE";

        aiStatus.className =
            "green";


        response.textContent =
            answer;


        speak(
            answer
        );


    }catch(error){

        console.error(
            error
        );


        aiStatus.textContent =
            "ERROR";

        aiStatus.className =
            "red";


        response.textContent =
            "E.D.I.T.H. could not process the response.";

    }

}


function speak(
    text
){

    if(
        !window.speechSynthesis
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-GB";


    speech.rate =
        1;


    speech.pitch =
        0.9;


    speech.onstart =
        () => {

            voiceStatus.textContent =
                "SPEAKING";

            voiceStatus.className =
                "green";

        };


    speech.onend =
        () => {

            voiceStatus.textContent =
                "LISTENING";

            voiceStatus.className =
                "green";

        };


    window.speechSynthesis.speak(
        speech
    );

}


manualAsk.onclick =
    async() => {

        const question =
            manualInput.value.trim();


        if(!question)
            return;


        manualInput.value =
            "";


        conversationActive =
            true;


        await askGemini(
            question
        );

    };


manualInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            manualAsk.click();

        }

    }
);


startButton.onclick =
    async() => {

        startButton.disabled =
            true;


        startButton.textContent =
            "INITIALIZING...";


        const ok =
            await startMedia();


        if(!ok){

            startButton.disabled =
                false;

            startButton.textContent =
                "TRY AGAIN";

            return;

        }


        start.style.display =
            "none";


        startListening();

    };


let xrSession =
    null;

let xrRefSpace =
    null;

let xrGL =
    null;


async function checkXR(){

    if(!navigator.xr){

        xrStatus.textContent =
            "NOT AVAILABLE";

        xrStatus.className =
            "red";

        return;

    }


    try{

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if(supported){

            xrStatus.textContent =
                "AR READY";

            xrStatus.className =
                "green";


            vrButton.style.display =
                "block";

        }else{

            xrStatus.textContent =
                "AR NOT SUPPORTED";

            xrStatus.className =
                "red";

        }

    }catch(error){

        console.error(
            error
        );

        xrStatus.textContent =
            "ERROR";

        xrStatus.className =
            "red";

    }

}


vrButton.onclick =
    async() => {

        if(xrSession){

            await xrSession.end();

            return;

        }


        if(!navigator.xr){

            return;

        }


        try{

            const arSupported =
                await navigator.xr
                    .isSessionSupported(
                        "immersive-ar"
                    );


            if(!arSupported){

                response.textContent =
                    "Immersive AR is not supported.";

                return;

            }


            /*
             * IMPORTANT:
             *
             * Quest AR ONLY.
             *
             * There is NO immersive-vr
             * fallback.
             */

            xrSession =
                await navigator.xr
                    .requestSession(
                        "immersive-ar",
                        {
                            optionalFeatures:[
                                "local-floor",
                                "bounded-floor",
                                "dom-overlay",
                                "hand-tracking",
                                "plane-detection"
                            ],
                            domOverlay:{
                                root:
                                    document.getElementById(
                                        "hud"
                                    )
                            }
                        }
                    );


            xrSession.addEventListener(
                "end",
                () => {

                    xrSession =
                        null;


                    document.body
                        .classList
                        .remove(
                            "xr-active"
                        );


                    xrStatus.textContent =
                        "AR READY";

                    xrStatus.className =
                        "green";


                    vrButton.textContent =
                        "ENTER E.D.I.T.H. AR";

                }
            );


            document.body
                .classList
                .add(
                    "xr-active"
                );


            vrButton.textContent =
                "EXIT E.D.I.T.H.";


            xrStatus.textContent =
                "PASSTHROUGH ACTIVE";

            xrStatus.className =
                "green";


            await setupXR(
                xrSession
            );


        }catch(error){

            console.error(
                "XR ERROR:",
                error
            );


            response.textContent =
                "Could not enter AR: " +
                error.message;


            xrStatus.textContent =
                "ERROR";

            xrStatus.className =
                "red";

        }

    };


arExit.onclick =
    async() => {

        if(xrSession){

            await xrSession.end();

        }

    };


async function setupXR(
    session
){

    const canvas =
        document.createElement(
            "canvas"
        );


    xrGL =
        canvas.getContext(
            "webgl",
            {
                xrCompatible:true,
                alpha:true,
                antialias:true
            }
        );


    if(!xrGL){

        throw new Error(
            "WebGL unavailable."
        );

    }


    await xrGL
        .makeXRCompatible();


    /*
     * Transparent XR layer.
     *
     * Quest passthrough remains
     * visible behind the HUD.
     */

    const layer =
        new XRWebGLLayer(
            session,
            xrGL,
            {
                alpha:true,
                antialias:true
            }
        );


    session.updateRenderState({
        baseLayer:
            layer
    });


    xrRefSpace =
        await session
            .requestReferenceSpace(
                "local"
            );


    session.requestAnimationFrame(
        renderXR
    );

}


function renderXR(
    time,
    frame
){

    const session =
        frame.session;


    const layer =
        session.renderState
            .baseLayer;


    xrGL.bindFramebuffer(
        xrGL.FRAMEBUFFER,
        layer.framebuffer
    );


    /*
     * NEVER paint the XR background black.
     *
     * Alpha = 0 means transparent,
     * allowing Quest passthrough.
     */

    xrGL.clearColor(
        0,
        0,
        0,
        0
    );


    xrGL.clear(
        xrGL.COLOR_BUFFER_BIT |
        xrGL.DEPTH_BUFFER_BIT
    );


    session.requestAnimationFrame(
        renderXR
    );

}


checkXR();

</script>
