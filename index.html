<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>E.D.I.T.H. Tactical Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #00e5ff; font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #240507 0%, #000000 85%);
            text-align: center; padding: 20px;
        }
        h1 { 
            font-size: 38px; letter-spacing: 14px; margin-bottom: 8px; 
            color: #ff1a35; text-shadow: 0 0 20px rgba(255, 26, 53, 0.8); 
            font-weight: 900;
        }
        p { color: #998888; font-size: 11px; letter-spacing: 3px; margin-bottom: 24px; }
        .config-box {
            display: flex; flex-direction: column; gap: 12px; width: min(440px, 90%);
            margin-bottom: 20px;
        }
        input {
            width: 100%; padding: 14px 18px;
            background: rgba(15, 2, 4, 0.85); border: 2px solid #ff1a35; color: #fff;
            text-align: center; outline: none; font-size: 14px;
            box-shadow: inset 0 0 10px rgba(255, 26, 53, 0.3);
        }
        button {
            padding: 15px 36px; background: rgba(255, 26, 53, 0.15);
            border: 2px solid #ff1a35; color: #ff1a35; font-weight: bold;
            font-size: 13px; letter-spacing: 3px; cursor: pointer; transition: 0.25s all;
        }
        button:hover { 
            background: #ff1a35; color: #000; 
            box-shadow: 0 0 25px rgba(255, 26, 53, 0.9); 
        }
        #camera { display: none; }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

<video id="camera" autoplay muted playsinline></video>

<div id="setupScreen">
    <h1>E.D.I.T.H.</h1>
    <p>ENHANCED DEFENCE INTELLIGENCE // HOMECOMING PROTOCOL</p>
    <div class="config-box">
        <input type="password" id="apiKeyInput" placeholder="PASTE GEMINI API KEY HERE">
    </div>
    <button id="btnInit">INITIALIZE E.D.I.T.H.</button>
</div>

<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("edith_gemini_key") || "";
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = apiKey;

const camera = document.getElementById("camera");
let systemStatus = "ONLINE";
let edithResponse = "E.D.I.T.H. online. Listening for voice directives.";
let micStream = null;
let recognition = null;
let isSpeaking = false;
let isListening = false;
let selectedVoice = null;

function loadVoices() {
    if (!window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    selectedVoice = voices.find(v => v.lang.includes("en-GB") || v.lang.includes("en-US")) || voices[0];
}
if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}

/* =================================================================
   CAMERA VIDEO FEED (Context for Gemini)
================================================================= */
async function startCamera() {
    try {
        micStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 } },
            audio: true
        });
        camera.srcObject = micStream;
    } catch(err) {
        console.warn("Camera/Mic stream denied:", err);
    }
}

function captureFrame() {
    if (!camera || camera.readyState < 2 || !camera.videoWidth) return null;
    const offscreen = document.createElement("canvas");
    const width = Math.min(800, camera.videoWidth);
    const scale = width / camera.videoWidth;
    offscreen.width = width;
    offscreen.height = camera.videoHeight * scale;
    const octx = offscreen.getContext("2d");
    octx.drawImage(camera, 0, 0, offscreen.width, offscreen.height);
    return offscreen.toDataURL("image/jpeg", 0.65).split(",")[1];
}

/* =================================================================
   HOMECOMING FILM HUD ENGINE
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

const CYAN = "rgba(0, 229, 255, 0.85)";
const CYAN_DIM = "rgba(0, 229, 255, 0.35)";
const CRIMSON = "rgba(235, 20, 45, 0.85)";
const CRIMSON_SHADOW = "rgba(180, 10, 30, 0.5)";

function renderHomecomingDisplay(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;

    /* 1. EYE MASK VIGNETTE */
    ctx.save();
    ctx.strokeStyle = CRIMSON;
    ctx.shadowColor = CRIMSON_SHADOW;
    ctx.shadowBlur = 20;

    // Left Vignette
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(80, 40);
    ctx.bezierCurveTo(15, 280, 15, 744, 80, 984);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(105, 90);
    ctx.lineTo(45, 240);
    ctx.lineTo(45, 784);
    ctx.lineTo(105, 934);
    ctx.stroke();

    // Right Vignette
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(944, 40);
    ctx.bezierCurveTo(1009, 280, 1009, 744, 944, 984);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(919, 90);
    ctx.lineTo(979, 240);
    ctx.lineTo(979, 784);
    ctx.lineTo(919, 934);
    ctx.stroke();
    ctx.restore();

    /* 2. TOP AIRCRAFT ATTITUDE / PITCH LADDER */
    ctx.save();
    const ladderCenterY = 90;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 1.5;
    ctx.fillStyle = CYAN;
    ctx.font = "bold 8px monospace";
    ctx.textAlign = "center";

    ctx.beginPath();
    ctx.moveTo(cx, ladderCenterY - 45);
    ctx.lineTo(cx, ladderCenterY + 45);
    ctx.stroke();

    for (let i = -3; i <= 3; i++) {
        const y = ladderCenterY + (i * 11);
        const w = (i === 0) ? 28 : 16 - Math.abs(i * 2);

        ctx.beginPath();
        ctx.moveTo(cx - w, y);
        ctx.lineTo(cx + w, y);
        ctx.stroke();

        if (i !== 0) {
            const tickH = i > 0 ? -3 : 3;
            ctx.beginPath();
            ctx.moveTo(cx - w, y);
            ctx.lineTo(cx - w, y + tickH);
            ctx.moveTo(cx + w, y);
            ctx.lineTo(cx + w, y + tickH);
            ctx.stroke();
        }
    }

    ctx.fillStyle = "#ff1a35";
    ctx.beginPath();
    ctx.arc(cx - 8, ladderCenterY + 52, 2, 0, Math.PI * 2);
    ctx.arc(cx + 8, ladderCenterY + 52, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* 3. TOP TARGETING DOTTED ARC */
    ctx.save();
    ctx.strokeStyle = CYAN_DIM;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy - 240, 310, Math.PI * 1.18, Math.PI * 1.82);
    ctx.stroke();
    ctx.restore();

    /* 4. TOP-RIGHT E.D.I.T.H. AUDIO NODE */
    ctx.save();
    const speakX = 760;
    const speakY = 85;

    ctx.fillStyle = isSpeaking ? "#00ff88" : CYAN;
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "left";
    ctx.fillText("E.D.I.T.H. // LINK", speakX, speakY - 12);

    for (let b = 0; b < 8; b++) {
        const barHeight = isSpeaking 
            ? Math.abs(Math.sin(time * 0.015 + b)) * 18 + 4
            : (isListening ? Math.abs(Math.sin(time * 0.02 + b)) * 14 + 3 : 3);

        ctx.fillStyle = isSpeaking ? "#00ff88" : (isListening ? "#ffaa00" : CYAN);
        ctx.fillRect(speakX + (b * 7), speakY - (barHeight / 2), 4, barHeight);
    }
    ctx.restore();

    /* 5. CENTRAL MYOPIA CLUSTER */
    ctx.save();
    const reticleColor = isListening ? "#ffaa00" : CYAN;
    ctx.strokeStyle = reticleColor;
    ctx.lineWidth = 2;
    ctx.shadowColor = reticleColor;
    ctx.shadowBlur = 6;

    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 12, cy); ctx.lineTo(cx - 4, cy);
    ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 12, cy);
    ctx.moveTo(cx, cy - 12); ctx.lineTo(cx - 4, cy);
    ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + 12);
    ctx.stroke();

    ctx.fillStyle = isListening ? "#ffaa00" : (systemStatus === "ANALYZING" ? "#ff1a35" : CYAN);
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText(`● E.D.I.T.H. // ${systemStatus}`, cx, cy + 48);

    ctx.fillStyle = "#ffffff";
    ctx.font = "16px 'Courier New', monospace";
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 4;
    wrapCenteredText(ctx, edithResponse, cx, cy + 78, 480, 20);
    ctx.restore();
}

function wrapCenteredText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   ORIGINAL GEMINI E.D.I.T.H. AI ENGINE
================================================================= */
async function askGemini(promptText) {
    if (!apiKey) {
        edithResponse = "Add Gemini API Key on setup screen.";
        return;
    }

    systemStatus = "ANALYZING";
    edithResponse = "Processing directive...";

    const base64Image = captureFrame();
    const parts = [
        {
            text: `You are E.D.I.T.H., Tony Stark's augmented intelligence. Respond concisely, tactically, and in 1-2 short sentences.\nUser query: ${promptText}`
        }
    ];

    if (base64Image) {
        parts.push({
            inline_data: {
                mime_type: "image/jpeg",
                data: base64Image
            }
        });
    }

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts }] })
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(`[${res.status}] ${errData.error?.message || 'API Rejected'}`);
        }

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Directive received, no actionable output.";
        edithResponse = reply;
        systemStatus = "ONLINE";
        speakResponse(reply);
    } catch (err) {
        edithResponse = `ERROR: ${err.message}`;
        systemStatus = "ERR_RETRY";
    }
}

function speakResponse(text) {
    if (!window.speechSynthesis) return;

    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    if (selectedVoice) utt.voice = selectedVoice;
    utt.lang = "en-GB";
    utt.rate = 1.05;
    utt.pitch = 0.95;

    utt.onstart = () => { isSpeaking = true; };
    utt.onend = () => { isSpeaking = false; };
    utt.onerror = () => { isSpeaking = false; };

    window.speechSynthesis.speak(utt);
}

/* =================================================================
   SPEECH RECOGNITION PIPELINE
================================================================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function setupSpeech() {
    if (!SpeechRecognition) {
        edithResponse = "Speech recognition unavailable. Use trigger to query.";
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = "en-GB";

    recognition.onstart = () => {
        isListening = true;
        systemStatus = "LISTENING";
    };

    recognition.onerror = (e) => {
        if (e.error !== "no-speech") {
            systemStatus = "RETRYING";
        }
    };

    recognition.onend = () => {
        isListening = false;
        if (micStream) {
            setTimeout(() => {
                try { recognition.start(); } catch(e) {}
            }, 300);
        }
    };

    recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim();
        if (/edith/i.test(text)) {
            const query = text.replace(/edith/gi, "").trim();
            if (query) {
                askGemini(query);
            } else {
                speakResponse("Yes? Standing by.");
            }
        }
    };

    try {
        recognition.start();
    } catch(e) {}
}

/* =================================================================
   WEBGL FULL-SCREEN STEREOSCOPIC ENGINE
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uProj;
    varying vec2 vTex;
    void main() {
        vec4 pos = vec4(aPos.x, aPos.y, aPos.z - 1.15, 1.0);
        gl_Position = uProj * pos;
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

const vertices = new Float32Array([
    -0.9, -0.9, 0.0,   0.0, 1.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
    -0.9,  0.9, 0.0,   0.0, 0.0,
     0.9, -0.9, 0.0,   1.0, 1.0,
     0.9,  0.9, 0.0,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const projLoc = gl.getUniformLocation(prog, "uProj");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION PIPELINE
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("edith_gemini_key", apiKey);

    if (!apiKey) {
        alert("Enter your Gemini API key.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await startCamera();
    setupSpeech();

    if (!navigator.xr) {
        alert("Launch inside Meta Quest Browser over HTTPS.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    // Quest Controller Trigger allows quick-pinging queries manually if speech is quiet
    session.addEventListener("select", () => {
        askGemini("Perform environment assessment.");
    });

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        renderHomecomingDisplay(time);

        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        for (const view of pose.views) {
            const vp = xrLayer.getViewport(view);
            gl.viewport(vp.x, vp.y, vp.width, vp.height);
            gl.uniformMatrix4fv(projLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
