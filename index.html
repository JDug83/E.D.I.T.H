<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E.D.I.T.H.</title>

<style>
/* ==============================
   BASE
============================== */
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020609;
    color: #00d9ff;
    font-family: Arial, sans-serif;
}

:xr-overlay,
:xr-overlay body {
    background: transparent !important;
    background-color: rgba(0, 0, 0, 0) !important;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: transparent !important;
}

/* ==============================
   CAMERA PREVIEW (NON-XR MODE)
============================== */
#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 0;
}

/* ==============================
   E.D.I.T.H. LOGO & TARGET
============================== */
.logo {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 9px;
    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff,
        0 0 40px #008cff;
}

.online {
    position: absolute;
    top: 73px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 4px;
    color: #00ff88;
}

.target {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 160px;
    height: 160px;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(0,217,255,.75);
    border-radius: 50%;
    box-shadow:
        0 0 20px #00d9ff,
        inset 0 0 20px rgba(0,217,255,.15);
}

.target:before {
    content: "";
    position: absolute;
    width: 220px;
    height: 1px;
    left: -32px;
    top: 78px;
    background: #00d9ff;
}

.target:after {
    content: "";
    position: absolute;
    width: 1px;
    height: 220px;
    top: -32px;
    left: 78px;
    background: #00d9ff;
}

/* ==============================
   STATUS
============================== */
.status {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 270px;
    padding: 18px;
    background: rgba(0,10,18,.72);
    border-left: 2px solid #00d9ff;
    backdrop-filter: blur(10px);
    pointer-events: auto;
}

.status h2 {
    margin: 0 0 13px;
    font-size: 13px;
    letter-spacing: 3px;
}

.status p {
    margin: 8px 0;
    color: #aaa;
    font-size: 12px;
}

.green { color: #00ff88; }
.yellow { color: #ffff00; }
.red { color: #ff4050; }

/* ==============================
   AI RESPONSE
============================== */
#response {
    position: absolute;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    width: 70%;
    max-width: 750px;
    text-align: center;
    color: white;
    font-size: 18px;
    line-height: 1.5;
    text-shadow: 0 0 10px #00d9ff;
    pointer-events: auto;
}

/* ==============================
   MANUAL PROMPT BAR (VR & DESKTOP)
============================== */
#manualInputContainer {
    position: absolute;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    width: 60%;
    max-width: 600px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

#manualText {
    flex: 1;
    padding: 10px 14px;
    background: rgba(0, 10, 18, 0.85);
    border: 1px solid #00d9ff;
    color: white;
    font-size: 14px;
    border-radius: 4px;
    outline: none;
}

#manualSubmit {
    padding: 10px 18px;
    background: rgba(0, 217, 255, 0.2);
    border: 1px solid #00d9ff;
    color: #00d9ff;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}

#manualSubmit:hover {
    background: #00d9ff;
    color: #001018;
}

/* ==============================
   START SCREEN
============================== */
#start {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(circle, #041824, #020609 70%);
}

#start h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 11px;
    text-shadow:
        0 0 15px #00d9ff,
        0 0 40px #00d9ff;
}

#start p {
    color: #777;
    line-height: 1.7;
    letter-spacing: 2px;
}

button {
    padding: 12px 18px;
    color: #00d9ff;
    background: rgba(0,10,18,.9);
    border: 1px solid #00d9ff;
    cursor: pointer;
}

button:hover {
    background: #00d9ff;
    color: #001018;
}

/* ==============================
   BUTTONS
============================== */
#vrButton {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 200;
    display: none;
    pointer-events: auto;
}

#settingsButton {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 200;
    pointer-events: auto;
}

#settings {
    position: fixed;
    right: 20px;
    top: 70px;
    z-index: 300;
    width: 330px;
    padding: 20px;
    display: none;
    background: rgba(2,10,15,.98);
    border: 1px solid #00d9ff;
}

#apiKey {
    width: 100%;
    padding: 10px;
    background: #000;
    color: white;
    border: 1px solid #00d9ff;
}

#error {
    color: #ff4050;
    font-size: 11px;
    margin-top: 10px;
}

:xr-overlay #settingsButton {
    display: none;
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<div id="start">
    <h1>E.D.I.T.H.</h1>
    <p>
        ENHANCED DEFENCE<br>
        INTELLIGENCE &amp; THREAT SYSTEM
    </p>
    <button id="startButton">INITIALIZE E.D.I.T.H.</button>
    <p style="font-size:11px;color:#555">
        Say "E.D.I.T.H." or use the command line below.
    </p>
</div>

<div id="hud">
    <div class="logo">E.D.I.T.H.</div>
    <div class="online">● SYSTEM ONLINE</div>
    <div class="target"></div>

    <div class="status">
        <h2>SYSTEM STATUS</h2>
        <p>CAMERA: <span id="cameraStatus" class="yellow">STANDBY</span></p>
        <p>MICROPHONE: <span id="micStatus" class="yellow">STANDBY</span></p>
        <p>VOICE: <span id="voiceStatus" class="yellow">STANDBY</span></p>
        <p>AI: <span id="aiStatus" class="yellow">STANDBY</span></p>
        <p>XR: <span id="xrStatus" class="yellow">CHECKING</span></p>
    </div>

    <div id="response">E.D.I.T.H. is ready.</div>

    <div id="manualInputContainer">
        <input id="manualText" type="text" placeholder="Direct terminal command to E.D.I.T.H...">
        <button id="manualSubmit">TRANSMIT</button>
    </div>
</div>

<button id="vrButton">ENTER E.D.I.T.H. AR</button>
<button id="settingsButton">⚙ SETTINGS</button>

<div id="settings">
    <h2>E.D.I.T.H. SETTINGS</h2>
    <p>Gemini API Key</p>
    <input id="apiKey" type="password" placeholder="Paste Gemini API key">
    <br><br>
    <button id="saveKey">SAVE</button>
    <button id="closeSettings">CLOSE</button>
    <div id="error"></div>
</div>

<script>
/* =====================================================
   ELEMENTS
===================================================== */
const start = document.getElementById("start");
const startButton = document.getElementById("startButton");
const camera = document.getElementById("camera");
const cameraStatus = document.getElementById("cameraStatus");
const micStatus = document.getElementById("micStatus");
const voiceStatus = document.getElementById("voiceStatus");
const aiStatus = document.getElementById("aiStatus");
const xrStatus = document.getElementById("xrStatus");
const response = document.getElementById("response");
const vrButton = document.getElementById("vrButton");
const settings = document.getElementById("settings");
const settingsButton = document.getElementById("settingsButton");
const closeSettings = document.getElementById("closeSettings");
const saveKey = document.getElementById("saveKey");
const apiKeyInput = document.getElementById("apiKey");
const errorBox = document.getElementById("error");

const manualText = document.getElementById("manualText");
const manualSubmit = document.getElementById("manualSubmit");

/* =====================================================
   GEMINI CONFIGURATION
===================================================== */
let apiKey = localStorage.getItem("edith_gemini_key") || "";
apiKeyInput.value = apiKey;

if (apiKey) {
    aiStatus.textContent = "READY";
    aiStatus.className = "green";
}

saveKey.onclick = () => {
    const key = apiKeyInput.value.trim();
    if (!key) {
        errorBox.textContent = "Enter a Gemini API key.";
        return;
    }
    apiKey = key;
    localStorage.setItem("edith_gemini_key", key);
    aiStatus.textContent = "READY";
    aiStatus.className = "green";
    settings.style.display = "none";
};

settingsButton.onclick = () => { settings.style.display = "block"; };
closeSettings.onclick = () => { settings.style.display = "none"; };

/* =====================================================
   MANUAL COMMAND TERMINAL
===================================================== */
async function sendManualCommand() {
    const text = manualText.value.trim();
    if (!text) return;
    manualText.value = "";
    await askGemini(text);
}

manualSubmit.onclick = sendManualCommand;
manualText.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendManualCommand();
});

/* =====================================================
   DEVICE CAMERA & MICROPHONE CAPTURE
===================================================== */
let mediaStream = null;

async function startMedia() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });

        camera.srcObject = mediaStream;
        camera.style.display = "block";

        cameraStatus.textContent = "ONLINE";
        cameraStatus.className = "green";
        micStatus.textContent = "CONNECTED";
        micStatus.className = "green";

        return true;
    } catch (error) {
        console.warn("Hardware initialization fallback:", error);
        
        // Try audio-only if camera access was blocked
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            micStatus.textContent = "CONNECTED";
            micStatus.className = "green";
            cameraStatus.textContent = "OFFLINE";
            cameraStatus.className = "yellow";
            return true;
        } catch (audioErr) {
            response.textContent = "Audio/Camera blocked. Use the direct text input bar.";
            cameraStatus.textContent = "DENIED";
            cameraStatus.className = "red";
            micStatus.textContent = "DENIED";
            micStatus.className = "red";
            return true; // Still allow app to load for manual input
        }
    }
}

/* =====================================================
   VOICE ENGINE
===================================================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let edithStarted = false;
let conversationActive = false;
let restartTimer = null;

if (SpeechRecognition) {
    try {
        recognition = new SpeechRecognition();
        recognition.lang = "en-GB";
        recognition.continuous = false; // single pass avoids Quest browser hangs
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            listening = true;
            voiceStatus.textContent = "LISTENING";
            voiceStatus.className = "green";
        };

        recognition.onresult = async (event) => {
            const spoken = event.results[0][0].transcript.trim();
            console.log("HEARD:", spoken);
            if (!spoken) return;

            if (!edithStarted) {
                if (!spoken.toLowerCase().includes("edith")) return;
                edithStarted = true;
                conversationActive = true;

                const question = spoken.replace(/edith/gi, "").trim();
                if (!question) {
                    response.textContent = "Yes. How can I assist?";
                    speak("Yes. How can I assist?");
                    return;
                }
                await askGemini(question);
                return;
            }

            if (conversationActive) {
                await askGemini(spoken);
            }
        };

        recognition.onerror = (event) => {
            console.warn("VOICE ERROR:", event.error);
            listening = false;
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                voiceStatus.textContent = "UNSUPPORTED";
                voiceStatus.className = "yellow";
            }
        };

        recognition.onend = () => {
            listening = false;
            clearTimeout(restartTimer);
            // Cycle listener gently so it doesn't freeze the Quest browser
            restartTimer = setTimeout(() => {
                startListening();
            }, 600);
        };
    } catch (e) {
        voiceStatus.textContent = "UNAVAILABLE";
        voiceStatus.className = "yellow";
    }
} else {
    voiceStatus.textContent = "NOT SUPPORTED";
    voiceStatus.className = "yellow";
}

function startListening() {
    if (!recognition || listening) return;
    try {
        recognition.start();
    } catch (err) {
        // Recognition already alive or locked
    }
}

/* =====================================================
   CAMERA IMAGE CAPTURE
===================================================== */
function captureCamera() {
    if (!camera || camera.readyState < 2 || !camera.videoWidth) {
        return null;
    }

    const canvas = document.createElement("canvas");
    const width = Math.min(1024, camera.videoWidth);
    const scale = width / camera.videoWidth;

    canvas.width = width;
    canvas.height = camera.videoHeight * scale;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);

    return canvas.toDataURL("image/jpeg", 0.7).split(",")[1];
}

/* =====================================================
   GEMINI API
===================================================== */
async function askGemini(question) {
    if (!apiKey) {
        response.textContent = "Add your Gemini API key in Settings.";
        settings.style.display = "block";
        return;
    }

    aiStatus.textContent = "ANALYSING";
    aiStatus.className = "yellow";
    response.textContent = "Analyzing query...";

    const image = captureCamera();
    const parts = [
        {
            text: `You are E.D.I.T.H., a futuristic tactical assistant. Keep responses direct, factual, and concise.

User Query: ${question}`
        }
    ];

    if (image) {
        parts.push({
            inline_data: {
                mime_type: "image/jpeg",
                data: image
            }
        });
    }

    const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(apiKey);
    let result = null;
    let errorText = "";

    for (let attempt = 1; attempt <= 3; attempt++) {
        try {
            result = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts }] })
            });
        } catch (error) {
            errorText = error.message;
            break;
        }

        if (result.ok) break;

        errorText = await result.text();
        if (result.status === 503 || result.status === 429) {
            await new Promise(res => setTimeout(res, attempt * 2000));
            continue;
        }
        break;
    }

    if (!result || !result.ok) {
        aiStatus.textContent = "ERROR";
        aiStatus.className = "red";
        response.textContent = "Gemini API Connection failed. Check API key.";
        return;
    }

    try {
        const data = await result.json();
        const answer = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!answer) throw new Error("Empty payload");

        aiStatus.textContent = "ONLINE";
        aiStatus.className = "green";
        response.textContent = answer;
        speak(answer);
    } catch (err) {
        aiStatus.textContent = "ERROR";
        aiStatus.className = "red";
        response.textContent = "Parsing error processing AI output.";
    }
}

/* =====================================================
   VOICE SYNTHESIS
===================================================== */
function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-GB";
    speech.rate = 1.0;
    speech.pitch = 0.95;

    speech.onstart = () => { voiceStatus.textContent = "TRANSMITTING"; };
    speech.onend = () => { voiceStatus.textContent = "LISTENING"; };

    window.speechSynthesis.speak(speech);
}

/* =====================================================
   INITIALIZE APP
===================================================== */
startButton.onclick = async () => {
    startButton.disabled = true;
    startButton.textContent = "INITIALIZING...";

    await startMedia();
    start.style.display = "none";
    startListening();
};

/* =====================================================
   WEBXR PASSTHROUGH (QUEST 3S SAFE)
===================================================== */
let xrSession = null;
let xrRefSpace = null;
let xrGL = null;
let isSessionBusy = false;

async function checkXR() {
    if (!navigator.xr) {
        xrStatus.textContent = "NOT AVAILABLE";
        xrStatus.className = "red";
        return;
    }

    try {
        const arSupported = await navigator.xr.isSessionSupported("immersive-ar");
        const vrSupported = await navigator.xr.isSessionSupported("immersive-vr");

        if (arSupported || vrSupported) {
            xrStatus.textContent = arSupported ? "PASSTHROUGH AR" : "VR AVAILABLE";
            xrStatus.className = "green";
            vrButton.style.display = "block";
            vrButton.textContent = arSupported ? "ENTER AR PASSTHROUGH" : "ENTER VR";
        } else {
            xrStatus.textContent = "UNAVAILABLE";
            xrStatus.className = "red";
        }
    } catch (e) {
        console.warn("XR Detection Exception:", e);
    }
}

vrButton.onclick = async () => {
    if (isSessionBusy) return;

    // If already in an active session, cleanly close it
    if (xrSession) {
        try {
            isSessionBusy = true;
            await xrSession.end();
        } catch (e) {
            console.warn("Forced cleanup on session termination:", e);
        } finally {
            xrSession = null;
            isSessionBusy = false;
        }
        return;
    }

    if (!navigator.xr) return;

    try {
        isSessionBusy = true;

        const arSupported = await navigator.xr.isSessionSupported("immersive-ar");
        const sessionMode = arSupported ? "immersive-ar" : "immersive-vr";

        const sessionInit = {
            requiredFeatures: ["local-floor"],
            optionalFeatures: ["dom-overlay", "unbounded"],
            domOverlay: { root: document.getElementById("hud") }
        };

        const session = await navigator.xr.requestSession(sessionMode, sessionInit);
        xrSession = session;

        document.body.style.background = "transparent";
        camera.style.display = "none";

        session.addEventListener("end", () => {
            xrSession = null;
            isSessionBusy = false;
            document.body.style.background = "#020609";
            if (mediaStream && cameraStatus.textContent === "ONLINE") {
                camera.style.display = "block";
            }
            xrStatus.textContent = arSupported ? "PASSTHROUGH AR" : "VR AVAILABLE";
            xrStatus.className = "green";
            vrButton.textContent = arSupported ? "ENTER AR PASSTHROUGH" : "ENTER VR";
        });

        vrButton.textContent = "EXIT E.D.I.T.H.";
        xrStatus.textContent = "PASSTHROUGH ACTIVE";
        xrStatus.className = "green";

        await setupXR(session);
    } catch (error) {
        console.error("XR Launch Failure:", error);
        response.textContent = "XR Error: " + error.message;
        xrStatus.textContent = "ERROR";
        xrStatus.className = "red";
    } finally {
        isSessionBusy = false;
    }
};

async function setupXR(session) {
    const canvas = document.createElement("canvas");
    xrGL = canvas.getContext("webgl", {
        xrCompatible: true,
        alpha: true,
        premultipliedAlpha: false
    });

    if (!xrGL) throw new Error("WebGL context init failed");

    await xrGL.makeXRCompatible();

    const layer = new XRWebGLLayer(session, xrGL, { alpha: true });
    session.updateRenderState({ baseLayer: layer });

    try {
        xrRefSpace = await session.requestReferenceSpace("local-floor");
    } catch (e) {
        xrRefSpace = await session.requestReferenceSpace("local");
    }

    session.requestAnimationFrame(renderXR);
}

function renderXR(time, frame) {
    const session = frame.session;
    const pose = frame.getViewerPose(xrRefSpace);

    if (pose) {
        const layer = session.renderState.baseLayer;
        xrGL.bindFramebuffer(xrGL.FRAMEBUFFER, layer.framebuffer);

        // Alpha clear to 0 renders pass-through real-world view behind HUD
        xrGL.clearColor(0.0, 0.0, 0.0, 0.0);
        xrGL.clear(xrGL.COLOR_BUFFER_BIT | xrGL.DEPTH_BUFFER_BIT);
    }

    session.requestAnimationFrame(renderXR);
}

checkXR();
</script>
</body>
</html>
