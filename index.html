<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>E.D.I.T.H. Tactical HUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: transparent !important;
            color: #00d9ff; font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        /* Video element stays completely hidden; used only for Gemini visual analysis */
        #camera { display: none; }

        /* Fullscreen WebXR DOM Overlay Container */
        #xrOverlayRoot {
            position: fixed; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            background: transparent;
        }

        .logo {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            font-size: 34px; font-weight: 800; letter-spacing: 8px; color: #00d9ff;
            text-shadow: 0 0 15px #00d9ff;
        }

        .online {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            font-size: 11px; letter-spacing: 3px; color: #00ff88; font-weight: bold;
        }

        /* Central Reticle */
        .target {
            position: absolute; left: 50%; top: 50%; width: 150px; height: 150px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 217, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 20px #00d9ff, inset 0 0 15px rgba(0, 217, 255, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }

        .target::before {
            content: ""; position: absolute; width: 220px; height: 1px;
            left: -35px; top: 73px; background: #00d9ff; box-shadow: 0 0 8px #00d9ff;
        }

        .target::after {
            content: ""; position: absolute; width: 1px; height: 220px;
            top: -35px; left: 73px; background: #00d9ff; box-shadow: 0 0 8px #00d9ff;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.75; }
            50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
        }

        .vision {
            position: absolute; left: 50%; top: 50%; width: 320px; height: 320px;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        .corner {
            position: absolute; width: 40px; height: 40px;
            border-color: #00d9ff; border-style: solid;
            filter: drop-shadow(0 0 8px #00d9ff);
        }
        .corner.tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
        .corner.tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
        .corner.bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
        .corner.br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

        .status {
            position: absolute; left: 30px; bottom: 30px; width: 260px;
            padding: 16px; background: rgba(2, 10, 18, 0.85);
            border-left: 3px solid #00d9ff; backdrop-filter: blur(8px);
            font-size: 11px;
        }

        .status h2 { font-size: 12px; margin-bottom: 10px; letter-spacing: 2px; }
        .status p { margin: 6px 0; color: #888; display: flex; justify-content: space-between; }

        .green { color: #00ff88 !important; }
        .yellow { color: #ffbb00 !important; }
        .red { color: #ff4050 !important; }

        #response {
            position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
            width: 75%; max-width: 800px; text-align: center; color: #fff;
            font-size: 20px; line-height: 1.5;
            text-shadow: 0 0 10px #000, 0 0 14px #00d9ff;
        }

        #manualInputBox {
            position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
            width: min(650px, 85%); display: flex; gap: 10px; pointer-events: auto;
        }

        #manualInput {
            flex: 1; padding: 12px 16px; background: rgba(2, 10, 18, 0.9);
            color: #fff; border: 1px solid #00d9ff; outline: none; font-size: 14px;
        }

        button {
            padding: 12px 20px; color: #00d9ff; background: rgba(2, 10, 18, 0.9);
            border: 1px solid #00d9ff; cursor: pointer; font-weight: bold; font-size: 13px;
            pointer-events: auto;
        }

        button:hover { background: #00d9ff; color: #020609; }

        #startScreen {
            position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: radial-gradient(circle, #051a29, #010408 85%);
            text-align: center;
        }

        #vrButton { position: fixed; top: 25px; right: 25px; z-index: 10001; }
        #settingsButton { position: fixed; bottom: 25px; right: 25px; z-index: 10001; }

        #settings {
            position: fixed; right: 25px; top: 80px; z-index: 10002; width: 320px; padding: 20px;
            background: rgba(2, 10, 18, 0.98); border: 1px solid #00d9ff; display: none;
            pointer-events: auto;
        }

        #apiKey { width: 100%; padding: 10px; margin: 12px 0; background: #000; color: #fff; border: 1px solid #00d9ff; }
        #webglCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>

<video id="camera" autoplay muted playsinline></video>
<canvas id="webglCanvas"></canvas>

<div id="startScreen">
    <h1 style="font-size: 50px; letter-spacing: 10px; text-shadow: 0 0 20px #00d9ff;">E.D.I.T.H.</h1>
    <p style="color: #888; margin: 15px 0 25px; letter-spacing: 2px;">TACTICAL AUGMENTED INTERFACE</p>
    <button id="startButton">INITIALIZE SYSTEM</button>
</div>

<div id="xrOverlayRoot">
    <div class="logo">E.D.I.T.H.</div>
    <div class="online">● SYSTEM ONLINE</div>
    
    <div class="target"></div>
    <div class="vision">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
    </div>

    <div class="status">
        <h2>TELEMETRY</h2>
        <p>MIC LINK: <span id="micStatus" class="yellow">STANDBY</span></p>
        <p>SPEECH ENGINE: <span id="voiceStatus" class="yellow">STANDBY</span></p>
        <p>NEURAL CORE: <span id="aiStatus" class="yellow">STANDBY</span></p>
        <p>PASSTHROUGH: <span id="xrStatus" class="yellow">CHECKING</span></p>
    </div>

    <div id="response">Say "E.D.I.T.H." followed by your question...</div>

    <div id="manualInputBox">
        <input id="manualInput" type="text" placeholder="Issue directive..." autocomplete="off">
        <button id="sendButton">EXECUTE</button>
    </div>
</div>

<button id="vrButton" style="display: none;">ENTER AR PASSTHROUGH</button>
<button id="settingsButton">⚙ SETTINGS</button>

<div id="settings">
    <p style="font-size: 12px;">GEMINI API KEY</p>
    <input id="apiKey" type="password" placeholder="Paste Gemini API key">
    <div style="display: flex; gap: 8px;">
        <button id="saveKey" style="flex: 1;">SAVE</button>
        <button id="closeSettings" style="flex: 1;">CLOSE</button>
    </div>
</div>

<script>
const camera = document.getElementById("camera");
const micStatus = document.getElementById("micStatus");
const voiceStatus = document.getElementById("voiceStatus");
const aiStatus = document.getElementById("aiStatus");
const xrStatus = document.getElementById("xrStatus");
const responseEl = document.getElementById("response");
const vrButton = document.getElementById("vrButton");
const settings = document.getElementById("settings");
const apiKeyInput = document.getElementById("apiKey");
const manualInput = document.getElementById("manualInput");
const xrOverlayRoot = document.getElementById("xrOverlayRoot");
const webglCanvas = document.getElementById("webglCanvas");

let apiKey = localStorage.getItem("edith_gemini_key") || "";
apiKeyInput.value = apiKey;
if (apiKey) {
    aiStatus.textContent = "ONLINE";
    aiStatus.className = "green";
}

document.getElementById("settingsButton").onclick = () => settings.style.display = "block";
document.getElementById("closeSettings").onclick = () => settings.style.display = "none";
document.getElementById("saveKey").onclick = () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("edith_gemini_key", apiKey);
    aiStatus.textContent = apiKey ? "ONLINE" : "STANDBY";
    aiStatus.className = apiKey ? "green" : "yellow";
    settings.style.display = "none";
};

/* --- AUDIO & MICROPHONE RETRIEVAL --- */
let audioContext = null;
let mediaStream = null;

async function initSensors() {
    try {
        // Request persistent mic access to keep audio subsystem warm on Quest
        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            video: { facingMode: "environment", width: { ideal: 640 } }
        });

        camera.srcObject = mediaStream;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(mediaStream);
        
        // Connect to a silent destination to prevent Quest auto-sleeping the stream
        const gainNode = audioContext.createGain();
        gainNode.gain.value = 0;
        source.connect(gainNode);
        gainNode.connect(audioContext.destination);

        micStatus.textContent = "CONNECTED";
        micStatus.className = "green";
    } catch (e) {
        micStatus.textContent = "DENIED";
        micStatus.className = "red";
    }
}

function captureFrame() {
    if (!camera || camera.readyState < 2 || !camera.videoWidth) return null;
    const canvas = document.createElement("canvas");
    canvas.width = 480;
    canvas.height = (camera.videoHeight / camera.videoWidth) * 480;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.6).split(",")[1];
}

/* --- CONTINUOUS VOICE RECOGNITION --- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

function setupSpeech() {
    if (!SpeechRecognition) {
        voiceStatus.textContent = "UNSUPPORTED";
        voiceStatus.className = "red";
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = "en-GB";

    recognition.onstart = () => {
        isListening = true;
        voiceStatus.textContent = "LISTENING";
        voiceStatus.className = "green";
    };

    recognition.onerror = (e) => {
        if (e.error !== "no-speech") {
            voiceStatus.textContent = "RECOVERING";
            voiceStatus.className = "yellow";
        }
    };

    recognition.onend = () => {
        isListening = false;
        // Immediate restart to bypass Quest sleep cycles
        setTimeout(startListening, 250);
    };

    recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim();
        if (/edith/i.test(text)) {
            const cleanQuery = text.replace(/edith/gi, "").trim();
            if (cleanQuery) {
                askGemini(cleanQuery);
            } else {
                speak("Standing by.");
            }
        }
    };

    startListening();
}

function startListening() {
    if (recognition && !isListening) {
        try {
            recognition.start();
        } catch (e) {}
    }
}

function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-GB";
    utt.pitch = 0.95;
    utt.rate = 1.05;
    window.speechSynthesis.speak(utt);
}

/* --- GEMINI 2.5 INTEGRATION --- */
async function askGemini(promptText) {
    if (!apiKey) {
        responseEl.textContent = "Key needed. Open settings to paste.";
        speak("API key required.");
        return;
    }

    aiStatus.textContent = "ANALYSING";
    aiStatus.className = "yellow";
    responseEl.textContent = "Analyzing telemetry...";

    const imgBase64 = captureFrame();
    const parts = [{
        text: `You are E.D.I.T.H., Tony Stark's augmented intelligence. Respond in 1-2 brief, tactical sentences.\nUser: ${promptText}`
    }];

    if (imgBase64) {
        parts.push({
            inline_data: { mime_type: "image/jpeg", data: imgBase64 }
        });
    }

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts }] })
        });

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No intelligence returned.";
        responseEl.textContent = reply;
        aiStatus.textContent = "ONLINE";
        aiStatus.className = "green";
        speak(reply);
    } catch (err) {
        aiStatus.textContent = "ERROR";
        aiStatus.className = "red";
        responseEl.textContent = "Telemetry link failure.";
    }
}

document.getElementById("sendButton").onclick = () => {
    if (manualInput.value.trim()) {
        askGemini(manualInput.value.trim());
        manualInput.value = "";
    }
};

/* --- WEBXR IMMERSIVE PASSTHROUGH (DOM-OVERLAY) --- */
let xrSession = null;
let gl = null;

async function checkXR() {
    if (navigator.xr && await navigator.xr.isSessionSupported("immersive-ar")) {
        xrStatus.textContent = "AVAILABLE";
        xrStatus.className = "green";
        vrButton.style.display = "block";
    } else {
        xrStatus.textContent = "UNAVAILABLE";
        xrStatus.className = "red";
    }
}

vrButton.onclick = async () => {
    if (xrSession) {
        await xrSession.end();
        return;
    }

    try {
        // Request WebXR with dom-overlay directly binding your HUD
        xrSession = await navigator.xr.requestSession("immersive-ar", {
            optionalFeatures: ["local-floor"],
            domOverlay: { root: xrOverlayRoot }
        });

        gl = webglCanvas.getContext("webgl", { xrCompatible: true, alpha: true });
        const glLayer = new XRWebGLLayer(xrSession, gl, { alpha: true });
        xrSession.updateRenderState({ baseLayer: glLayer });

        const refSpace = await xrSession.requestReferenceSpace("local");
        vrButton.textContent = "EXIT AR";
        xrStatus.textContent = "ACTIVE";
        xrStatus.className = "green";

        // Keep audio awake during session initialization
        if (audioContext && audioContext.state === "suspended") {
            await audioContext.resume();
        }
        startListening();

        xrSession.requestAnimationFrame(function onFrame(time, frame) {
            if (!xrSession) return;
            xrSession.requestAnimationFrame(onFrame);

            // Mandatory clear with zero alpha allows passthrough to stay visible
            gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
            gl.clearColor(0.0, 0.0, 0.0, 0.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        });

        xrSession.onend = () => {
            xrSession = null;
            vrButton.textContent = "ENTER AR PASSTHROUGH";
            xrStatus.textContent = "AVAILABLE";
            startListening();
        };

    } catch (e) {
        responseEl.textContent = "AR Error: " + e.message;
        xrStatus.textContent = "ERROR";
        xrStatus.className = "red";
    }
};

/* --- INITIALIZATION --- */
document.getElementById("startButton").onclick = async () => {
    document.getElementById("startScreen").style.display = "none";
    await initSensors();
    setupSpeech();
    checkXR();
    speak("E.D.I.T.H. initialized.");
};
</script>
</body>
</html>
