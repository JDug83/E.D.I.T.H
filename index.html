<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Headset System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #020609; color: #00d9ff; font-family: 'Segoe UI', monospace, sans-serif;
            overflow: hidden; width: 100vw; height: 100vh;
        }
        #setupScreen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #051a29 0%, #010408 80%);
            text-align: center; padding: 20px;
        }
        h1 { font-size: 42px; letter-spacing: 12px; margin-bottom: 8px; text-shadow: 0 0 15px #00d9ff; }
        p { color: #789; font-size: 13px; letter-spacing: 2px; margin-bottom: 24px; }
        input {
            width: min(400px, 90%); padding: 12px; margin-bottom: 16px;
            background: rgba(0,0,0,0.7); border: 1px solid #00d9ff; color: #fff;
            text-align: center; outline: none; font-size: 14px;
        }
        button {
            padding: 12px 28px; background: rgba(0, 217, 255, 0.15);
            border: 1px solid #00d9ff; color: #00d9ff; font-weight: bold;
            font-size: 14px; letter-spacing: 2px; cursor: pointer; transition: 0.2s all;
        }
        button:hover { background: #00d9ff; color: #000; }
        #canvasXR { position: fixed; inset: 0; width: 100%; height: 100%; }
        #desktopNotice {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 11px; color: #567; letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="setupScreen">
    <h1>E.D.I.T.H.</h1>
    <p>TACTICAL HEAD-MOUNTED SYSTEM</p>
    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key">
    <button id="btnInit">START E.D.I.T.H. PASSTHROUGH</button>
</div>

<div id="desktopNotice">PRESS CONTROLLER TRIGGER OR SCREEN TO ACTIVATE VOICE QUERY</div>
<canvas id="canvasXR"></canvas>

<script>
let apiKey = localStorage.getItem("edith_key") || "";
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = apiKey;

let statusMsg = "STANDBY";
let responseText = "E.D.I.T.H. ONLINE. TAP TRIGGER TO SPEAK.";
let isRecording = false;
let audioContext = null;
let micStream = null;
let audioProcessor = null;
let audioChunks = [];

/* =================================================================
   2D HUD ENGINE (Pre-rendered to Canvas Texture for 3D Projection)
================================================================= */
const hudCanvas = document.createElement("canvas");
hudCanvas.width = 1024;
hudCanvas.height = 1024;
const ctx = hudCanvas.getContext("2d");

function drawHUD(time) {
    ctx.clearRect(0, 0, 1024, 1024);
    const cx = 512, cy = 512;
    const pulse = Math.sin(time * 0.003) * 6;

    // Outer Target Reticle
    ctx.strokeStyle = isRecording ? "rgba(255, 60, 80, 0.9)" : "rgba(0, 217, 255, 0.85)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 140 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Circle
    ctx.strokeStyle = "rgba(0, 217, 255, 0.4)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 90, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshairs
    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 180, cy); ctx.lineTo(cx + 180, cy);
    ctx.moveTo(cx, cy - 180); ctx.lineTo(cx, cy + 180);
    ctx.stroke();

    // Corner Brackets
    const b = 240, len = 40;
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#00d9ff";
    // TL
    ctx.beginPath(); ctx.moveTo(cx - b, cy - b + len); ctx.lineTo(cx - b, cy - b); ctx.lineTo(cx - b + len, cy - b); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(cx + b - len, cy - b); ctx.lineTo(cx + b, cy - b); ctx.lineTo(cx + b, cy - b + len); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(cx - b, cy + b - len); ctx.lineTo(cx - b, cy + b); ctx.lineTo(cx - b + len, cy + b); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(cx + b - len, cy + b); ctx.lineTo(cx + b, cy + b); ctx.lineTo(cx + b, cy + b - len); ctx.stroke();

    // Rotating Radar Element
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.001);
    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 160, 0, 0.7);
    ctx.stroke();
    ctx.restore();

    // Top Status Header
    ctx.fillStyle = "#00d9ff";
    ctx.font = "bold 32px monospace";
    ctx.textAlign = "center";
    ctx.fillText("E.D.I.T.H. SYSTEM", cx, cy - 280);

    ctx.fillStyle = isRecording ? "#ff4050" : (statusMsg === "THINKING" ? "#ffbb00" : "#00ff88");
    ctx.font = "20px monospace";
    ctx.fillText(`STATUS: ${statusMsg}`, cx, cy - 245);

    // AI Response Text Box
    ctx.fillStyle = "#ffffff";
    ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    wrapText(ctx, responseText, cx, cy + 220, 800, 32);
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    context.fillText(line, x, y);
}

/* =================================================================
   WEB AUDIO RECORDER (Native Quest Microphone Solution)
================================================================= */
async function initMic() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 }
    });
    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = audioContext.createMediaStreamSource(micStream);
    audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

    source.connect(audioProcessor);
    audioProcessor.connect(audioContext.destination);

    audioProcessor.onaudioprocess = (e) => {
        if (!isRecording) return;
        const inputData = e.inputBuffer.getChannelData(0);
        audioChunks.push(new Float32Array(inputData));
    };
}

function toggleVoiceRecord() {
    if (!isRecording) {
        audioChunks = [];
        isRecording = true;
        statusMsg = "LISTENING...";
        responseText = "Listening to vocal directive...";
    } else {
        isRecording = false;
        statusMsg = "THINKING";
        sendAudioToGemini();
    }
}

function encodeWAV(samples) {
    let totalLength = samples.reduce((acc, cur) => acc + cur.length, 0);
    let buffer = new ArrayBuffer(44 + totalLength * 2);
    let view = new DataView(buffer);

    const writeString = (view, offset, string) => {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    };

    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + totalLength * 2, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, 16000, true);
    view.setUint32(28, 32000, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(view, 36, 'data');
    view.setUint32(40, totalLength * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
        for (let j = 0; j < samples[i].length; j++) {
            let s = Math.max(-1, Math.min(1, samples[i][j]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            offset += 2;
        }
    }
    return new Uint8Array(buffer);
}

async function sendAudioToGemini() {
    if (!audioChunks.length) {
        statusMsg = "IDLE";
        return;
    }
    const wavBytes = encodeWAV(audioChunks);
    let binary = '';
    for (let i = 0; i < wavBytes.byteLength; i++) binary += String.fromCharCode(wavBytes[i]);
    const base64Audio = btoa(binary);

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: "You are E.D.I.T.H., Tony Stark's tactical AI. Answer concisely in under 2 sentences." },
                        { inline_data: { mime_type: "audio/wav", data: base64Audio } }
                    ]
                }]
            })
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Directive received, no output.";
        responseText = reply;
        statusMsg = "ONLINE";
        speak(reply);
    } catch (err) {
        responseText = "Comm link failure. Check API key.";
        statusMsg = "ERROR";
    }
}

function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "en-GB";
    utt.rate = 1.05;
    window.speechSynthesis.speak(utt);
}

/* =================================================================
   WEBGL STEREO PROJECTION ENGINE (True Quest AR View-Locked Plane)
================================================================= */
const canvas = document.getElementById("canvasXR");
const gl = canvas.getContext("webgl", { xrCompatible: true, alpha: true });

const vsSrc = `
    attribute vec3 aPos;
    attribute vec2 aTex;
    uniform mat4 uMatrix;
    varying vec2 vTex;
    void main() {
        gl_Position = uMatrix * vec4(aPos, 1.0);
        vTex = aTex;
    }
`;

const fsSrc = `
    precision mediump float;
    varying vec2 vTex;
    uniform sampler2D uSampler;
    void main() {
        vec4 col = texture2D(uSampler, vTex);
        gl_FragColor = col;
    }
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);

// 3D Quad positioned directly forward in meters
const vertices = new Float32Array([
    -0.8, -0.8, -1.2,   0.0, 1.0,
     0.8, -0.8, -1.2,   1.0, 1.0,
    -0.8,  0.8, -1.2,   0.0, 0.0,
    -0.8,  0.8, -1.2,   0.0, 0.0,
     0.8, -0.8, -1.2,   1.0, 1.0,
     0.8,  0.8, -1.2,   1.0, 0.0
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, "aPos");
const texLoc = gl.getAttribLocation(prog, "aTex");
const matLoc = gl.getUniformLocation(prog, "uMatrix");

const hudTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, hudTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* =================================================================
   WEBXR SESSION PIPELINE
================================================================= */
document.getElementById("btnInit").onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    localStorage.setItem("edith_key", apiKey);
    if (!apiKey) {
        alert("Enter your Gemini API key.");
        return;
    }

    document.getElementById("setupScreen").style.display = "none";
    await initMic();

    if (!navigator.xr) {
        alert("WebXR is unavailable on this device.");
        return;
    }

    const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor"]
    });

    const xrLayer = new XRWebGLLayer(session, gl, { alpha: true });
    session.updateRenderState({ baseLayer: xrLayer });
    const refSpace = await session.requestReferenceSpace("viewer");

    // Quest Controller Trigger or Screen Tap activates the microphone
    session.addEventListener("select", () => toggleVoiceRecord());
    window.addEventListener("pointerdown", () => toggleVoiceRecord());

    session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
        // Alpha must be 0 for Passthrough to shine through
        gl.clearColor(0.0, 0.0, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (!pose) return;

        drawHUD(time);

        // Upload HUD 2D Canvas into the WebGL texture
        gl.bindTexture(gl.TEXTURE_2D, hudTex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hudCanvas);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(prog);

        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 20, 12);

        // Render for Left Eye and Right Eye stereoscopically
        for (const view of pose.views) {
            const viewport = xrLayer.getViewport(view);
            gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
            gl.uniformMatrix4fv(matLoc, false, view.projectionMatrix);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    });
};
</script>
</body>
</html>
