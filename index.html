<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>E.D.I.T.H.</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #020609;

    color: #00d9ff;

    font-family: Arial, sans-serif;

}


/* =====================================================
   NORMAL CAMERA
===================================================== */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    z-index: 0;

}


/* =====================================================
   HUD
===================================================== */

#hud {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 5;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    position: absolute;

    top: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 34px;

    font-weight: bold;

    letter-spacing: 9px;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff,
        0 0 40px #008cff;

}


.online {

    position: absolute;

    top: 73px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 11px;

    letter-spacing: 4px;

    color: #00ff88;

}


/* =====================================================
   TARGET / SPIDER-MAN STYLE VISION
===================================================== */

.target {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 160px;
    height: 160px;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(0,217,255,.75);

    border-radius: 50%;

    box-shadow:
        0 0 20px #00d9ff,
        inset 0 0 20px
        rgba(0,217,255,.15);

}


.target:before {

    content: "";

    position: absolute;

    width: 220px;
    height: 1px;

    left: -32px;
    top: 78px;

    background: #00d9ff;

}


.target:after {

    content: "";

    position: absolute;

    width: 1px;
    height: 220px;

    top: -32px;
    left: 78px;

    background: #00d9ff;

}


.targetDot {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 7px;
    height: 7px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #00ffff;

    box-shadow:
        0 0 10px #00ffff,
        0 0 25px #008cff;

}


.scanRing {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 245px;
    height: 245px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(0,217,255,.25);

    border-radius: 50%;

    animation:
        scanSpin 5s linear infinite;

}


@keyframes scanSpin {

    from {

        transform:
            translate(-50%, -50%)
            rotate(0deg);

    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(360deg);

    }

}


/* =====================================================
   EXTRA VISION LINES
===================================================== */

.visionLine {

    position: absolute;

    background:
        rgba(0,217,255,.45);

    box-shadow:
        0 0 8px
        rgba(0,217,255,.5);

}


.visionTop {

    top: 18%;

    left: 12%;

    width: 76%;

    height: 1px;

}


.visionBottom {

    bottom: 18%;

    left: 12%;

    width: 76%;

    height: 1px;

}


.visionLeft {

    left: 12%;

    top: 18%;

    width: 1px;

    height: 64%;

}


.visionRight {

    right: 12%;

    top: 18%;

    width: 1px;

    height: 64%;

}


/* =====================================================
   STATUS
===================================================== */

.status {

    position: absolute;

    left: 25px;

    bottom: 25px;

    width: 270px;

    padding: 18px;

    background:
        rgba(0,10,18,.72);

    border-left:
        2px solid #00d9ff;

    backdrop-filter:
        blur(10px);

}


.status h2 {

    margin:
        0 0 13px;

    font-size: 13px;

    letter-spacing: 3px;

}


.status p {

    margin: 8px 0;

    color: #aaa;

    font-size: 12px;

}


.green {
    color: #00ff88;
}

.yellow {
    color: #ffff00;
}

.red {
    color: #ff4050;
}


/* =====================================================
   RESPONSE
===================================================== */

#response {

    position: absolute;

    left: 50%;

    bottom: 35px;

    transform:
        translateX(-50%);

    width: 60%;

    max-width: 700px;

    text-align: center;

    color: white;

    font-size: 18px;

    line-height: 1.5;

    text-shadow:
        0 0 10px #00d9ff;

}


/* =====================================================
   START SCREEN
===================================================== */

#start {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #041824,
            #020609 70%
        );

}


#start h1 {

    margin: 0;

    font-size: 52px;

    letter-spacing: 11px;

    text-shadow:
        0 0 15px #00d9ff,
        0 0 40px #00d9ff;

}


#start p {

    color: #777;

    line-height: 1.7;

    letter-spacing: 2px;

}


/* =====================================================
   BUTTONS
===================================================== */

button {

    padding: 12px 18px;

    color: #00d9ff;

    background:
        rgba(0,10,18,.9);

    border:
        1px solid #00d9ff;

    cursor: pointer;

}


button:hover {

    background:
        #00d9ff;

    color:
        #001018;

}


/* =====================================================
   AR BUTTON
===================================================== */

#vrButton {

    position: fixed;

    top: 20px;

    right: 20px;

    z-index: 200;

    display: none;

    pointer-events: auto;

}


/* =====================================================
   SETTINGS
===================================================== */

#settingsButton {

    position: fixed;

    right: 20px;

    bottom: 20px;

    z-index: 200;

    pointer-events: auto;

}


#settings {

    position: fixed;

    right: 20px;

    top: 70px;

    z-index: 300;

    width: 330px;

    padding: 20px;

    display: none;

    background:
        rgba(2,10,15,.98);

    border:
        1px solid #00d9ff;

    pointer-events: auto;

}


#apiKey {

    width: 100%;

    padding: 10px;

    background: #000;

    color: white;

    border:
        1px solid #00d9ff;

}


#error {

    color:
        #ff4050;

    font-size:
        11px;

    margin-top:
        10px;

}


/* =====================================================
   AR CONTROLS
===================================================== */

#arPanel {

    position: absolute;

    right: 25px;

    bottom: 25px;

    width: 310px;

    padding: 15px;

    background:
        rgba(0,10,18,.75);

    border:
        1px solid
        rgba(0,217,255,.7);

    backdrop-filter:
        blur(10px);

    pointer-events:
        auto;

    display:
        none;

}


.arTitle {

    color:
        #00d9ff;

    font-size:
        11px;

    letter-spacing:
        2px;

    margin-bottom:
        10px;

}


#manualInput {

    width: 100%;

    padding: 12px;

    background:
        rgba(0,0,0,.85);

    color:
        white;

    border:
        1px solid #00d9ff;

    outline:
        none;

    font-size:
        14px;

}


#manualInput:focus {

    box-shadow:
        0 0 12px
        rgba(0,217,255,.5);

}


.arButtons {

    display:
        flex;

    gap:
        6px;

    margin-top:
        8px;

}


.arButtons button {

    flex:
        1;

    padding:
        9px 6px;

    font-size:
        11px;

}


/* =====================================================
   XR MODE
===================================================== */

/*
 * The Quest Browser supplies the
 * passthrough environment.
 *
 * We DO NOT create a black video
 * background in XR.
 */

body.xr-active #camera {

    display:
        none !important;

}


body.xr-active #start {

    display:
        none !important;

}


body.xr-active #vrButton {

    display:
        none !important;

}


body.xr-active #settingsButton {

    display:
        none !important;

}


body.xr-active #arPanel {

    display:
        block;

}


/*
 * Keep the entire E.D.I.T.H.
 * interface transparent.
 */

:root:has(body.xr-active) {

    background:
        transparent;

}


body.xr-active {

    background:
        transparent;

}


/*
 * The HUD is the WebXR DOM overlay.
 */

:root:has(body.xr-active) #hud {

    background:
        transparent;

}


/* =====================================================
   MOBILE / QUEST SIZING
===================================================== */

@media (max-width: 700px) {

    .logo {

        font-size:
            26px;

        letter-spacing:
            7px;

    }


    .status {

        left:
            15px;

        bottom:
            15px;

        width:
            220px;

        padding:
            13px;

    }


    #response {

        width:
            75%;

        font-size:
            15px;

    }


    #arPanel {

        right:
            15px;

        bottom:
            15px;

        width:
            280px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     NORMAL CAMERA
===================================================== -->

<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>


<!-- =====================================================
     START
===================================================== -->

<div id="start">

    <h1>
        E.D.I.T.H.
    </h1>

    <p>
        ENHANCED DEFENCE<br>
        INTELLIGENCE &amp; THREAT SYSTEM
    </p>

    <button id="startButton">
        INITIALIZE E.D.I.T.H.
    </button>

    <p style="font-size:11px;color:#555">

        Say "E.D.I.T.H." once to begin.

    </p>

</div>


<!-- =====================================================
     E.D.I.T.H. HUD
===================================================== -->

<div id="hud">

    <div class="logo">
        E.D.I.T.H.
    </div>


    <div class="online">
        ● SYSTEM ONLINE
    </div>


    <div class="visionLine visionTop"></div>

    <div class="visionLine visionBottom"></div>

    <div class="visionLine visionLeft"></div>

    <div class="visionLine visionRight"></div>


    <div class="target">

        <div class="targetDot"></div>

    </div>


    <div class="scanRing"></div>


    <!-- =================================================
         STATUS
    ================================================= -->

    <div class="status">

        <h2>
            SYSTEM STATUS
        </h2>

        <p>

            CAMERA:

            <span
                id="cameraStatus"
                class="yellow">

            </span>

        </p>


        <p>

            MICROPHONE:

            <span
                id="micStatus"
                class="yellow">

                STANDBY

            </span>

        </p>


        <p>

            VOICE:

            <span
                id="voiceStatus"
                class="yellow">

                STANDBY

            </span>

        </p>


        <p>

            AI:

            <span
                id="aiStatus"
                class="yellow">

                STANDBY

            </span>

        </p>


        <p>

            XR:

            <span
                id="xrStatus"
                class="yellow">

                CHECKING

            </span>

        </p>

    </div>


    <!-- =================================================
         RESPONSE
    ================================================= -->

    <div id="response">

        E.D.I.T.H. is ready.

    </div>


    <!-- =================================================
         AR MANUAL CONTROLS
    ================================================= -->

    <div id="arPanel">

        <div class="arTitle">

            E.D.I.T.H. AR INTERFACE

        <input
            id="manualInput"
            type="text"
            placeholder="Ask E.D.I.T.H..."
            autocomplete="off"

        <div class="arButtons">

                ASK

            </button>

        </div>

</div>


<!-- =====================================================
     AR BUTTON
===================================================== -->

<button id="vrButton">

    ENTER E.D.I.T.H. AR

</button>


<!-- =====================================================
     SETTINGS
===================================================== -->

<button id="settingsButton">

    ⚙ SETTINGS

</button>


<div id="settings">

    <h2>
        E.D.I.T.H. SETTINGS
    </h2>


    <p>
        Gemini API Key
    </p>


    <input
        id="apiKey"
        type="password"
        placeholder="Paste Gemini API key"
    >


    <br><br>


    <button id="saveKey">

        SAVE

    </button>


    <button id="closeSettings">

        CLOSE

    </button>


    <div id="error"></div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const camera =
    document.getElementById("camera");

const cameraStatus =
    document.getElementById("cameraStatus");

const micStatus =
    document.getElementById("micStatus");

const voiceStatus =
    document.getElementById("voiceStatus");

const aiStatus =
    document.getElementById("aiStatus");

const xrStatus =
    document.getElementById("xrStatus");

const response =
    document.getElementById("response");

const vrButton =
    document.getElementById("vrButton");

const settings =
    document.getElementById("settings");

const settingsButton =
    document.getElementById("settingsButton");

const closeSettings =
    document.getElementById("closeSettings");

const saveKey =
    document.getElementById("saveKey");

const apiKeyInput =
    document.getElementById("apiKey");

const errorBox =
    document.getElementById("error");

const manualInput =
    document.getElementById("manualInput");

const manualAsk =
    document.getElementById("manualAsk");

const arSettings =
    document.getElementById("arSettings");

const arExit =
    document.getElementById("arExit");


/* =====================================================
   GEMINI KEY
===================================================== */

let apiKey =
    localStorage.getItem(
        "edith_gemini_key"
    ) || "";


apiKeyInput.value =
    apiKey;


if (apiKey) {

    aiStatus.textContent =
        "READY";

    aiStatus.className =
        "green";

}


saveKey.onclick =
    () => {

        const key =
            apiKeyInput
                .value
                .trim();


        if (!key) {

            errorBox.textContent =
                "Enter a Gemini API key.";

            return;

        }


        apiKey =
            key;


        localStorage.setItem(
            "edith_gemini_key",
            key
        );


        aiStatus.textContent =
            "READY";

        aiStatus.className =
            "green";


        errorBox.textContent =
            "";


        settings.style.display =
            "none";

    };


settingsButton.onclick =
    () => {

        settings.style.display =
            "block";

    };


closeSettings.onclick =
    () => {

        settings.style.display =
            "none";

    };


arSettings.onclick =
    () => {

        settings.style.display =
            "block";

    };


/* =====================================================
   CAMERA + MICROPHONE
===================================================== */

let mediaStream =
    null;


async function startMedia() {

    try {

        mediaStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "environment"

                    },

                    audio: {

                        echoCancellation:
                            true,

                        noiseSuppression:
                            true,

                        autoGainControl:
                            true

                    }

                });


        camera.srcObject =
            mediaStream;


        camera.style.display =
            "block";


        cameraStatus.textContent =
            "ONLINE";

        cameraStatus.className =
            "green";


        micStatus.textContent =
            "CONNECTED";

        micStatus.className =
            "green";


        return true;


    } catch (error) {

        console.error(
            error
        );


        response.textContent =
            "Please allow the camera and microphone.";


        cameraStatus.textContent =
            "DENIED";

        cameraStatus.className =
            "red";


        micStatus.textContent =
            "DENIED";

        micStatus.className =
            "red";


        return false;

    }

}


/* =====================================================
   VOICE
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;


let listening =
    false;


let edithStarted =
    false;


let conversationActive =
    false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-GB";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            listening =
                true;


            voiceStatus.textContent =
                "LISTENING";


            voiceStatus.className =
                "green";

        };


    recognition.onresult =
        async (event) => {

            const result =
                event.results[
                    event.results.length - 1
                ];


            if (!result.isFinal)
                return;


            const spoken =
                result[0]
                    .transcript
                    .trim();


            console.log(
                "HEARD:",
                spoken
            );


            if (!spoken)
                return;


            if (!edithStarted) {

                if (
                    !spoken
                        .toLowerCase()
                        .includes("edith")
                ) {

                    return;

                }


                edithStarted =
                    true;


                conversationActive =
                    true;


                const question =
                    spoken
                        .replace(
                            /edith/gi,
                            ""
                        )
                        .trim();


                if (!question) {

                    response.textContent =
                        "Yes. How can I assist?";


                    speak(
                        "Yes. How can I assist?"
                    );


                    return;

                }


                await askGemini(
                    question
                );


                return;

            }


            if (conversationActive) {

                await askGemini(
                    spoken
                );

            }

        };


    recognition.onerror =
        (event) => {

            console.log(
                "VOICE:",
                event.error
            );


            listening =
                false;


            if (
                event.error ===
                    "not-allowed" ||

                event.error ===
                    "service-not-allowed"
            ) {

                voiceStatus.textContent =
                    "BLOCKED";


                voiceStatus.className =
                    "red";

            }

        };


    recognition.onend =
        () => {

            listening =
                false;


            if (mediaStream) {

                setTimeout(
                    startListening,
                    700
                );

            }

        };

}


function startListening() {

    if (!recognition)
        return;


    if (listening)
        return;


    try {

        recognition.start();

    } catch (error) {

        console.log(
            error.message
        );

    }

}


/* =====================================================
   CAMERA IMAGE
===================================================== */

function captureCamera() {

    if (
        !camera ||
        camera.readyState < 2 ||
        !camera.videoWidth
    ) {

        return null;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const width =
        Math.min(
            1024,
            camera.videoWidth
        );


    const scale =
        width /
        camera.videoWidth;


    canvas.width =
        width;


    canvas.height =
        camera.videoHeight *
        scale;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return canvas
        .toDataURL(
            "image/jpeg",
            .7
        )
        .split(",")[1];

}


/* =====================================================
   GEMINI
===================================================== */

async function askGemini(
    question
) {

    if (!apiKey) {

        response.textContent =
            "Add your Gemini API key in Settings.";


        settings.style.display =
            "block";


        return;

    }


    aiStatus.textContent =
        "ANALYSING";


    aiStatus.className =
        "yellow";


    const image =
        captureCamera();


    const parts = [

        {

            text:

`You are E.D.I.T.H., a futuristic personal AI assistant.

User:
${question}

If a camera image is provided, use it to answer questions about the user's surroundings.

Only describe things actually visible.

Do not make things up.

Keep answers concise and natural.`

        }

    ];


    if (image) {

        parts.push({

            inline_data: {

                mime_type:
                    "image/jpeg",

                data:
                    image

            }

        });

    }


    const url =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" +
        encodeURIComponent(
            apiKey
        );


    let result =
        null;


    let errorText =
        "";


    for (
        let attempt = 1;
        attempt <= 3;
        attempt++
    ) {

        try {

            result =
                await fetch(
                    url,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                contents: [

                                    {

                                        parts:
                                            parts

                                    }

                                ]

                            })

                    }
                );


        } catch (error) {

            errorText =
                error.message;


            break;

        }


        if (result.ok) {

            break;

        }


        errorText =
            await result.text();


        if (
            result.status === 503 ||
            result.status === 429
        ) {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        attempt * 2500
                    )
            );


            continue;

        }


        break;

    }


    if (
        !result ||
        !result.ok
    ) {

        console.error(
            errorText
        );


        aiStatus.textContent =
            "ERROR";


        aiStatus.className =
            "red";


        if (
            result &&
            result.status === 503
        ) {

            response.textContent =
                "Gemini is temporarily busy.";

        } else {

            response.textContent =
                "Gemini connection error.";

        }


        return;

    }


    try {

        const data =
            await result.json();


        const answer =
            data
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;


        if (!answer)
            throw new Error(
                "No AI response"
            );


        aiStatus.textContent =
            "ONLINE";


        aiStatus.className =
            "green";


        response.textContent =
            answer;


        speak(
            answer
        );


    } catch (error) {

        console.error(
            error
        );


        aiStatus.textContent =
            "ERROR";


        aiStatus.className =
            "red";


        response.textContent =
            "E.D.I.T.H. could not process the response.";

    }

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(
    text
) {

    if (
        !window.speechSynthesis
    )
        return;


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-GB";


    speech.rate =
        1;


    speech.pitch =
        .9;


    speech.onstart =
        () => {

            voiceStatus.textContent =
                "SPEAKING";


            voiceStatus.className =
                "green";

        };


    speech.onend =
        () => {

            voiceStatus.textContent =
                "LISTENING";


            voiceStatus.className =
                "green";

        };


    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   MANUAL AR INPUT
===================================================== */

manualAsk.onclick =
    async () => {

        const question =
            manualInput
                .value
                .trim();


        if (!question)
            return;


        manualInput.value =
            "";


        conversationActive =
            true;


        await askGemini(
            question
        );

    };


manualInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            manualAsk.click();

        }

    }
);


/* =====================================================
   START E.D.I.T.H.
===================================================== */

startButton.onclick =
    async () => {

        startButton.disabled =
            true;


        startButton.textContent =
            "INITIALIZING...";


        const ok =
            await startMedia();


        if (!ok) {

            startButton.disabled =
                false;


            startButton.textContent =
                "TRY AGAIN";


            return;

        }


        start.style.display =
            "none";


        startListening();

    };


/* =====================================================
   WEBXR
===================================================== */

let xrSession =
    null;


/*
 * IMPORTANT:
 *
 * We ONLY use immersive-ar.
 *
 * We do NOT fall back to immersive-vr.
 *
 * We also do NOT create an XRWebGLLayer.
 *
 * Quest Browser handles the passthrough
 * environment while the E.D.I.T.H. page
 * is supplied as a DOM overlay.
 */

async function checkXR() {

    if (!navigator.xr) {

        xrStatus.textContent =
            "NOT AVAILABLE";


        xrStatus.className =
            "red";


        return;

    }


    try {

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if (supported) {

            xrStatus.textContent =
                "AR READY";


            xrStatus.className =
                "green";


            vrButton.style.display =
                "block";

        } else {

            xrStatus.textContent =
                "AR NOT SUPPORTED";


            xrStatus.className =
                "red";


            vrButton.style.display =
                "none";

        }

    } catch (error) {

        console.error(
            error
        );


        xrStatus.textContent =
            "XR ERROR";


        xrStatus.className =
            "red";

    }

}


/* =====================================================
   ENTER E.D.I.T.H. AR
===================================================== */

vrButton.onclick =
    async () => {

        if (xrSession) {

            try {

                await xrSession.end();

            } catch (error) {

                console.log(
                    error
                );

            }

            return;

        }


        if (!navigator.xr) {

            response.textContent =
                "WebXR is not available in this browser.";

            return;

        }


        try {

            /*
             * Check AR immediately before
             * requesting the session.
             */

            const supported =
                await navigator.xr
                    .isSessionSupported(
                        "immersive-ar"
                    );


            if (!supported) {

                response.textContent =
                    "Immersive AR is not supported by this Quest Browser.";

                return;

            }


            /*
             * ONLY AR.
             *
             * DOM overlay is OPTIONAL so that
             * unsupported optional features
             * don't cause requestSession()
             * to fail.
             */

            xrSession =
                await navigator.xr
                    .requestSession(
                        "immersive-ar",
                        {

                            optionalFeatures: [
                                "dom-overlay"
                            ],

                            domOverlay: {
                                root:
                                    document.getElementById(
                                        "hud"
                                    )
                            }

                        }
                    );


            /*
             * Enter E.D.I.T.H. XR state.
             */

            document.body
                .classList
                .add(
                    "xr-active"
                );


            xrStatus.textContent =
                "PASSTHROUGH ACTIVE";


            xrStatus.className =
                "green";


            vrButton.textContent =
                "EXIT E.D.I.T.H.";


            /*
             * Tell the user what kind
             * of XR environment Quest supplied.
             */

            console.log(
                "XR environment blend mode:",
                xrSession.environmentBlendMode
            );


            console.log(
                "XR DOM overlay:",
                xrSession.domOverlayState
            );


            /*
             * If Quest supports DOM overlay,
             * confirm it visually.
             */

            if (
                !xrSession.domOverlayState
            ) {

                response.textContent =
                    "AR started, but Quest Browser did not enable the HTML overlay.";

            } else {

                response.textContent =
                    "E.D.I.T.H. AR online.";

            }


            xrSession.addEventListener(
                "end",
                () => {

                    xrSession =
                        null;


                    document.body
                        .classList
                        .remove(
                            "xr-active"
                        );


                    xrStatus.textContent =
                        "AR READY";


                    xrStatus.className =
                        "green";


                    vrButton.textContent =
                        "ENTER E.D.I.T.H. AR";

                }
            );


        } catch (error) {

            console.error(
                "XR ERROR:",
                error
            );


            xrSession =
                null;


            document.body
                .classList
                .remove(
                    "xr-active"
                );


            xrStatus.textContent =
                "ERROR";


            xrStatus.className =
                "red";


            response.textContent =
                "Could not enter E.D.I.T.H. AR: " +
                error.message;

        }

    };


/* =====================================================
   EXIT AR
===================================================== */

arExit.onclick =
    async () => {

        if (xrSession) {

            try {

                await xrSession.end();

            } catch (error) {

                console.log(
                    error
                );

            }

        }

    };


/* =====================================================
   INITIAL XR CHECK
===================================================== */

checkXR();

</script>
