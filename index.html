<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.D.I.T.H. AI</title>

<style>
/* =====================================================
   GLOBAL
===================================================== */
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #020609;
    color: #00d9ff;
    font-family: Arial, Helvetica, sans-serif;
}

/* Strips browser background in VR so headset passthrough cameras show */
:xr-overlay,
:xr-overlay html,
:xr-overlay body {
    background: transparent !important;
    background-color: rgba(0, 0, 0, 0) !important;
}

/* =====================================================
   FALLBACK 2D CAMERA
===================================================== */
#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 0;
}

/* =====================================================
   FULLSCREEN HUD LAYER
===================================================== */
#hud {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
    pointer-events: none;
    background: transparent !important;
}

/* =====================================================
   TOP-LEFT UI CLUSTER
===================================================== */
.top-left-cluster {
    position: absolute;
    top: 25px;
    left: 25px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    pointer-events: auto;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 7px;
    color: #00d9ff;
    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff,
        0 0 35px #008cff;
}

.online {
    color: #00ff88;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 6px;
}

.status {
    width: 250px;
    padding: 14px 16px;
    background: rgba(0, 12, 20, 0.75);
    border-left: 2px solid #00d9ff;
    border-top: 1px solid rgba(0, 217, 255, 0.2);
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(0, 217, 255, 0.08);
}

.status h2 {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: 2px;
}

.status p {
    margin: 6px 0;
    font-size: 11px;
    color: #aaa;
}

.green { color: #00ff88; }
.yellow { color: #ffff00; }
.red { color: #ff4050; }

/* =====================================================
   TARGET RETICLE
===================================================== */
.target {
    position: absolute;
    width: 160px;
    height: 160px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(0, 217, 255, 0.7);
    border-radius: 50%;
    box-shadow:
        0 0 15px #00d9ff,
        inset 0 0 15px rgba(0, 217, 255, 0.15);
}

.target::before {
    content: "";
    position: absolute;
    width: 200px;
    height: 1px;
    left: -20px;
    top: 79px;
    background: #00d9ff;
    box-shadow: 0 0 6px #00d9ff;
}

.target::after {
    content: "";
    position: absolute;
    width: 1px;
    height: 200px;
    top: -20px;
    left: 79px;
    background: #00d9ff;
    box-shadow: 0 0 6px #00d9ff;
}

/* =====================================================
   RESPONSE
===================================================== */
#response {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    width: 70%;
    max-width: 800px;
    text-align: center;
    color: white;
    font-size: 19px;
    line-height: 1.5;
    text-shadow: 0 0 10px #00d9ff;
    pointer-events: auto;
}

/* =====================================================
   BUTTONS & CONTROLS
===================================================== */
button {
    padding: 11px 17px;
    color: #00d9ff;
    background: rgba(0, 10, 18, 0.9);
    border: 1px solid #00d9ff;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 1px;
}

button:hover {
    background: #00d9ff;
    color: #001018;
    box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
}

#vrButton {
    position: fixed;
    top: 25px;
    right: 25px;
    z-index: 100;
    pointer-events: auto;
    font-weight: bold;
    letter-spacing: 2px;
    display: none;
}

#settingsButton {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 100;
    pointer-events: auto;
}

/* =====================================================
   SETTINGS PANEL
===================================================== */
#settings {
    position: fixed;
    right: 25px;
    top: 75px;
    z-index: 150;
    width: 320px;
    padding: 18px;
    background: rgba(2, 10, 15, 0.98);
    border: 1px solid #00d9ff;
    box-shadow: 0 0 25px rgba(0, 217, 255, 0.2);
    display: none;
    pointer-events: auto;
}

#settings h2 {
    margin-top: 0;
    font-size: 15px;
    letter-spacing: 2px;
}

#settings p {
    font-size: 12px;
    color: #aaa;
}

#apiKey {
    width: 100%;
    padding: 10px;
    background: #000;
    color: white;
    border: 1px solid #00d9ff;
    outline: none;
}

#error {
    margin-top: 10px;
    color: #ff4050;
    font-size: 11px;
}

/* =====================================================
   START SCREEN
===================================================== */
#start {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: radial-gradient(
        circle at center,
        #041824,
        #020609 65%
    );
}

#start h1 {
    margin: 0;
    font-size: 50px;
    letter-spacing: 10px;
    color: #00d9ff;
    text-shadow: 0 0 20px #00d9ff;
}

#start p {
    margin-top: 18px;
    color: #777;
    line-height: 1.7;
    letter-spacing: 2px;
    font-size: 13px;
}

#startButton {
    margin-top: 25px;
    padding: 14px 28px;
    font-size: 15px;
    letter-spacing: 3px;
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<div id="start">
    <h1>E.D.I.T.H.</h1>
    <p>
        ENHANCED DEFENCE<br>
        INTELLIGENCE &amp; THREAT SYSTEM
    </p>
    <button id="startButton">
        INITIALIZE E.D.I.T.H.
    </button>
</div>

<div id="hud">
    <div class="top-left-cluster">
        <div class="logo">E.D.I.T.H.</div>
        <div class="online">● SYSTEM ONLINE</div>

        <div class="status">
            <h2>SYSTEM STATUS</h2>
            <p>CAMERA: <span id="cameraStatus" class="yellow">STANDBY</span></p>
            <p>MICROPHONE: <span id="micStatus" class="yellow">STANDBY</span></p>
            <p>VOICE: <span id="voiceStatus" class="yellow">STANDBY</span></p>
            <p>AI: <span id="aiStatus" class="yellow">STANDBY</span></p>
            <p>PASSTHROUGH: <span id="vrStatus" class="yellow">CHECKING</span></p>
        </div>
    </div>

    <div class="target"></div>

    <div id="response">
        E.D.I.T.H. is ready. Say "E.D.I.T.H." once to begin.
    </div>
</div>

<button id="vrButton">ENTER VR</button>
<button id="settingsButton">⚙ SETTINGS</button>

<div id="settings">
    <h2>E.D.I.T.H. SETTINGS</h2>
    <p>Gemini API Key</p>
    <input id="apiKey" type="password" autocomplete="off" placeholder="Paste Gemini API key">
    <br><br>
    <button id="saveKey">SAVE</button>
    <button id="closeSettings">CLOSE</button>
    <div id="error"></div>
</div>

<script>
/* =====================================================
   ELEMENT REFERENCES
===================================================== */
const start = document.getElementById("start");
const startButton = document.getElementById("startButton");
const camera = document.getElementById("camera");
const cameraStatus = document.getElementById("cameraStatus");
const micStatus = document.getElementById("micStatus");
const voiceStatus = document.getElementById("voiceStatus");
const aiStatus = document.getElementById("aiStatus");
const vrStatus = document.getElementById("vrStatus");
const response = document.getElementById("response");
const settings = document.getElementById("settings");
const settingsButton = document.getElementById("settingsButton");
const closeSettings = document.getElementById("closeSettings");
const saveKey = document.getElementById("saveKey");
const apiKeyInput = document.getElementById("apiKey");
const errorBox = document.getElementById("error");
const vrButton = document.getElementById("vrButton");

/* =====================================================
   API KEY HANDLING
===================================================== */
let apiKey = localStorage.getItem("edith_gemini_key") || "";
apiKeyInput.value = apiKey;

if (apiKey) {
    aiStatus.textContent = "READY";
    aiStatus.className = "green";
}

saveKey.onclick = () => {
    const key = apiKeyInput.value.trim();
    if (!key) {
        errorBox.textContent = "Please enter your Gemini API key.";
        return;
    }
    apiKey = key;
    localStorage.setItem("edith_gemini_key", apiKey);
    errorBox.textContent = "";
    aiStatus.textContent = "READY";
    aiStatus.className = "green";
    settings.style.display = "none";
};

settingsButton.onclick = () => { settings.style.display = "block"; };
closeSettings.onclick = () => { settings.style.display = "none"; };

/* =====================================================
   CAMERA & MICROPHONE
===================================================== */
let mediaStream = null;

async function startMedia() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });

        camera.srcObject = mediaStream;
        camera.style.display = "block";

        cameraStatus.textContent = "ONLINE";
        cameraStatus.className = "green";
        micStatus.textContent = "CONNECTED";
        micStatus.className = "green";

        return true;
    } catch (error) {
        console.error("MEDIA ERROR:", error);
        cameraStatus.textContent = "DENIED";
        cameraStatus.className = "red";
        micStatus.textContent = "DENIED";
        micStatus.className = "red";
        response.textContent = "Camera or microphone permission was denied.";
        return false;
    }
}

/* =====================================================
   SPEECH RECOGNITION (VOICE WAKE)
===================================================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let edithStarted = false;
let conversationActive = false;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-GB";
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        listening = true;
        voiceStatus.textContent = "LISTENING";
        voiceStatus.className = "green";
    };

    recognition.onresult = async (event) => {
        const result = event.results[event.results.length - 1];
        if (!result.isFinal) return;

        const spoken = result[0].transcript.trim();
        if (!spoken) return;

        console.log("HEARD:", spoken);

        if (!edithStarted) {
            if (!spoken.toLowerCase().includes("edith")) return;

            edithStarted = true;
            conversationActive = true;

            const firstQuestion = spoken.replace(/edith/gi, "").trim();
            if (!firstQuestion) {
                response.textContent = "Yes. How can I assist?";
                speak("Yes. How can I assist?");
                return;
            }

            await askGemini(firstQuestion);
            return;
        }

        if (conversationActive) {
            await askGemini(spoken);
        }
    };

    recognition.onerror = (event) => {
        console.log("VOICE ERROR:", event.error);
        listening = false;
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            voiceStatus.textContent = "MIC BLOCKED";
            voiceStatus.className = "red";
        }
    };

    recognition.onend = () => {
        listening = false;
        if (mediaStream) {
            setTimeout(startListening, 400);
        }
    };
}

function startListening() {
    if (!recognition) {
        voiceStatus.textContent = "NOT SUPPORTED";
        voiceStatus.className = "red";
        return;
    }
    if (listening) return;

    try {
        recognition.start();
    } catch (error) {
        console.log("Recognition:", error.message);
    }
}

/* =====================================================
   CAMERA CAPTURE FOR VISION
===================================================== */
function captureCamera() {
    if (!camera || camera.readyState < 2 || camera.videoWidth <= 0 || camera.videoHeight <= 0) {
        return null;
    }

    const canvas = document.createElement("canvas");
    const maxWidth = 1024;
    const scale = Math.min(1, maxWidth / camera.videoWidth);

    canvas.width = Math.round(camera.videoWidth * scale);
    canvas.height = Math.round(camera.videoHeight * scale);

    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);

    return canvas.toDataURL("image/jpeg", 0.75).split(",")[1];
}

/* =====================================================
   GEMINI API MULTIMODAL QUERY
===================================================== */
async function askGemini(question) {
    if (!apiKey) {
        response.textContent = "Please add your Gemini API key in Settings.";
        settings.style.display = "block";
        return;
    }

    aiStatus.textContent = "ANALYSING";
    aiStatus.className = "yellow";

    const imageData = captureCamera();
    const parts = [
        {
            text: `You are E.D.I.T.H., a futuristic tactical augmented AI assistant.
The user asked:
"${question}"
Keep answers concise and clear (1 to 2 sentences).`
        }
    ];

    if (imageData) {
        parts.push({
            inline_data: {
                mime_type: "image/jpeg",
                data: imageData
            }
        });
    }

    const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(apiKey);
    let result = null;
    let lastError = "";

    for (let attempt = 1; attempt <= 3; attempt++) {
        response.textContent = attempt === 1 ? "ANALYSING..." : "GEMINI BUSY — RETRYING...";

        try {
            result = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts }] })
            });
        } catch (networkError) {
            lastError = networkError.message;
            break;
        }

        if (result.ok) break;

        lastError = await result.text();
        if (result.status === 503 || result.status === 429) {
            await new Promise(resolve => setTimeout(resolve, attempt * 2500));
            continue;
        }
        break;
    }

    if (!result || !result.ok) {
        aiStatus.textContent = "ERROR";
        aiStatus.className = "red";
        response.textContent = "Gemini connection error.";
        errorBox.textContent = lastError;
        return;
    }

    try {
        const data = await result.json();
        const answer = data?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!answer) throw new Error("Gemini returned no answer.");

        aiStatus.textContent = "ONLINE";
        aiStatus.className = "green";
        response.textContent = answer;
        speak(answer);
    } catch (error) {
        console.error("RESPONSE ERROR:", error);
        aiStatus.textContent = "ERROR";
        aiStatus.className = "red";
        response.textContent = "I couldn't read the AI response.";
    }
}

/* =====================================================
   TEXT TO SPEECH
===================================================== */
function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-GB";
    utterance.rate = 1.05;
    utterance.pitch = 0.92;

    utterance.onstart = () => { voiceStatus.textContent = "SPEAKING"; };
    utterance.onend = () => { voiceStatus.textContent = "LISTENING"; };

    window.speechSynthesis.speak(utterance);
}

/* =====================================================
   INITIALIZATION
===================================================== */
startButton.onclick = async () => {
    startButton.disabled = true;
    startButton.textContent = "INITIALIZING...";

    const ok = await startMedia();
    if (!ok) {
        startButton.disabled = false;
        startButton.textContent = "TRY AGAIN";
        return;
    }

    start.style.display = "none";

    if (recognition) {
        startListening();
    }
};

/* =====================================================
   WEBXR PASSTHROUGH (FULL SITE ATTACHED)
===================================================== */
let xrSession = null;
let xrReferenceSpace = null;
let xrGL = null;
let xrStarting = false;

async function checkWebXR() {
    if (!navigator.xr) {
        vrStatus.textContent = "NOT AVAILABLE";
        vrStatus.className = "red";
        return;
    }

    try {
        const arSupported = await navigator.xr.isSessionSupported("immersive-ar");
        const vrSupported = await navigator.xr.isSessionSupported("immersive-vr");

        if (arSupported || vrSupported) {
            vrStatus.textContent = "READY";
            vrStatus.className = "green";
            vrButton.style.display = "block";
            vrButton.textContent = arSupported ? "ENTER PASSTHROUGH" : "ENTER VR";
        } else {
            vrStatus.textContent = "NOT SUPPORTED";
            vrStatus.className = "yellow";
        }
    } catch (error) {
        console.error("WebXR check error:", error);
        vrStatus.textContent = "UNAVAILABLE";
        vrStatus.className = "red";
    }
}

vrButton.onclick = async (e) => {
    e.preventDefault();

    if (xrStarting) return;
    xrStarting = true;

    if (xrSession) {
        try {
            await xrSession.end();
        } catch (err) {
            console.warn(err);
        } finally {
            xrSession = null;
            xrStarting = false;
        }
        return;
    }

    try {
        const arSupported = await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
        const mode = arSupported ? "immersive-ar" : "immersive-vr";

        // Point DOM Overlay to document.body so the entire website overlays passthrough
        const sessionOptions = {
            requiredFeatures: ["local-floor", "dom-overlay"],
            optionalFeatures: ["unbounded"],
            domOverlay: { root: document.body }
        };

        const session = await navigator.xr.requestSession(mode, sessionOptions);
        xrSession = session;

        document.body.style.background = "transparent";
        document.documentElement.style.background = "transparent";
        camera.style.display = "none";

        session.addEventListener("end", onXREnd);

        vrButton.textContent = "EXIT VR";
        vrStatus.textContent = "PASSTHROUGH ACTIVE";
        vrStatus.className = "green";

        await startXR(session);
    } catch (error) {
        console.error("WEBXR ERROR:", error);
        vrStatus.textContent = "ERROR";
        vrStatus.className = "red";
        response.textContent = "Could not enter VR: " + error.message;
    } finally {
        xrStarting = false;
    }
};

function onXREnd() {
    xrSession = null;
    xrReferenceSpace = null;
    xrStarting = false;

    document.body.style.background = "#020609";
    document.documentElement.style.background = "#020609";
    if (mediaStream) {
        camera.style.display = "block";
    }

    vrButton.textContent = "ENTER PASSTHROUGH";
    vrStatus.textContent = "READY";
    vrStatus.className = "green";
}

async function startXR(session) {
    try {
        const canvas = document.createElement("canvas");
        xrGL = canvas.getContext("webgl", {
            xrCompatible: true,
            alpha: true,
            premultipliedAlpha: false
        });

        if (!xrGL) throw new Error("WebGL unavailable.");

        await xrGL.makeXRCompatible();

        const layer = new XRWebGLLayer(session, xrGL, { alpha: true });
        session.updateRenderState({ baseLayer: layer });

        try {
            xrReferenceSpace = await session.requestReferenceSpace("unbounded");
        } catch (e) {
            try {
                xrReferenceSpace = await session.requestReferenceSpace("local-floor");
            } catch (err) {
                xrReferenceSpace = await session.requestReferenceSpace("local");
            }
        }

        session.requestAnimationFrame(xrFrame);
    } catch (error) {
        console.error("XR START ERROR:", error);
    }
}

function xrFrame(time, frame) {
    const session = frame.session;
    if (!session) return;

    const pose = frame.getViewerPose(xrReferenceSpace);

    if (pose) {
        const layer = session.renderState.baseLayer;
        xrGL.bindFramebuffer(xrGL.FRAMEBUFFER, layer.framebuffer);

        // Alpha clear to 0 lets the real-world cameras render behind the entire website
        xrGL.clearColor(0, 0, 0, 0);
        xrGL.clear(xrGL.COLOR_BUFFER_BIT | xrGL.DEPTH_BUFFER_BIT);
    }

    session.requestAnimationFrame(xrFrame);
}

checkWebXR();
</script>

</body>
</html>
